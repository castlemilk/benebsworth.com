      <rect x="924" y="493" width="556" height="422" class="dark-guide"/>
      <text x="936" y="533" class="dark-ink" font-size="27.2" font-weight="450">Full entry title</text>
      <text x="936" y="577" class="dark-ink" font-size="27.2" font-weight="450">continues on a new line.</text>
      <text x="936" y="631" class="label dark-muted" font-size="14">ENTRY TYPE · SOURCE TRAIL</text>

      <path d="M936 649V795" stroke="#afb3ac" stroke-width="1" fill="none"/>
      <text x="953" y="681" class="label dark-muted" font-size="14">SOURCE STATE</text>
      <text x="953" y="713" class="dark-ink" font-size="18">Source title</text>
      <path d="M953 717H1046" stroke="#ecebe6" stroke-width="1"/>
      <text x="953" y="750" class="mono dark-muted" font-size="12">Exact source locator</text>
      <text x="953" y="779" class="utility dark-muted" font-size="15">Provenance and supplied limits</text>
      <text x="936" y="834" class="dark-ink" font-size="18">Consumer-supplied context.</text>
      <rect x="936" y="858" width="156" height="44" rx="4" fill="none" stroke="#ecebe6" stroke-width="1"/>
      <text x="1014" y="885" text-anchor="middle" class="utility dark-ink" font-size="15">Read destination</text>
      <path d="M936 922H1468" class="dark-rule"/>
      <text x="936" y="953" class="utility dark-ink" font-size="16">Identity and original tags</text>
    </g>

    <g id="inspector-callouts" inkscape:label="Inspector documentation annotations">
      <path d="M1494 480H1505" class="dark-callout"/>
      <text x="1517" y="502" class="utility dark-red" font-size="16">Header</text>
      <text x="1517" y="523" class="utility dark-muted" font-size="14">Outside</text>
      <text x="1517" y="542" class="utility dark-muted" font-size="14">the scroller</text>
      <path d="M1480 645H1505" class="dark-callout"/>
      <text x="1517" y="642" class="utility dark-red" font-size="16">Body</text>
      <text x="1517" y="663" class="utility dark-muted" font-size="14">Full title</text>
      <text x="1517" y="682" class="utility dark-muted" font-size="14">and sources</text>
