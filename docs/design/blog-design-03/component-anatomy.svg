      <text x="248" y="426" class="utility" font-size="12">Selected</text>
      <text x="139" y="467" font-size="25.6" font-weight="450">Entry title</text>
      <text x="139" y="502" font-size="17">Consumer-supplied summary.</text>
      <text x="139" y="543" class="utility muted" font-size="13">Original tags</text>
      <path d="M139 549H210" class="rule"/>
      <rect x="139" y="566" width="150" height="44" class="guide"/>
      <text x="139" y="593" class="utility" font-size="15">Read destination</text>
      <path d="M139 598H237" stroke="#202c34" stroke-width="1"/>
      <rect x="305" y="566" width="100" height="44" rx="4" fill="none" stroke="#56616b" stroke-width="1"/>
      <text x="355" y="593" text-anchor="middle" class="utility" font-size="15">Inspect</text>
      <path d="M120 634H570" class="rule"/>

      <path d="M104 388V412 M99 388H109 M99 412H109" class="callout"/>
      <path d="M104 388H583L603 397" class="callout"/>
      <text x="615" y="402" class="utility red" font-size="16">24 px padding</text>
      <text x="615" y="423" class="utility muted" font-size="14">Top and bottom</text>
      <path d="M262 461H603" class="callout"/>
      <circle cx="262" cy="461" r="2.5" fill="#b32624"/>
      <text x="615" y="465" class="utility red" font-size="16">Title / href</text>
      <text x="615" y="486" class="utility muted" font-size="14">Native content link</text>
      <path d="M418 566V610 M413 566H423 M413 610H423 M423 588H603" class="callout"/>
      <text x="615" y="585" class="utility red" font-size="16">44 px minimum</text>
      <text x="615" y="606" class="utility muted" font-size="14">Separate action target</text>
    </g>

    <g id="citation-anatomy" inkscape:label="Source citation slots">
      <text x="120" y="674" class="label muted" font-size="13">SOURCE CITATION</text>
      <path d="M120 692V840" stroke="#56616b" stroke-width="1" fill="none"/>
      <text x="137" y="724" class="label muted" font-size="14">SOURCE STATE</text>
      <text x="457" y="724" class="mono muted" font-size="12">revision?</text>
      <path d="M137 729H570 M137 737H570" class="guide"/>
      <text x="137" y="756" font-size="18">Source title</text>
      <path d="M137 760H230" stroke="#202c34" stroke-width="1"/>
      <text x="137" y="793" class="mono muted" font-size="12">Exact source locator</text>
      <text x="137" y="821" class="utility muted" font-size="15">Provenance and supplied limits</text>

      <path d="M583 729V737 M578 729H588 M578 737H588 M588 733H603" class="callout"/>
      <text x="615" y="737" class="utility red" font-size="16">8 px spacing</text>
      <text x="615" y="758" class="utility muted" font-size="14">After the state row</text>
      <path d="M313 789H603" class="callout"/>
      <circle cx="313" cy="789" r="2.5" fill="#b32624"/>
      <text x="615" y="795" class="utility red" font-size="16">Locator wraps</text>
      <text x="615" y="816" class="utility muted" font-size="14">Selectable text</text>
    </g>

    <path d="M120 879H736" class="rule"/>
    <text x="120" y="916" class="note" font-size="28">Separate link + button.</text>
    <text x="120" y="949" class="utility muted" font-size="17">A content link navigates. Inspect opens the source trail.</text>
    <text x="120" y="979" class="utility muted" font-size="17">The title, original tags and source meaning belong to the consumer.</text>
    <text x="120" y="1024" class="label muted" font-size="12">SLOTS SHOW ANATOMY, NOT ARTICLE CONTENT OR REVIEW STATUS</text>
  </g>

  <g id="inspector-panel" inkscape:label="Dark inspector anatomy">
    <rect x="872" y="260" width="760" height="802" fill="#111312"/>
    <text x="904" y="297" class="label dark-muted" font-size="14">INSPECTOR / DARK</text>
    <text x="904" y="338" class="dark-ink" font-size="32" font-weight="450" letter-spacing="-.7">Keep the exit in place.</text>

    <g id="inspector-boundary" inkscape:label="Native dialog boundary">
