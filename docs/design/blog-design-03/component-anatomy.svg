  <g id="source-and-scale-notes" inkscape:label="Source and scale notes">
    <text x="48" y="1102" class="utility muted" font-size="17">Dimensions follow workbench.module.css. Desktop inspector spacing shown; at ≤760px, header/body padding is 20px.</text>
    <text x="48" y="1129" class="utility muted" font-size="16">Fonts use existing Source Serif 4, Barlow Condensed and Caveat assets. Layout and wrapping are schematic; interaction needs browser acceptance.</text>
    <text x="1632" y="1129" text-anchor="end" class="label muted" font-size="12">DESIGN 03 · 17 NOV 2026</text>
