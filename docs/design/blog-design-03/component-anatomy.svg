<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1680" height="1160" viewBox="0 0 1680 1160" role="img" aria-labelledby="drawing-title drawing-description">
  <title id="drawing-title">Editorial component anatomy and spacing contract</title>
  <desc id="drawing-description">An original editable contract drawing, not a browser capture. The light panel identifies the entity and source citation slots. The dark panel identifies a compact persistent inspector header and a separately scrolling body containing the full title. Dimensions are taken from the local editorial workbench CSS: entity padding-block 24 pixels; button minimum height 44 pixels; citation state-row margin-bottom 8 pixels; desktop inspector header and body padding 24 pixels. Content labels name slots and assert no article, source, measurement or scientific fact. The drawing does not prove rendered behavior or deployment.</desc>
  <metadata>
    {
      "kind": "original editable documentation drawing",
      "created": "2026-11-17",
      "status": "source-informed contract; not browser evidence or deployed state",
      "sourceFiles": [
        "components/editorial-workbench/workbench.module.css",
        "components/editorial-workbench/primitives.tsx",
        "components/editorial-workbench/controls.tsx"
      ],
      "dimensions": {
        ".entity padding-block": "24px",
        ".button min-height": "44px",
        ".citationTop margin-bottom": "8px",
        ".dialogHeader padding": "24px desktop; 20px at max-width 760px",
        ".dialogScroll padding": "24px desktop; 20px at max-width 760px"
      },
      "fonts": "Existing public/fonts/editorial files; no new font assets or dependencies",
      "content": "Schematic slot labels only; no scientific or source claims"
    }
  </metadata>
  <defs>
    <style><![CDATA[
      @font-face { font-family: 'Source Serif 4'; src: url('../../../public/fonts/editorial/source-serif-4.woff') format('woff'); font-weight: 200 900; }
      @font-face { font-family: 'Barlow Condensed'; src: url('../../../public/fonts/editorial/barlow-condensed-semibold.ttf') format('truetype'); font-weight: 600; }
      @font-face { font-family: 'Caveat'; src: url('../../../public/fonts/editorial/caveat.ttf') format('truetype'); font-weight: 400 700; }
      text { fill: #202c34; font-family: 'Source Serif 4', Georgia, serif; }
      .label { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 600; letter-spacing: 1px; }
      .utility { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 600; }
      .mono { font-family: monospace; }
      .note { font-family: Caveat, cursive; font-weight: 400; fill: #b32624; }
      .muted { fill: #56616b; }
      .red { fill: #b32624; }
      .dark-ink { fill: #ecebe6; }
      .dark-muted { fill: #afb3ac; }
      .dark-red { fill: #ffaaa5; }
      .rule { fill: none; stroke: #bcc0ba; stroke-width: 1; }
      .dark-rule { fill: none; stroke: #626862; stroke-width: 1; }
      .callout { fill: none; stroke: #b32624; stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }
      .dark-callout { fill: none; stroke: #ffaaa5; stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }
      .guide { fill: none; stroke: #b32624; stroke-width: 1; stroke-dasharray: 3 5; opacity: .5; }
      .dark-guide { fill: none; stroke: #afb3ac; stroke-width: 1; stroke-dasharray: 4 5; opacity: .55; }
    ]]></style>
    <clipPath id="inspector-body-clip"><rect x="913" y="481" width="578" height="447"/></clipPath>
    <pattern id="scroll-cut" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 8 8-2 M6 10 10 6" fill="none" stroke="#626862" stroke-width="1"/></pattern>
  </defs>

  <g id="sheet" inkscape:label="Document frame">
    <rect width="1680" height="1160" fill="#fbf9f3"/>
    <text x="48" y="51" class="label muted" font-size="14">BEN EBSWORTH / EDITORIAL WORKBENCH</text>
    <text x="48" y="113" font-size="46" font-weight="450" letter-spacing="-1.3">An entry, with its evidence.</text>
    <text x="50" y="151" class="utility muted" font-size="19">Two reusable component contracts: reading context on the left, a source inspector on the right.</text>
    <rect x="48" y="184" width="1584" height="44" fill="none" stroke="#b32624" stroke-width="1.5"/>
    <text x="68" y="213" class="label red" font-size="20">CONTRACT DRAWING / NOT A BROWSER CAPTURE</text>
    <text x="1609" y="211" text-anchor="end" class="utility muted" font-size="16">Editable text and geometry · slot labels only · no factual claims</text>
  </g>

  <g id="entity-and-source-panel" inkscape:label="Light entity and source anatomy">
    <rect x="48" y="260" width="760" height="802" fill="#f4f1e9"/>
    <text x="80" y="297" class="label muted" font-size="14">ENTITY + SOURCE / LIGHT</text>
    <text x="80" y="338" font-size="32" font-weight="450" letter-spacing="-.7">Name the work. Keep its trail.</text>

