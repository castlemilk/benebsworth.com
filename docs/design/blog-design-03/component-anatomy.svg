      <path d="M912 481H1492" class="dark-rule"/>
      <text x="936" y="439" class="label dark-muted" font-size="14">INSPECTING · ENTRY TYPE</text>
      <rect x="1318" y="412" width="150" height="44" rx="4" fill="#181b1a" stroke="#afb3ac" stroke-width="1"/>
      <text x="1393" y="439" text-anchor="middle" class="utility dark-ink" font-size="15">Close inspector</text>

      <path d="M912 375H936 M912 370V380 M936 370V380" class="dark-callout"/>
      <text x="949" y="380" class="utility dark-red" font-size="16">24 px padding</text>
      <text x="1097" y="380" class="utility dark-muted" font-size="14">Desktop header and body</text>
      <path d="M1480 412V456 M1475 412H1485 M1475 456H1485 M1485 434H1505" class="dark-callout"/>
      <text x="1517" y="432" class="utility dark-red" font-size="16">44 px</text>
      <text x="1517" y="453" class="utility dark-muted" font-size="14">Min. target</text>
    </g>

