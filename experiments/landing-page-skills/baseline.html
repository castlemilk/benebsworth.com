/* ---------- animated stat counters (first render only) ---------- */
function countUp(){
  var els=rootEl.querySelectorAll('[data-count]');if(!els.length)return;
  var t0=performance.now(),D=950;
  function step(now){
    var k=Math.min(1,(now-t0)/D),any=false;
    for(var i=0;i<els.length;i++){
      var el=els[i];if(!el.isConnected)continue;
      var target=parseFloat(el.getAttribute('data-count'))||0;
      var dec=parseInt(el.getAttribute('data-dec'),10)||0;
      var suf=el.getAttribute('data-suf')||'';
      var e=1-Math.pow(1-k,3),v=target*e;
      el.textContent=(dec?v.toFixed(dec):Math.round(v).toLocaleString('en-US'))+suf;
      any=true;
    }
    if(k<1&&any)requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ---------- boot ---------- */
applyTheme();
renderApp();
countUp();

}catch(e){try{showErr(e)}catch(_){}}
