<title id="el03-sequence-title">From trace to structure</title>
<desc id="el03-sequence-description">A continuous illustrated ribbon changes form along its length. Shared vertices make the authored surfaces connected; this does not establish a physically foldable strip, a temporal sequence or a mathematical surface.</desc>
