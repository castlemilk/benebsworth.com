<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <style>
    .dark [fill="#2563eb"]{fill:#6aa8f8}
    .dark [stroke="#2563eb"]{stroke:#6aa8f8}
    .dark [fill="#374151"]{fill:#e5e7eb}
    .dark [stroke="#374151"]{stroke:#e5e7eb}
    .dark [fill="#3b82f6"]{fill:#7cb3f8}
    .dark [stroke="#3b82f6"]{stroke:#7cb3f8}
    .dark [fill="#6b7280"]{fill:#a4adba}
    .dark [stroke="#6b7280"]{stroke:#a4adba}
    .dark [fill="#9ca3af"]{fill:#c3cad4}
    .dark [stroke="#9ca3af"]{stroke:#c3cad4}
    .dark [fill="#b45309"]{fill:#fbbf24}
    .dark [stroke="#b45309"]{stroke:#fbbf24}
    .dark [fill="#f59e0b"]{fill:#fbbf24}
    .dark [stroke="#f59e0b"]{stroke:#fbbf24}
  </style>

  <!-- Screen then cost: four filters in order of cheap rejection -->
  <defs>
    <marker id="arrF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <text x="350" y="40" text-anchor="middle" font-size="12.5" fill="#6b7280">screen first: each filter kills candidates before the next one costs effort</text>

  <!-- check zero sits above the funnel -->
  <rect x="240" y="56" width="220" height="34" rx="17" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="350" y="77" text-anchor="middle" font-size="11.5" fill="#374151">check 0: does this need ML at all?</text>
  <line x1="350" y1="90" x2="350" y2="104" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrF)"/>

  <!-- four screens -->
  <g>
    <rect x="60" y="106" width="580" height="44" rx="6" fill="#3b82f6" fill-opacity="0.10" stroke="#2563eb" stroke-width="1.3"/>
    <text x="80" y="133" font-size="12.5" font-weight="600" fill="#2563eb">1 · privacy</text>
    <text x="620" y="126" text-anchor="end" font-size="11" fill="#6b7280">a law forbids it: free rejection</text>
    <text x="620" y="142" text-anchor="end" font-size="11" fill="#9ca3af">no measurement needed</text>
  </g>
  <g>
    <rect x="100" y="158" width="500" height="44" rx="6" fill="#3b82f6" fill-opacity="0.16" stroke="#2563eb" stroke-width="1.3"/>
    <text x="120" y="185" font-size="12.5" font-weight="600" fill="#2563eb">2 · latency</text>
    <text x="580" y="178" text-anchor="end" font-size="11" fill="#6b7280">locality lower bound vs deadline</text>
    <text x="580" y="194" text-anchor="end" font-size="11" fill="#9ca3af">one inequality decides</text>
  </g>
  <g>
    <rect x="140" y="210" width="420" height="44" rx="6" fill="#f59e0b" fill-opacity="0.14" stroke="#b45309" stroke-width="1.3"/>
    <text x="160" y="237" font-size="12.5" font-weight="600" fill="#b45309">3 · resource</text>
    <text x="540" y="230" text-anchor="end" font-size="11" fill="#6b7280">capacity · sustained compute · energy</text>
    <text x="540" y="246" text-anchor="end" font-size="11" fill="#9ca3af">needs device specs</text>
  </g>
  <g>
    <rect x="180" y="262" width="340" height="44" rx="6" fill="#f59e0b" fill-opacity="0.2" stroke="#b45309" stroke-width="1.3"/>
    <text x="200" y="289" font-size="12.5" font-weight="600" fill="#b45309">4 · cost</text>
    <text x="500" y="282" text-anchor="end" font-size="11" fill="#6b7280">TCO compares survivors</text>
    <text x="500" y="298" text-anchor="end" font-size="11" fill="#9ca3af">the only filter that doesn't reject</text>
  </g>

  <!-- exits -->
  <text x="606" y="179" font-size="10" fill="#6b7280">∅ → partition</text>
  <text x="606" y="192" font-size="10" fill="#9ca3af">(hybrid)</text>
  <text x="36" y="330" font-size="11" fill="#9ca3af">survivors move on; a passed bound still needs complete-path measurement</text>
</svg>
