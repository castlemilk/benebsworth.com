<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <style>
    .dark [fill="#1d4ed8"]{fill:#93c5fd}
    .dark [stroke="#1d4ed8"]{stroke:#93c5fd}
    .dark [fill="#2563eb"]{fill:#6aa8f8}
    .dark [stroke="#2563eb"]{stroke:#6aa8f8}
    .dark [fill="#374151"]{fill:#e5e7eb}
    .dark [stroke="#374151"]{stroke:#e5e7eb}
    .dark [fill="#3b82f6"]{fill:#7cb3f8}
    .dark [stroke="#3b82f6"]{stroke:#7cb3f8}
    .dark [fill="#4b5563"]{fill:#d1d5db}
    .dark [stroke="#4b5563"]{stroke:#d1d5db}
    .dark [fill="#6b7280"]{fill:#a4adba}
    .dark [stroke="#6b7280"]{stroke:#a4adba}
    .dark [fill="#92400e"]{fill:#fbbf24}
    .dark [stroke="#92400e"]{stroke:#fbbf24}
    .dark [fill="#991b1b"]{fill:#f87171}
    .dark [stroke="#991b1b"]{stroke:#f87171}
    .dark [fill="#9ca3af"]{fill:#c3cad4}
    .dark [stroke="#9ca3af"]{stroke:#c3cad4}
    .dark [fill="#b91c1c"]{fill:#f87171}
    .dark [stroke="#b91c1c"]{stroke:#f87171}
    .dark [fill="#d97706"]{fill:#f59e0b}
    .dark [stroke="#d97706"]{stroke:#f59e0b}
    .dark [fill="#dc2626"]{fill:#f87171}
    .dark [stroke="#dc2626"]{stroke:#f87171}
    .dark [fill="#f59e0b"]{fill:#fbbf24}
    .dark [stroke="#f59e0b"]{stroke:#fbbf24}
  </style>

  <!-- Data cascade: defect enters at collection, converts to derived state each stage, surfaces at deploy; remediation cost widens -->
  <defs>
    <marker id="arrC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="350" y="26" text-anchor="middle" font-size="13" font-weight="600" fill="#374151">A data defect entered early is converted, not caught</text>

  <!-- remediation-cost band: widens left to right -->
  <path d="M52,236 L648,236 L648,316 L52,262 Z" fill="#dc2626" fill-opacity="0.10"/>
  <path d="M52,236 L648,236 L648,316 L52,262 Z" fill="none" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 3" stroke-opacity="0.5"/>
  <text x="350" y="336" text-anchor="middle" font-size="11" fill="#b91c1c">remediation cost = every downstream artifact that consumed the defect</text>

  <!-- stages -->
  <g>
    <rect x="40" y="60" width="96" height="52" rx="6" fill="#f59e0b" fill-opacity="0.16" stroke="#d97706" stroke-width="1.4"/>
    <text x="88" y="80" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">COLLECT</text>
    <text x="88" y="96" text-anchor="middle" font-size="9" fill="#6b7280">defect enters</text>
  </g>
  <g>
    <rect x="146" y="60" width="96" height="52" rx="6" fill="#3b82f6" fill-opacity="0.12" stroke="#2563eb" stroke-width="1.2"/>
    <text x="194" y="80" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">INGEST</text>
    <text x="194" y="96" text-anchor="middle" font-size="9" fill="#6b7280">passes schema</text>
  </g>
  <g>
    <rect x="252" y="60" width="96" height="52" rx="6" fill="#3b82f6" fill-opacity="0.12" stroke="#2563eb" stroke-width="1.2"/>
    <text x="300" y="80" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">LABEL</text>
    <text x="300" y="96" text-anchor="middle" font-size="9" fill="#6b7280">baked into spec</text>
  </g>
  <g>
    <rect x="358" y="60" width="96" height="52" rx="6" fill="#3b82f6" fill-opacity="0.12" stroke="#2563eb" stroke-width="1.2"/>
    <text x="406" y="80" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">PROCESS</text>
    <text x="406" y="96" text-anchor="middle" font-size="9" fill="#6b7280">derived features</text>
  </g>
  <g>
    <rect x="464" y="60" width="96" height="52" rx="6" fill="#3b82f6" fill-opacity="0.12" stroke="#2563eb" stroke-width="1.2"/>
    <text x="512" y="80" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">TRAIN</text>
    <text x="512" y="96" text-anchor="middle" font-size="9" fill="#6b7280">learned behavior</text>
  </g>
  <g>
    <rect x="570" y="60" width="96" height="52" rx="6" fill="#dc2626" fill-opacity="0.16" stroke="#dc2626" stroke-width="1.4"/>
    <text x="618" y="80" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">DEPLOY</text>
    <text x="618" y="96" text-anchor="middle" font-size="9" fill="#6b7280">failure surfaces</text>
  </g>

  <!-- forward arrows -->
  <line x1="136" y1="86" x2="146" y2="86" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrC)"/>
  <line x1="242" y1="86" x2="252" y2="86" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrC)"/>
  <line x1="348" y1="86" x2="358" y2="86" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrC)"/>
  <line x1="454" y1="86" x2="464" y2="86" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrC)"/>
  <line x1="560" y1="86" x2="570" y2="86" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrC)"/>

  <!-- the defect: red dot riding the pipeline -->
  <circle cx="88" cy="48" r="6" fill="#dc2626"/>
  <text x="100" y="44" font-size="10" fill="#b91c1c">defect (mislabel, retype, stale slice)</text>
  <path d="M88,54 L88,58" stroke="#dc2626" stroke-width="1.4"/>
  <g stroke="#dc2626" stroke-opacity="0.55" stroke-width="1.4">
    <circle cx="194" cy="48" r="4" fill="#dc2626" fill-opacity="0.55"/>
    <circle cx="300" cy="48" r="4.5" fill="#dc2626" fill-opacity="0.6"/>
    <circle cx="406" cy="48" r="5" fill="#dc2626" fill-opacity="0.65"/>
    <circle cx="512" cy="48" r="5.5" fill="#dc2626" fill-opacity="0.7"/>
  </g>
  <text x="350" y="132" text-anchor="middle" font-size="10" fill="#6b7280">each stage converts the defect into new derived state - the root cause gets harder to see</text>

  <!-- silence property -->
  <rect x="40" y="150" width="626" height="40" rx="6" fill="#6b7280" fill-opacity="0.08" stroke="#9ca3af" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="353" y="168" text-anchor="middle" font-size="11" font-weight="600" fill="#4b5563">WHY IT'S EXPENSIVE: silence</text>
  <text x="353" y="182" text-anchor="middle" font-size="10" fill="#6b7280">a crash raises a stack trace; a data error emits valid-looking outputs that are less accurate</text>

  <!-- rework arrows: deploy back to every stage -->
  <g stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3 3" fill="none" marker-end="url(#arrR)">
    <path d="M618,112 C600,200 560,214 512,214 L512,118"/>
    <path d="M618,112 C590,208 470,224 406,224 L406,118"/>
    <path d="M618,112 C580,216 380,234 300,234 L300,118"/>
    <path d="M618,112 C560,224 260,240 194,242 L194,118"/>
    <path d="M618,112 C540,230 150,246 88,250 L88,118"/>
  </g>
  <text x="618" y="206" text-anchor="end" font-size="10" fill="#b91c1c">rebuild + revalidate each</text>
</svg>
