<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <style>
    .dark [fill="#047857"]{fill:#34d399}
    .dark [stroke="#047857"]{stroke:#34d399}
    .dark [fill="#059669"]{fill:#34d399}
    .dark [stroke="#059669"]{stroke:#34d399}
    .dark [fill="#10b981"]{fill:#4ade80}
    .dark [stroke="#10b981"]{stroke:#4ade80}
    .dark [fill="#1d4ed8"]{fill:#93c5fd}
    .dark [stroke="#1d4ed8"]{stroke:#93c5fd}
    .dark [fill="#2563eb"]{fill:#6aa8f8}
    .dark [stroke="#2563eb"]{stroke:#6aa8f8}
    .dark [fill="#374151"]{fill:#e5e7eb}
    .dark [stroke="#374151"]{stroke:#e5e7eb}
    .dark [fill="#3b82f6"]{fill:#7cb3f8}
    .dark [stroke="#3b82f6"]{stroke:#7cb3f8}
    .dark [fill="#4b5563"]{fill:#d1d5db}
    .dark [stroke="#4b5563"]{stroke:#d1d5db}
    .dark [fill="#6b7280"]{fill:#a4adba}
    .dark [stroke="#6b7280"]{stroke:#a4adba}
    .dark [fill="#92400e"]{fill:#fbbf24}
    .dark [stroke="#92400e"]{stroke:#fbbf24}
    .dark [fill="#9ca3af"]{fill:#c3cad4}
    .dark [stroke="#9ca3af"]{stroke:#c3cad4}
    .dark [fill="#b91c1c"]{fill:#f87171}
    .dark [stroke="#b91c1c"]{stroke:#f87171}
    .dark [fill="#d97706"]{fill:#f59e0b}
    .dark [stroke="#d97706"]{stroke:#f59e0b}
    .dark [fill="#f59e0b"]{fill:#fbbf24}
    .dark [stroke="#f59e0b"]{stroke:#fbbf24}
  </style>
  <defs>
    <marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <text x="350" y="26" text-anchor="middle" font-size="13" font-weight="600" fill="#374151">Training holds four kinds of state; inference keeps one</text>
  <text x="350" y="43" text-anchor="middle" font-size="10" fill="#6b7280">running network at batch 32, FP32 - simplified single-device accounting</text>

  <!-- TRAINING stack -->
  <g font-size="10">
    <text x="175" y="75" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">training step ~1.3 MB</text>
    <rect x="60" y="90" width="230" height="34" rx="4" fill="none" stroke="#2563eb" stroke-width="1.5"/>
    <text x="175" y="111" text-anchor="middle" fill="#2563eb">W weights - 437.5 KB (persistent)</text>
    <rect x="60" y="128" width="230" height="34" rx="4" fill="none" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="175" y="149" text-anchor="middle" fill="#b91c1c">G gradients - 437.5 KB</text>
    <rect x="60" y="166" width="230" height="34" rx="4" fill="none" stroke="#d97706" stroke-width="1.5"/>
    <text x="175" y="187" text-anchor="middle" fill="#92400e">O optimizer state - 437.5 KB</text>
    <rect x="60" y="204" width="230" height="52" rx="4" fill="none" stroke="#047857" stroke-width="1.5"/>
    <text x="175" y="224" text-anchor="middle" fill="#047857">A saved activations - ~26 KB</text>
    <text x="175" y="241" text-anchor="middle" font-size="9" fill="#6b7280">every layer output live until backward reaches it</text>
    <text x="175" y="285" text-anchor="middle" font-size="9" fill="#6b7280">memory peaks at the forward/backward turnaround</text>
  </g>

  <!-- arrow -->
  <line x1="300" y1="175" x2="392" y2="175" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrS)"/>
  <text x="346" y="165" text-anchor="middle" font-size="9" fill="#6b7280">deploy:</text>
  <text x="346" y="190" text-anchor="middle" font-size="9" fill="#6b7280">freeze + drop 3 terms</text>

  <!-- INFERENCE stack -->
  <g font-size="10">
    <text x="525" y="75" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">inference ~462 KB</text>
    <rect x="410" y="90" width="230" height="34" rx="4" fill="none" stroke="#2563eb" stroke-width="1.5"/>
    <text x="525" y="111" text-anchor="middle" fill="#2563eb">W weights - 437.5 KB (persistent)</text>
    <rect x="410" y="128" width="230" height="52" rx="4" fill="none" stroke="#047857" stroke-width="1.5" stroke-dasharray="6 3"/>
    <text x="525" y="149" text-anchor="middle" fill="#047857">rolling pair - ~25 KB</text>
    <text x="525" y="166" text-anchor="middle" font-size="9" fill="#6b7280">layer l buffer dies when l+1 finishes</text>
    <text x="525" y="204" text-anchor="middle" font-size="9" fill="#6b7280">G and O are zero; A is one pair, not L sets</text>
    <text x="525" y="221" text-anchor="middle" font-size="9" fill="#6b7280">batch B multiplies the pair, not W</text>
  </g>

  <!-- takeaway -->
  <text x="350" y="330" text-anchor="middle" font-size="10" font-weight="600" fill="#b91c1c">~3x memory for identical weights and identical forward arithmetic</text>
  <text x="350" y="347" text-anchor="middle" font-size="9" fill="#6b7280">the whole delta is state training keeps and inference drops</text>
</svg>
