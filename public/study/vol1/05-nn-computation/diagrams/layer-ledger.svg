<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <style>
    .dark [fill="#047857"]{fill:#34d399}
    .dark [stroke="#047857"]{stroke:#34d399}
    .dark [fill="#059669"]{fill:#34d399}
    .dark [stroke="#059669"]{stroke:#34d399}
    .dark [fill="#10b981"]{fill:#4ade80}
    .dark [stroke="#10b981"]{stroke:#4ade80}
    .dark [fill="#1d4ed8"]{fill:#93c5fd}
    .dark [stroke="#1d4ed8"]{stroke:#93c5fd}
    .dark [fill="#2563eb"]{fill:#6aa8f8}
    .dark [stroke="#2563eb"]{stroke:#6aa8f8}
    .dark [fill="#374151"]{fill:#e5e7eb}
    .dark [stroke="#374151"]{stroke:#e5e7eb}
    .dark [fill="#3b82f6"]{fill:#7cb3f8}
    .dark [stroke="#3b82f6"]{stroke:#7cb3f8}
    .dark [fill="#4b5563"]{fill:#d1d5db}
    .dark [stroke="#4b5563"]{stroke:#d1d5db}
    .dark [fill="#6b7280"]{fill:#a4adba}
    .dark [stroke="#6b7280"]{stroke:#a4adba}
    .dark [fill="#92400e"]{fill:#fbbf24}
    .dark [stroke="#92400e"]{stroke:#fbbf24}
    .dark [fill="#9ca3af"]{fill:#c3cad4}
    .dark [stroke="#9ca3af"]{stroke:#c3cad4}
    .dark [fill="#b91c1c"]{fill:#f87171}
    .dark [stroke="#b91c1c"]{stroke:#f87171}
    .dark [fill="#d97706"]{fill:#f59e0b}
    .dark [stroke="#d97706"]{stroke:#f59e0b}
    .dark [fill="#f59e0b"]{fill:#fbbf24}
    .dark [stroke="#f59e0b"]{stroke:#fbbf24}
  </style>

  <!-- Layer ledger: width-proportional bars carrying the cost each shape fixes -->
  <text x="350" y="26" text-anchor="middle" font-size="13" font-weight="600" fill="#374151">Shapes fix the bill before code runs: 784-128-64-10</text>
  <text x="350" y="44" text-anchor="middle" font-size="10" fill="#6b7280">bar length proportional to layer width; each edge is a W matrix plus bias</text>

  <!-- nodes -->
  <g font-size="10" text-anchor="middle">
    <rect x="30" y="150" width="120" height="60" rx="5" fill="none" stroke="#9ca3af" stroke-dasharray="4 3"/>
    <text x="90" y="184" fill="#4b5563">input 784</text>
    <rect x="200" y="158" width="80" height="44" rx="5" fill="none" stroke="#2563eb" stroke-width="1.5"/>
    <text x="240" y="184" fill="#2563eb">128</text>
    <rect x="330" y="166" width="50" height="28" rx="5" fill="none" stroke="#2563eb"/>
    <text x="355" y="184" fill="#2563eb">64</text>
    <rect x="430" y="170" width="40" height="20" rx="5" fill="none" stroke="#2563eb"/>
    <text x="450" y="184" fill="#2563eb" font-size="9">10</text>
  </g>

  <!-- edge cost labels -->
  <g font-size="9" text-anchor="middle" fill="#4b5563">
    <text x="175" y="140" font-weight="600" fill="#b91c1c">W1: 784 x 128</text>
    <text x="175" y="222">100,352 w + 128 b</text>
    <text x="175" y="235">100,352 MACs</text>
    <text x="305" y="140">W2: 128 x 64</text>
    <text x="305" y="222">8,192 w + 64 b</text>
    <text x="305" y="235">8,192 MACs</text>
    <text x="400" y="140">W3: 64 x 10</text>
    <text x="400" y="222">640 w + 10 b</text>
    <text x="400" y="235">640 MACs</text>
  </g>

  <!-- edges -->
  <g stroke="#6b7280" stroke-width="1.5" fill="none">
    <line x1="150" y1="180" x2="200" y2="180"/>
    <line x1="280" y1="180" x2="330" y2="180"/>
    <line x1="380" y1="180" x2="430" y2="180"/>
  </g>

  <!-- 91.9% callout -->
  <g>
    <rect x="30" y="262" width="640" height="86" rx="6" fill="none" stroke="#d97706"/>
    <text x="45" y="285" font-size="10" font-weight="600" fill="#92400e">the ledger: P = 100,480 + 8,256 + 650 = 109,386 params (~438 KB FP32)</text>
    <text x="45" y="303" font-size="10" fill="#4b5563">Ops = 218,368 FLOPs/digit - every weight read once per MAC - width costs quadratically</text>
    <text x="45" y="321" font-size="10" font-weight="600" fill="#b91c1c">layer 1 holds 91.9% of the MACs: input resolution is a cost axis, not just fidelity</text>
    <text x="45" y="338" font-size="9" fill="#6b7280">activations retained for backward scale with B x (128+64+10), not with P</text>
  </g>
</svg>
