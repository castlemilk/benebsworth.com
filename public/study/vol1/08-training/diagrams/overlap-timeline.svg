<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <style>
    .dark [fill="#047857"]{fill:#34d399}
    .dark [stroke="#047857"]{stroke:#34d399}
    .dark [fill="#1d4ed8"]{fill:#93c5fd}
    .dark [stroke="#1d4ed8"]{stroke:#93c5fd}
    .dark [fill="#2563eb"]{fill:#6aa8f8}
    .dark [stroke="#2563eb"]{stroke:#6aa8f8}
    .dark [fill="#374151"]{fill:#e5e7eb}
    .dark [stroke="#374151"]{stroke:#e5e7eb}
    .dark [fill="#4b5563"]{fill:#d1d5db}
    .dark [stroke="#4b5563"]{stroke:#d1d5db}
    .dark [fill="#6b7280"]{fill:#a4adba}
    .dark [stroke="#6b7280"]{stroke:#a4adba}
    .dark [fill="#92400e"]{fill:#fbbf24}
    .dark [stroke="#92400e"]{stroke:#fbbf24}
    .dark [fill="#9ca3af"]{fill:#c3cad4}
    .dark [stroke="#9ca3af"]{stroke:#c3cad4}
    .dark [fill="#b91c1c"]{fill:#f87171}
    .dark [stroke="#b91c1c"]{stroke:#f87171}
    .dark [fill="#d97706"]{fill:#f59e0b}
    .dark [stroke="#d97706"]{stroke:#f59e0b}
    .dark [fill="#bfdbfe"]{fill:#1e3a5f}
    .dark [fill="#dbeafe"]{fill:#1e3a5f}
    .dark [fill="#d1fae5"]{fill:#123a2b}
    .dark [fill="#fef3c7"]{fill:#453007}
    .dark [fill="#fee2e2"]{fill:#4c1d1d}
    .dark [fill="#f3f4f6"]{fill:#1f2937}
    .dark [fill="#ffffff"]{fill:#161a22}
    .dark rect.bg{fill:#0f1115}
    .dark [fill="none"]{fill:none}
  </style>
  <rect class="bg" x="0" y="0" width="700" height="400" fill="#ffffff"/>

  <text x="350" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#374151">Serial cost is the sum; overlapped cost is the max</text>
  <text x="350" y="44" text-anchor="middle" font-size="10" fill="#6b7280">30 ms prepare + 10 ms transfer + 50 ms compute -- 1 ms = 3 px</text>

  <!-- serial timeline: two batches -->
  <text x="60" y="82" font-size="11" font-weight="bold" fill="#374151">serial</text>
  <rect x="60" y="92" width="90" height="26" fill="#fef3c7" stroke="#d97706"/>
  <rect x="150" y="92" width="30" height="26" fill="#fee2e2" stroke="#b91c1c"/>
  <rect x="180" y="92" width="150" height="26" fill="#bfdbfe" stroke="#2563eb"/>
  <rect x="330" y="92" width="90" height="26" fill="#fef3c7" stroke="#d97706"/>
  <rect x="420" y="92" width="30" height="26" fill="#fee2e2" stroke="#b91c1c"/>
  <rect x="450" y="92" width="150" height="26" fill="#bfdbfe" stroke="#2563eb"/>
  <text x="105" y="109" text-anchor="middle" font-size="9" fill="#92400e">prep b1</text>
  <text x="165" y="109" text-anchor="middle" font-size="8" fill="#b91c1c">xfer</text>
  <text x="255" y="109" text-anchor="middle" font-size="9" fill="#1d4ed8">compute b1</text>
  <text x="375" y="109" text-anchor="middle" font-size="9" fill="#92400e">prep b2</text>
  <text x="435" y="109" text-anchor="middle" font-size="8" fill="#b91c1c">xfer</text>
  <text x="525" y="109" text-anchor="middle" font-size="9" fill="#1d4ed8">compute b2</text>
  <!-- interval bracket -->
  <path d="M 60 132 L 60 138 L 330 138 L 330 132" stroke="#374151" stroke-width="1" fill="none"/>
  <text x="195" y="152" text-anchor="middle" font-size="10" fill="#374151">90 ms per batch</text>

  <!-- overlapped lanes -->
  <text x="60" y="196" font-size="11" font-weight="bold" fill="#374151">overlapped</text>
  <text x="60" y="230" font-size="9" fill="#92400e">prep lane</text>
  <rect x="150" y="218" width="90" height="22" fill="#fef3c7" stroke="#d97706"/>
  <rect x="240" y="218" width="90" height="22" fill="#fef3c7" stroke="#d97706"/>
  <rect x="330" y="218" width="90" height="22" fill="#fef3c7" stroke="#d97706"/>
  <rect x="420" y="218" width="90" height="22" fill="#fef3c7" stroke="#d97706"/>
  <rect x="510" y="218" width="90" height="22" fill="#fef3c7" stroke="#d97706"/>
  <text x="195" y="232" text-anchor="middle" font-size="8" fill="#92400e">b1</text>
  <text x="285" y="232" text-anchor="middle" font-size="8" fill="#92400e">b2</text>
  <text x="375" y="232" text-anchor="middle" font-size="8" fill="#92400e">b3</text>
  <text x="465" y="232" text-anchor="middle" font-size="8" fill="#92400e">b4</text>
  <text x="555" y="232" text-anchor="middle" font-size="8" fill="#92400e">b5</text>

  <text x="60" y="272" font-size="9" fill="#b91c1c">xfer lane</text>
  <rect x="240" y="260" width="30" height="22" fill="#fee2e2" stroke="#b91c1c"/>
  <rect x="330" y="260" width="30" height="22" fill="#fee2e2" stroke="#b91c1c"/>
  <rect x="420" y="260" width="30" height="22" fill="#fee2e2" stroke="#b91c1c"/>
  <rect x="510" y="260" width="30" height="22" fill="#fee2e2" stroke="#b91c1c"/>
  <rect x="600" y="260" width="30" height="22" fill="#fee2e2" stroke="#b91c1c"/>

  <text x="60" y="316" font-size="9" fill="#1d4ed8">compute lane</text>
  <rect x="270" y="304" width="150" height="24" fill="#bfdbfe" stroke="#2563eb"/>
  <rect x="420" y="304" width="150" height="24" fill="#bfdbfe" stroke="#2563eb"/>
  <rect x="570" y="304" width="150" height="24" fill="#bfdbfe" stroke="#2563eb"/>
  <text x="345" y="320" text-anchor="middle" font-size="9" fill="#1d4ed8">compute b1</text>
  <text x="495" y="320" text-anchor="middle" font-size="9" fill="#1d4ed8">compute b2</text>
  <text x="645" y="320" text-anchor="middle" font-size="9" fill="#1d4ed8">compute b3</text>

  <!-- steady-state interval guide -->
  <line x1="420" y1="200" x2="420" y2="340" stroke="#047857" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="570" y1="200" x2="570" y2="340" stroke="#047857" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M 420 348 L 420 354 L 570 354 L 570 348" stroke="#047857" stroke-width="1.5" fill="none"/>
  <text x="495" y="370" text-anchor="middle" font-size="10" font-weight="bold" fill="#047857">steady state: 50 ms = slowest stage</text>

  <text x="350" y="392" text-anchor="middle" font-size="9" fill="#6b7280">overlap removes exposed waits -- it cannot speed the slowest stage itself</text>
</svg>
