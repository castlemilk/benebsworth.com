<svg xmlns="http://www.w3.org/2000/svg" id="mc-calibration-grid" class="study-fig-fit" viewBox="0 0 408 297" role="img" aria-labelledby="mc-calibration-title mc-calibration-desc">
  <title id="mc-calibration-title">Eight quantization codes on narrow and wide grids</title>
  <desc id="mc-calibration-desc">The narrow grid has a step of one and runs from zero to seven. It maps 3.1 to 3 and clips 9.2 to 7. The wide grid has a step of two and runs from zero to 14. It maps 3.1 to 4 and 9.2 to 10.</desc>
  <style>
    #mc-calibration-grid { font-family: system-ui, sans-serif; }
    .dark #mc-calibration-grid [fill="#fbf7f0"] { fill: #201a17; }
    .dark #mc-calibration-grid [fill="#29231e"] { fill: #f7eee3; }
    .dark #mc-calibration-grid [fill="#6f6055"] { fill: #c8b8aa; }
    .dark #mc-calibration-grid [stroke="#b8a89c"] { stroke: #72665c; }
    .dark #mc-calibration-grid [stroke="#6f6055"] { stroke: #ad9d8f; }
    .dark #mc-calibration-grid [fill="#9a3d1d"] { fill: #f2a276; }
  </style>
  <rect width="408" height="297" rx="12" fill="#fbf7f0"/>

  <text x="24" y="39" fill="#29231e" font-size="23" font-weight="650">Range 0–7</text>
  <text x="382" y="39" fill="#6f6055" text-anchor="end" font-size="19">Step 1</text>
  <path d="M30 74H205M30 66V82M55 66V82M80 66V82M105 66V82M130 66V82M155 66V82M180 66V82M205 66V82" fill="none" stroke="#6f6055" stroke-width="2"/>
  <path d="M209 74H380" fill="none" stroke="#b8a89c" stroke-width="2" stroke-dasharray="5 5"/>
  <circle cx="105" cy="74" r="5" fill="#9a3d1d"/>
  <circle cx="205" cy="74" r="5" fill="#9a3d1d"/>
  <g fill="#6f6055" font-size="17" text-anchor="middle">
    <text x="30" y="105">0</text>
    <text x="205" y="105">7</text>
    <text x="380" y="105">14</text>
  </g>
  <text x="24" y="135" fill="#29231e" font-size="20">3.1 → 3</text>
  <text x="382" y="135" fill="#9a3d1d" font-size="20" text-anchor="end">9.2 → 7 (clipped)</text>

  <path d="M24 151H384" fill="none" stroke="#b8a89c"/>
  <text x="24" y="188" fill="#29231e" font-size="23" font-weight="650">Range 0–14</text>
  <text x="382" y="188" fill="#6f6055" text-anchor="end" font-size="19">Step 2</text>
  <path d="M30 222H380M30 214V230M80 214V230M130 214V230M180 214V230M230 214V230M280 214V230M330 214V230M380 214V230" fill="none" stroke="#6f6055" stroke-width="2"/>
  <circle cx="130" cy="222" r="5" fill="#9a3d1d"/>
  <circle cx="280" cy="222" r="5" fill="#9a3d1d"/>
  <g fill="#6f6055" font-size="17" text-anchor="middle">
    <text x="30" y="253">0</text>
    <text x="130" y="253">4</text>
    <text x="280" y="253">10</text>
    <text x="380" y="253">14</text>
  </g>
  <text x="24" y="282" fill="#29231e" font-size="20">3.1 → 4</text>
  <text x="382" y="282" fill="#9a3d1d" font-size="20" text-anchor="end">9.2 → 10</text>
</svg>
