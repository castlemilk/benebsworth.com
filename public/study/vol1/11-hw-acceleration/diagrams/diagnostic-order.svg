<svg xmlns="http://www.w3.org/2000/svg" id="ha-diagnostic-order" class="study-fig-fit" viewBox="0 0 420 344" role="img" aria-labelledby="ha-diagnostic-order-title ha-diagnostic-order-desc">
<title id="ha-diagnostic-order-title">Diagnose the bottleneck in order</title>
<desc id="ha-diagnostic-order-desc">Start with a request trace, inspect device and fallback placement, count physical bytes at the relevant interface, compare compute and movement floors, and test a change while measuring the complete request again.</desc>
<style>
  #ha-diagnostic-order { font-family: system-ui, sans-serif; }
  .dark #ha-diagnostic-order [fill="#fbf7f0"] { fill: #201a17; }
  .dark #ha-diagnostic-order [fill="#eee5da"] { fill: #332b26; }
  .dark #ha-diagnostic-order [fill="#29231e"] { fill: #f7eee3; }
  .dark #ha-diagnostic-order [fill="#6f6055"] { fill: #c8b8aa; }
  .dark #ha-diagnostic-order [fill="#9a3d1d"] { fill: #f2a276; }
  .dark #ha-diagnostic-order [stroke="#b8a89c"] { stroke: #72665c; }
  .dark #ha-diagnostic-order [stroke="#6f6055"] { stroke: #ad9d8f; }
  .dark #ha-diagnostic-order [stroke="#9a3d1d"] { stroke: #f2a276; }
</style>
<rect width="420" height="344" rx="12" fill="#fbf7f0"/>
<text x="22" y="36" fill="#29231e" font-size="22" font-weight="650">A useful diagnostic order</text>
<rect x="22" y="52" width="376" height="52" rx="8" fill="#eee5da" stroke="#b8a89c"/>
<text x="36" y="84" fill="#9a3d1d" font-size="21" font-weight="650">1</text>
<text x="72" y="74" fill="#29231e" font-size="18" font-weight="650">Trace the request</text>
<text x="72" y="94" fill="#6f6055" font-size="15">Find the exposed critical path.</text>
<path d="M210 104L210 116" fill="none" stroke="#6f6055" stroke-width="2"/>
<rect x="22" y="116" width="376" height="52" rx="8" fill="#eee5da" stroke="#b8a89c"/>
<text x="36" y="148" fill="#9a3d1d" font-size="21" font-weight="650">2</text>
<text x="72" y="138" fill="#29231e" font-size="18" font-weight="650">Inspect placement</text>
<text x="72" y="158" fill="#6f6055" font-size="15">Identify kernels, transfers and fallback.</text>
<path d="M210 168L210 180" fill="none" stroke="#6f6055" stroke-width="2"/>
<rect x="22" y="180" width="376" height="52" rx="8" fill="#eee5da" stroke="#b8a89c"/>
<text x="36" y="212" fill="#9a3d1d" font-size="21" font-weight="650">3</text>
<text x="72" y="202" fill="#29231e" font-size="18" font-weight="650">Count work + bytes</text>
<text x="72" y="222" fill="#6f6055" font-size="15">Name the precision and memory boundary.</text>
<path d="M210 232L210 244" fill="none" stroke="#6f6055" stroke-width="2"/>
<rect x="22" y="244" width="376" height="52" rx="8" fill="#eee5da" stroke="#b8a89c"/>
<text x="36" y="276" fill="#9a3d1d" font-size="21" font-weight="650">4</text>
<text x="72" y="266" fill="#29231e" font-size="18" font-weight="650">Change and remeasure</text>
<text x="72" y="286" fill="#6f6055" font-size="15">Match the lever to the bottleneck.</text>
</svg>
