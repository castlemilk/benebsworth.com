<svg xmlns="http://www.w3.org/2000/svg" id="ha-local-reuse" class="study-fig-fit" viewBox="0 0 420 278" role="img" aria-labelledby="ha-local-reuse-title ha-local-reuse-desc">
<title id="ha-local-reuse-title">A stationary weight serves two products</title>
<desc id="ha-local-reuse-desc">A weight value of three remains local. In the first step it multiplies two and adds a partial sum of one to produce seven. In the second it multiplies four and adds a partial sum of five to produce seventeen. The partial sums belong to different output columns.</desc>
<style>
  #ha-local-reuse { font-family: system-ui, sans-serif; }
  .dark #ha-local-reuse [fill="#fbf7f0"] { fill: #201a17; }
  .dark #ha-local-reuse [fill="#eee5da"] { fill: #332b26; }
  .dark #ha-local-reuse [fill="#29231e"] { fill: #f7eee3; }
  .dark #ha-local-reuse [fill="#6f6055"] { fill: #c8b8aa; }
  .dark #ha-local-reuse [fill="#9a3d1d"] { fill: #f2a276; }
  .dark #ha-local-reuse [stroke="#b8a89c"] { stroke: #72665c; }
  .dark #ha-local-reuse [stroke="#6f6055"] { stroke: #ad9d8f; }
  .dark #ha-local-reuse [stroke="#9a3d1d"] { stroke: #f2a276; }
</style>
<rect width="420" height="278" rx="12" fill="#fbf7f0"/>
<text x="22" y="36" fill="#29231e" font-size="22" font-weight="650">Keep one weight nearby</text>
<rect x="22" y="53" width="376" height="46" rx="8" fill="#eee5da" stroke="#b8a89c"/>
<text x="210" y="83" fill="#9a3d1d" font-size="19" font-weight="650" text-anchor="middle">stationary weight  W = 3</text>
<text x="24" y="133" fill="#6f6055" font-size="15" font-weight="650">STEP</text>
<text x="124" y="133" fill="#6f6055" font-size="15" font-weight="650">INPUT</text>
<text x="222" y="133" fill="#6f6055" font-size="15" font-weight="650">PARTIAL SUM</text>
<text x="396" y="133" fill="#6f6055" font-size="15" font-weight="650" text-anchor="end">NEXT</text>
<path d="M22 145L398 145" fill="none" stroke="#b8a89c" stroke-width="2"/>
<text x="24" y="177" fill="#29231e" font-size="20" font-weight="650">1</text>
<text x="124" y="177" fill="#29231e" font-size="20">2</text>
<text x="222" y="177" fill="#29231e" font-size="19">1 + 3 × 2</text>
<text x="396" y="177" fill="#9a3d1d" font-size="20" font-weight="650" text-anchor="end">7</text>
<path d="M22 195L398 195" fill="none" stroke="#b8a89c" stroke-width="2"/>
<text x="24" y="227" fill="#29231e" font-size="20" font-weight="650">2</text>
<text x="124" y="227" fill="#29231e" font-size="20">4</text>
<text x="222" y="227" fill="#29231e" font-size="19">5 + 3 × 4</text>
<text x="396" y="227" fill="#9a3d1d" font-size="20" font-weight="650" text-anchor="end">17</text>
<text x="22" y="258" fill="#6f6055" font-size="16">Two output columns; one weight fetch.</text>
</svg>
