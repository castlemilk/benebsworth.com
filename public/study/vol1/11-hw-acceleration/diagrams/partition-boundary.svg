<svg xmlns="http://www.w3.org/2000/svg" id="ha-partition-boundary" class="study-fig-fit" viewBox="0 0 420 260" role="img" aria-labelledby="ha-partition-boundary-title ha-partition-boundary-desc">
<title id="ha-partition-boundary-title">A second accelerator can lose to communication</title>
<desc id="ha-partition-boundary-desc">A toy serial critical path takes one hundred microseconds on one device. Two devices reduce computation to sixty microseconds but add fifty microseconds of exposed communication, for a total of one hundred and ten. If the communication were fully overlapped, the ideal combined time could be sixty microseconds.</desc>
<style>
  #ha-partition-boundary { font-family: system-ui, sans-serif; }
  .dark #ha-partition-boundary [fill="#fbf7f0"] { fill: #201a17; }
  .dark #ha-partition-boundary [fill="#eee5da"] { fill: #332b26; }
  .dark #ha-partition-boundary [fill="#29231e"] { fill: #f7eee3; }
  .dark #ha-partition-boundary [fill="#6f6055"] { fill: #c8b8aa; }
  .dark #ha-partition-boundary [fill="#9a3d1d"] { fill: #f2a276; }
  .dark #ha-partition-boundary [stroke="#b8a89c"] { stroke: #72665c; }
  .dark #ha-partition-boundary [stroke="#6f6055"] { stroke: #ad9d8f; }
  .dark #ha-partition-boundary [stroke="#9a3d1d"] { stroke: #f2a276; }
</style>
<rect width="420" height="260" rx="12" fill="#fbf7f0"/>
<text x="22" y="35" fill="#29231e" font-size="20" font-weight="650">Does the saved work pay for the link?</text>
<text x="22" y="72" fill="#29231e" font-size="18" font-weight="650">One device</text>
<rect x="22" y="83" width="320" height="28" rx="3" fill="#6f6055" stroke="#6f6055"/>
<text x="350" y="103" fill="#29231e" font-size="17">100 µs</text>
<text x="22" y="151" fill="#29231e" font-size="18" font-weight="650">Two devices: exposed transfer</text>
<rect x="22" y="162" width="192" height="28" rx="3" fill="#6f6055" stroke="#6f6055"/>
<rect x="214" y="162" width="160" height="28" rx="3" fill="#9a3d1d" stroke="#9a3d1d"/>
<text x="22" y="220" fill="#29231e" font-size="16">60 µs compute + 50 µs transfer = 110 µs</text>
<text x="22" y="245" fill="#6f6055" font-size="16">Full overlap would give an ideal 60 µs.</text>
</svg>
