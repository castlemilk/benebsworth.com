    <text x="20" y="54" font-size="14">Each dot is one image only one model got right.</text>
    <circle cx="26" cy="80" r="4" fill="var(--fig-mark, #a33c20)"/><text x="37" y="85" font-size="14">Baseline only</text>
    <circle cx="179" cy="80" r="4" fill="none" stroke="var(--fig-outline, #364c50)"/><text x="190" y="85" font-size="14">Compressed only</text>
    <path d="M20 100h340M20 181h340" stroke="var(--fig-rule, #b7b4a7)"/>
