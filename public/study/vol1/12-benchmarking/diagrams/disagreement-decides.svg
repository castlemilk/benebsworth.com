<svg xmlns="http://www.w3.org/2000/svg" id="disagreement-decides-art" class="study-fig-fit" viewBox="0 0 380 294" role="img" aria-labelledby="disagreement-decides-title disagreement-decides-desc">
  <title id="disagreement-decides-title">Same scores, different disagreements</title>
  <desc id="disagreement-decides-desc">Both illustrative runs have 50 baseline errors and 60 compressed-model errors on 1,000 images. Count which model alone was right. With the chapter’s uncorrected McNemar statistic, 10 against 0 gives 10.0, above the 3.84 cutoff. With 30 against 20 it gives 2.0, below the cutoff.</desc>
  <style>
    .dark #disagreement-decides-art { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094 }
    @media (prefers-color-scheme: dark) { svg:root#disagreement-decides-art { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094 } }
  </style>
  <rect width="380" height="294" rx="8" fill="var(--fig-paper, #f7f3e9)"/>
  <g font-family="system-ui, sans-serif" fill="var(--fig-ink, #252923)">
