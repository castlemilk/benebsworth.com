<svg xmlns="http://www.w3.org/2000/svg" id="sv-form" class="study-fig-fit" viewBox="0 0 408 300" role="img" aria-labelledby="sv-f-title sv-f-desc">
  <title id="sv-f-title">Formation delay inside a batch window</title>
  <desc id="sv-f-desc">Requests trickle into a batch window. The first arrival waits the whole window; the last waits nothing. Batch latency starts only after the window fills.</desc>
  <style>
    #sv-form { font-family: system-ui, sans-serif; }
    .dark #sv-form [fill="#fbf7f0"] { fill: #201a17; }
    .dark #sv-form [fill="#29231e"] { fill: #f7eee3; }
    .dark #sv-form [fill="#6f6055"] { fill: #c8b8aa; }
    .dark #sv-form [fill="#cfc1b2"] { fill: #8b7f73; }
    .dark #sv-form [fill="#cf8359"] { fill: #d99066; }
    .dark #sv-form [stroke="#b8a89c"] { stroke: #72665c; }
  </style>
  <rect width="408" height="300" rx="12" fill="#fbf7f0"/>
  <text x="24" y="38" fill="#29231e" font-size="20" font-weight="650">A batch window waits before it executes</text>
  <text x="24" y="59" fill="#6f6055" font-size="13">formation delay ≈ b/λ — the published batch latency omits it</text>

  <rect x="24" y="86" width="280" height="30" rx="6" fill="#cfc1b2"/>
  <rect x="304" y="86" width="80" height="30" rx="6" fill="#cf8359"/>
  <text x="344" y="105" text-anchor="middle" fill="#29231e" font-size="12">execute</text>
  <text x="160" y="105" text-anchor="middle" fill="#29231e" font-size="12">formation window (fills at ~b/λ)</text>

  <g fill="#cf8359">
    <circle cx="40" cy="86" r="4"/><circle cx="88" cy="86" r="4"/><circle cx="136" cy="86" r="4"/><circle cx="184" cy="86" r="4"/><circle cx="232" cy="86" r="4"/><circle cx="280" cy="86" r="4"/>
  </g>
  <g font-size="11.5" fill="#6f6055">
    <text x="40" y="134">First waits a full window</text>
    <text x="280" y="134" text-anchor="end">Last waits ~0</text>
  </g>
  <path d="M40 122h240" stroke="#b8a89c" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="160" y="118" text-anchor="middle" fill="#6f6055" font-size="11.5">queueing time before execution</text>

  <g font-size="12.5" fill="#29231e">
    <text x="24" y="170">what the datasheet shows:</text>
    <rect x="24" y="180" width="120" height="26" rx="5" fill="#cf8359"/>
    <text x="84" y="197" text-anchor="middle" fill="#29231e" font-size="12">batch = 3.8 ms</text>
  </g>
  <g font-size="12.5" fill="#29231e">
    <text x="200" y="170">what the user pays:</text>
    <rect x="200" y="180" width="184" height="26" rx="5" fill="#cfc1b2"/>
    <rect x="352" y="180" width="32" height="26" rx="5" fill="#cf8359"/>
    <text x="276" y="197" text-anchor="middle" fill="#29231e" font-size="12">formation wait + execute</text>
  </g>
  <text x="210" y="240" text-anchor="middle" fill="#6f6055" font-size="12.5">the window trades wait for throughput — traffic decides the trade</text>
  <text x="210" y="270" text-anchor="middle" fill="#cf8359" font-size="12.5" font-weight="600">low traffic inflates the wait; high traffic saturates the batch</text>
</svg>
