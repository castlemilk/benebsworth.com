<svg xmlns="http://www.w3.org/2000/svg" id="headroom-knee-art" class="study-fig-fit" viewBox="0 0 380 291" role="img" aria-labelledby="headroom-knee-title headroom-knee-desc">
  <title id="headroom-knee-title">Waiting near saturation</title>
  <desc id="headroom-knee-desc">In a single-server M/M/1 queue, mean time in system divided by mean service time is 1/(1 − utilization). Moving from 80% to 90% load doubles the multiplier from 5× to 10×. The next five percentage points double it again. At a balanced peak of 1,000 requests/s and 285 requests/s per replica, four replicas run at 88% and five at 70%. Five is the candidate to load-test. Measure request p99 on peak traffic to verify the deadline.</desc>
  <style>
    .dark #headroom-knee-art { --fig-paper:#252a27; --fig-ink:#efece1; --fig-grid:#5c635d; --fig-axis:#b6c0b4; --fig-curve:#ffab7c }
    @media (prefers-color-scheme: dark) { svg:root#headroom-knee-art { --fig-paper:#252a27; --fig-ink:#efece1; --fig-grid:#5c635d; --fig-axis:#b6c0b4; --fig-curve:#ffab7c } }
  </style>
  <rect width="380" height="291" rx="8" fill="var(--fig-paper, #f7f3e9)"/>
  <g font-family="system-ui, sans-serif" fill="var(--fig-ink, #252923)">
    <text x="18" y="30" font-size="19" font-weight="650">The last few points of headroom</text>
    <text x="18" y="52" font-size="14">Mean response time ÷ mean service time</text>
    <g transform="translate(0 14)">
    <path d="M48 172.5h300" stroke="var(--fig-grid, #cbc9bc)" stroke-dasharray="2 3"/><text x="40" y="177.5" text-anchor="end" font-size="13">5×</text>
    <path d="M48 134.0h300" stroke="var(--fig-grid, #cbc9bc)" stroke-dasharray="2 3"/><text x="40" y="139.0" text-anchor="end" font-size="13">10×</text>
    <path d="M48 95.5h300" stroke="var(--fig-grid, #cbc9bc)" stroke-dasharray="2 3"/><text x="40" y="100.5" text-anchor="end" font-size="13">15×</text>
    <path d="M48 57.0h300" stroke="var(--fig-grid, #cbc9bc)" stroke-dasharray="2 3"/><text x="40" y="62.0" text-anchor="end" font-size="13">20×</text>
    <path d="M48 56v155h302" fill="none" stroke="var(--fig-axis, #555f54)"/>
