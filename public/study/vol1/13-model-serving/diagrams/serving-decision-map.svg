<svg xmlns="http://www.w3.org/2000/svg" id="sv-map" class="study-fig-fit" viewBox="0 0 408 320" role="img" aria-labelledby="sv-m-title sv-m-desc">
  <title id="sv-m-title">The serving plan, end to end</title>
  <desc id="sv-m-desc">Traffic feeds Little's Law for the resident population, utilization sets the tail via the knee, the batch window trades formation delay for throughput, and replicas plus headroom carry the peak.</desc>
  <style>
    #sv-map { font-family: system-ui, sans-serif; }
    .dark #sv-map [fill="#fbf7f0"] { fill: #201a17; }
    .dark #sv-map [fill="#29231e"] { fill: #f7eee3; }
    .dark #sv-map [fill="#6f6055"] { fill: #c8b8aa; }
    .dark #sv-map [fill="#cfc1b2"] { fill: #8b7f73; }
    .dark #sv-map [fill="#cf8359"] { fill: #d99066; }
    .dark #sv-map [stroke="#b8a89c"] { stroke: #72665c; }
  </style>
  <rect width="408" height="320" rx="12" fill="#fbf7f0"/>
  <text x="24" y="38" fill="#29231e" font-size="20" font-weight="650">How the serving plan composes</text>
  <text x="24" y="59" fill="#6f6055" font-size="13">arrivals → population → tail → window → replicas</text>

  <g font-size="12" fill="#29231e">
    <rect x="24" y="82" width="170" height="34" rx="6" fill="#cfc1b2"/>
    <text x="109" y="103" text-anchor="middle">arrival rate λ</text>
    <rect x="218" y="82" width="166" height="34" rx="6" fill="#cfc1b2"/>
    <text x="301" y="103" text-anchor="middle">mean time W</text>
  </g>
  <path d="M109 116v14M301 116v14M109 130h192" stroke="#b8a89c" fill="none"/>
  <rect x="129" y="134" width="150" height="34" rx="6" fill="#cf8359"/>
  <text x="204" y="155" text-anchor="middle" fill="#29231e" font-size="12">L = λW resident requests</text>

  <path d="M204 168v12" stroke="#b8a89c" fill="none"/>
  <rect x="24" y="182" width="170" height="34" rx="6" fill="#cfc1b2"/>
  <text x="109" y="203" text-anchor="middle" fill="#29231e" font-size="12">utilization ρ = λ/μ</text>
  <rect x="218" y="182" width="166" height="34" rx="6" fill="#cfc1b2"/>
  <text x="301" y="203" text-anchor="middle" fill="#29231e" font-size="12">tail = W/(1−ρ)</text>

  <path d="M109 216v12M301 216v12M109 228h192" stroke="#b8a89c" fill="none"/>
  <rect x="104" y="232" width="200" height="34" rx="6" fill="#cfc1b2"/>
  <text x="204" y="253" text-anchor="middle" fill="#29231e" font-size="12">batch window × replicas + headroom</text>

  <path d="M204 266v12" stroke="#b8a89c" fill="none"/>
  <rect x="104" y="280" width="200" height="30" rx="6" fill="#cf8359"/>
  <text x="204" y="299" text-anchor="middle" fill="#29231e" font-size="12">the p99 SLO the user signs</text>
</svg>
