<svg xmlns="http://www.w3.org/2000/svg" id="mo-debt" class="study-fig-fit" viewBox="0 0 408 300" role="img" aria-labelledby="mo-d-title mo-d-desc">
  <title id="mo-d-title">Where ML technical debt hides</title>
  <desc id="mo-d-desc">The model is about five percent of the code. The debt lives in the couplings around it: boundary erosion, correction cascades, undeclared consumers, feedback loops, config sprawl and glue.</desc>
  <style>
    #mo-debt { font-family: system-ui, sans-serif; }
    .dark #mo-debt [fill="#fbf7f0"] { fill: #201a17; }
    .dark #mo-debt [fill="#29231e"] { fill: #f7eee3; }
    .dark #mo-debt [fill="#6f6055"] { fill: #c8b8aa; }
    .dark #mo-debt [fill="#cfc1b2"] { fill: #8b7f73; }
    .dark #mo-debt [fill="#cf8359"] { fill: #d99066; }
    .dark #mo-debt [stroke="#b8a89c"] { stroke: #72665c; }
  </style>
  <rect width="408" height="300" rx="12" fill="#fbf7f0"/>
  <text x="24" y="38" fill="#29231e" font-size="19" font-weight="650">Debt lives in the couplings, not the model</text>
  <text x="24" y="59" fill="#6f6055" font-size="13">Sculley: ~5% ML code · ~95% everything around it</text>

  <rect x="24" y="76" width="360" height="180" rx="10" fill="#cfc1b2" opacity="0.35"/>
  <text x="40" y="94" fill="#6f6055" font-size="11.5">the 95% — integration surface</text>

  <rect x="160" y="120" width="88" height="44" rx="8" fill="#cf8359"/>
  <text x="204" y="139" text-anchor="middle" fill="#29231e" font-size="12" font-weight="600">model</text>
  <text x="204" y="154" text-anchor="middle" fill="#29231e" font-size="10.5">~5%</text>

  <g font-size="11" fill="#29231e">
    <rect x="36" y="104" width="104" height="26" rx="6" fill="#cfc1b2"/>
    <text x="88" y="121" text-anchor="middle">boundary erosion</text>
    <rect x="36" y="146" width="104" height="26" rx="6" fill="#cfc1b2"/>
    <text x="88" y="163" text-anchor="middle">correction cascades</text>
    <rect x="36" y="188" width="104" height="26" rx="6" fill="#cfc1b2"/>
    <text x="88" y="205" text-anchor="middle">feature entanglement</text>
    <rect x="268" y="104" width="104" height="26" rx="6" fill="#cfc1b2"/>
    <text x="320" y="121" text-anchor="middle">undeclared</text>
    <rect x="268" y="146" width="104" height="26" rx="6" fill="#cfc1b2"/>
    <text x="320" y="163" text-anchor="middle">consumers</text>
    <rect x="268" y="188" width="104" height="26" rx="6" fill="#cfc1b2"/>
    <text x="320" y="205" text-anchor="middle">feedback loops</text>
    <rect x="120" y="218" width="168" height="26" rx="6" fill="#cfc1b2"/>
    <text x="204" y="235" text-anchor="middle">config sprawl · glue code</text>
  </g>
  <path d="M140 117h20M140 159h20M140 201h20M248 117h-8M268 117h-20M268 159h-20M268 201h-20M204 164v54" stroke="#b8a89c" fill="none"/>

  <text x="204" y="276" text-anchor="middle" fill="#6f6055" font-size="12">contracts, lineage and parity tests rebuild the boundaries</text>
</svg>
