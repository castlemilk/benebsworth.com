<svg xmlns="http://www.w3.org/2000/svg" id="mtbf-ladder" class="study-fig-fit" viewBox="0 0 380 252" role="img" aria-labelledby="ml-title ml-desc">
  <title id="ml-title">Reliability divides by N</title>
  <desc id="ml-desc">Log-scale comparison: one GPU's mean time to failure of 50,000 hours versus a 25,000-GPU synchronous job's mean time between interruptions of about 2 hours. A diamond marks Meta's measured Llama 3 rate of one interruption per 3.1 hours on 16,384 H100s.</desc>
  <style>
    .dark #mtbf-ladder { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094 }
    @media (prefers-color-scheme: dark) { svg:root#mtbf-ladder { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094 } }
  </style>
  <rect width="380" height="252" rx="8" fill="var(--fig-paper, #f7f3e9)"/>
  <g font-family="system-ui, sans-serif" fill="var(--fig-ink, #252923)">
    <text x="20" y="30" font-size="19" font-weight="650">Reliability divides by N</text>
    <text x="20" y="48" font-size="11.5" fill="var(--fig-rule, #6e6a5b)">Hours between failures, log scale</text>

    <g font-size="9.5" fill="var(--fig-rule, #6e6a5b)">
      <text x="40" y="70">1 h</text><text x="90" y="70">10 h</text>
      <text x="140" y="70">100 h</text><text x="190" y="70">1,000 h</text>
      <text x="248" y="70">10,000 h</text><text x="316" y="70">100,000 h</text>
    </g>
    <line x1="40" y1="76" x2="360" y2="76" stroke="var(--fig-rule, #6e6a5b)" stroke-width="0.5" stroke-dasharray="2 4"/>
    <g stroke="var(--fig-rule, #6e6a5b)" stroke-width="0.5" opacity="0.5">
      <line x1="90" y1="76" x2="90" y2="212"/><line x1="140" y1="76" x2="140" y2="212"/>
      <line x1="190" y1="76" x2="190" y2="212"/><line x1="240" y1="76" x2="240" y2="212"/>
      <line x1="290" y1="76" x2="290" y2="212"/><line x1="340" y1="76" x2="340" y2="212"/>
    </g>

    <rect x="40" y="92" width="317" height="26" rx="5" fill="var(--fig-outline, #364c50)"/>
    <text x="48" y="109" font-size="11" fill="var(--fig-paper, #f7f3e9)">1 GPU · MTTF 50,000 h ≈ 5.7 yr</text>

    <rect x="40" y="134" width="23" height="26" rx="5" fill="var(--fig-mark, #b45a2d)"/>
    <text x="72" y="151" font-size="11">25,000-GPU job · MTBF ≈ 2 h</text>

    <path d="M 56 176 l 9 13 h -18 z" fill="var(--fig-mark, #b45a2d)"/>
    <text x="72" y="192" font-size="11">Llama 3 measured: ~1 per 3.1 h</text>
    <text x="72" y="206" font-size="10" fill="var(--fig-rule, #6e6a5b)">419 interruptions · 54 days · 16,384 H100s</text>

    <text x="20" y="236" font-size="10.5" fill="var(--fig-rule, #6e6a5b)">MTBF_fleet ≈ MTTF ÷ N — checkpointing assumes the</text>
    <text x="20" y="249" font-size="10.5" fill="var(--fig-rule, #6e6a5b)">interruption; it does not try to prevent it.</text>
  </g>
</svg>
