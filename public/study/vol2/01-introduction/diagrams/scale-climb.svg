<svg xmlns="http://www.w3.org/2000/svg" id="scale-climb" class="study-fig-fit" viewBox="0 0 380 316" role="img" aria-labelledby="sc-title sc-desc">
  <title id="sc-title">Two ladders: compute climbs faster than fleets</title>
  <desc id="sc-desc">Left ladder: accelerator counts on a log scale, 2 GTX 580s in 2012, about ten thousand V100s for GPT-3 in 2020, 16,384 H100s for Llama 3 in 2024 — about four orders. Right ladder: training compute in log10 FLOPs, 10^18 in 2012 to 10^25 in 2023 — seven orders. The gap between ladders is achieved per-device rate.</desc>
  <style>
    .dark #scale-climb { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094 }
    @media (prefers-color-scheme: dark) { svg:root#scale-climb { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094 } }
  </style>
  <rect width="380" height="316" rx="8" fill="var(--fig-paper, #f7f3e9)"/>
  <g font-family="system-ui, sans-serif" fill="var(--fig-ink, #252923)">
    <text x="20" y="30" font-size="19" font-weight="650">Compute outran the fleet</text>
    <text x="20" y="48" font-size="11.5" fill="var(--fig-rule, #6e6a5b)">Two log ladders, 2012 to 2024</text>

    <text x="100" y="74" font-size="12" font-weight="650" text-anchor="middle">Accelerators</text>
    <line x1="100" y1="88" x2="100" y2="252" stroke="var(--fig-rule, #6e6a5b)" stroke-width="1"/>
    <g font-size="9.5" fill="var(--fig-rule, #6e6a5b)">
      <text x="42" y="255" text-anchor="end">10⁰</text>
      <text x="42" y="200" text-anchor="end">10²</text>
      <text x="42" y="145" text-anchor="end">10³</text>
      <text x="42" y="91" text-anchor="end">10⁴·⁵</text>
    </g>
    <g font-size="11">
      <circle cx="100" cy="245" r="4.5" fill="var(--fig-outline, #364c50)"/>
      <text x="112" y="249">2012 · 2 GTX 580</text>
      <circle cx="100" cy="114" r="4.5" fill="var(--fig-outline, #364c50)"/>
      <text x="112" y="118">2020 · ~10,000 V100</text>
      <circle cx="100" cy="106" r="4.5" fill="var(--fig-mark, #b45a2d)"/>
      <text x="112" y="96" font-weight="650">2024 · 16,384 H100</text>
    </g>
    <text x="100" y="272" font-size="10" fill="var(--fig-rule, #6e6a5b)" text-anchor="middle">~4 orders</text>

    <line x1="188" y1="70" x2="188" y2="270" stroke="var(--fig-rule, #6e6a5b)" stroke-width="0.5" stroke-dasharray="2 4"/>

    <text x="280" y="74" font-size="12" font-weight="650" text-anchor="middle">Compute (log₁₀)</text>
    <line x1="280" y1="88" x2="280" y2="252" stroke="var(--fig-rule, #6e6a5b)" stroke-width="1"/>
    <g font-size="9.5" fill="var(--fig-rule, #6e6a5b)">
      <text x="338" y="256">10¹⁸</text>
      <text x="338" y="220">10²⁰</text>
      <text x="338" y="148">10²⁴</text>
      <text x="338" y="112">10²⁶</text>
    </g>
    <g font-size="11">
      <circle cx="280" cy="256" r="4.5" fill="var(--fig-outline, #364c50)"/>
      <text x="268" y="246" text-anchor="end">AlexNet</text>
      <circle cx="280" cy="220" r="4.5" fill="var(--fig-outline, #364c50)"/>
      <text x="268" y="216" text-anchor="end">BERT-Large</text>
      <circle cx="280" cy="157" r="4.5" fill="var(--fig-outline, #364c50)"/>
      <text x="268" y="153" text-anchor="end">GPT-3</text>
      <circle cx="280" cy="148" r="4.5" fill="var(--fig-outline, #364c50)"/>
      <text x="268" y="140" text-anchor="end">PaLM</text>
      <circle cx="280" cy="130" r="4.5" fill="var(--fig-mark, #b45a2d)"/>
      <text x="268" y="122" text-anchor="end" font-weight="650">GPT-4-class</text>
    </g>
    <text x="280" y="272" font-size="10" fill="var(--fig-rule, #6e6a5b)" text-anchor="middle">~7 orders</text>

    <text x="20" y="298" font-size="10.5" fill="var(--fig-rule, #6e6a5b)">The 3-order gap is achieved rate per device; ~half the</text>
    <text x="20" y="311" font-size="10.5" fill="var(--fig-rule, #6e6a5b)">growth is count × duration — scale-out, not just silicon.</text>
  </g>
</svg>
