<svg xmlns="http://www.w3.org/2000/svg" id="step-anatomy" class="study-fig-fit" viewBox="0 0 380 258" role="img" aria-labelledby="sa-title sa-desc">
  <title id="sa-title">The 8.71-second step, anatomized</title>
  <desc id="sa-desc">A horizontal bar of one synchronous step on 1,024 GPUs: 7.25 seconds local compute, 0.53 seconds pipeline bubble, 0.93 seconds gradient exchange. Below, the same bar after doubling the fleet: compute halves but the other two terms grow.</desc>
  <style>
    .dark #step-anatomy { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094 }
    @media (prefers-color-scheme: dark) { svg:root#step-anatomy { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094 } }
  </style>
  <rect width="380" height="258" rx="8" fill="var(--fig-paper, #f7f3e9)"/>
  <g font-family="system-ui, sans-serif" fill="var(--fig-ink, #252923)">
    <text x="20" y="30" font-size="19" font-weight="650">One step, three kinds of time</text>
    <text x="20" y="48" font-size="11.5" fill="var(--fig-rule, #6e6a5b)">Measured 1,024-GPU step · 8.71 s</text>

    <rect x="20" y="62" width="283" height="34" rx="4" fill="var(--fig-mark, #b45a2d)"/>
    <rect x="303" y="62" width="21" height="34" fill="var(--fig-rule, #6e6a5b)"/>
    <rect x="324" y="62" width="36" height="34" rx="4" fill="var(--fig-outline, #364c50)"/>
    <text x="161" y="83" font-size="11.5" text-anchor="middle" fill="var(--fig-paper, #f7f3e9)">compute 7.25 s</text>
    <line x1="313" y1="96" x2="313" y2="112" stroke="var(--fig-rule, #6e6a5b)" stroke-width="1"/>
    <line x1="342" y1="96" x2="342" y2="126" stroke="var(--fig-outline, #364c50)" stroke-width="1"/>
    <text x="313" y="122" font-size="10" text-anchor="middle">bubble</text>
    <text x="313" y="134" font-size="10" text-anchor="middle">0.53 s</text>
    <text x="342" y="140" font-size="10" text-anchor="middle">exchange</text>
    <text x="342" y="152" font-size="10" text-anchor="middle">0.93 s</text>
    <text x="20" y="118" font-size="10.5" fill="var(--fig-rule, #6e6a5b)">83% does arithmetic ·</text>
    <text x="20" y="131" font-size="10.5" fill="var(--fig-rule, #6e6a5b)">17% is the fleet tax</text>

    <text x="20" y="176" font-size="12" font-weight="650">After doubling to 2,048 GPUs</text>
    <rect x="20" y="186" width="142" height="22" rx="4" fill="var(--fig-mark, #b45a2d)"/>
    <rect x="162" y="186" width="30" height="22" fill="var(--fig-rule, #6e6a5b)"/>
    <rect x="192" y="186" width="62" height="22" rx="4" fill="var(--fig-outline, #364c50)"/>
    <text x="91" y="201" font-size="10.5" text-anchor="middle" fill="var(--fig-paper, #f7f3e9)">≈ 3.6 s</text>
    <text x="177" y="201" font-size="9.5" text-anchor="middle" fill="var(--fig-paper, #f7f3e9)">↑</text>
    <text x="223" y="201" font-size="9.5" text-anchor="middle" fill="var(--fig-paper, #f7f3e9)">↑ grows</text>
    <text x="268" y="201" font-size="10.5" fill="var(--fig-rule, #6e6a5b)">compute halves — the tax does not</text>

    <text x="20" y="236" font-size="10.5" fill="var(--fig-rule, #6e6a5b)">Per-replica work falls 96 → 12 sequences; exchange</text>
    <text x="20" y="249" font-size="10.5" fill="var(--fig-rule, #6e6a5b)">payload does not. Speedup &lt; 2× — answer to the case.</text>
  </g>
</svg>
