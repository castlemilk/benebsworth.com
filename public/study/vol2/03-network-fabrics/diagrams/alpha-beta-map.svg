<svg xmlns="http://www.w3.org/2000/svg" id="alpha-beta-map" class="study-fig-fit" viewBox="0 0 380 292" role="img" aria-labelledby="ab-title ab-desc">
  <title id="ab-title">Two regimes, one line</title>
  <desc id="ab-desc">Log-scale plot of message time versus message size for the alpha-beta model on NDR. A flat alpha floor of 1.5 microseconds runs until the 75 kilobyte crossover, then a rising beta slope takes over. Marked points: 4 kilobytes at 1.58 microseconds on the flat part, 350 megabytes at 7 milliseconds on the slope.</desc>
  <style>
    .dark #alpha-beta-map { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094 }
    @media (prefers-color-scheme: dark) { svg:root#alpha-beta-map { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094 } }
  </style>
  <rect width="380" height="292" rx="8" fill="var(--fig-paper, #f7f3e9)"/>
  <g font-family="system-ui, sans-serif" fill="var(--fig-ink, #252923)">
    <text x="20" y="30" font-size="19" font-weight="650">T(n) = α + n/β splits every message</text>
    <text x="20" y="48" font-size="11.5" fill="var(--fig-rule, #6e6a5b)">NDR: α = 1.5 μs, β = 50 GB/s · log scale both axes</text>

    <!-- axes -->
    <line x1="46" y1="236" x2="360" y2="236" stroke="var(--fig-rule, #6e6a5b)" stroke-width="1"/>
    <line x1="46" y1="236" x2="46" y2="66" stroke="var(--fig-rule, #6e6a5b)" stroke-width="1"/>
    <text x="360" y="250" font-size="9" text-anchor="end" fill="var(--fig-rule, #6e6a5b)">message size n →</text>
    <text x="42" y="66" font-size="9" text-anchor="end" fill="var(--fig-rule, #6e6a5b)">T →</text>

    <!-- alpha floor -->
    <line x1="46" y1="200" x2="166" y2="200" stroke="var(--fig-mark, #b4571f)" stroke-width="2.4"/>
    <text x="56" y="192" font-size="9.5" font-weight="650" fill="var(--fig-mark, #b4571f)">α floor: size barely matters</text>
    <!-- beta slope -->
    <line x1="166" y1="200" x2="352" y2="88" stroke="var(--fig-outline, #364c50)" stroke-width="2.4"/>
    <text x="300" y="82" font-size="9.5" font-weight="650" fill="var(--fig-outline, #364c50)" text-anchor="end">β slope: rate rules</text>

    <!-- crossover -->
    <line x1="166" y1="200" x2="166" y2="236" stroke="var(--fig-rule, #6e6a5b)" stroke-width="0.8" stroke-dasharray="3 4"/>
    <text x="166" y="250" font-size="8.5" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">n* = α·β ≈ 75 KB</text>

    <!-- points -->
    <circle cx="76" cy="200" r="4" fill="var(--fig-mark, #b4571f)"/>
    <text x="76" y="218" font-size="8.5" text-anchor="middle">4 KB control</text>
    <text x="76" y="228" font-size="8.5" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">1.58 μs</text>
    <circle cx="342" cy="94" r="4" fill="var(--fig-outline, #364c50)"/>
    <text x="332" y="78" font-size="8.5" text-anchor="end">350 MB shard</text>
    <text x="332" y="90" font-size="8.5" text-anchor="end" fill="var(--fig-rule, #6e6a5b)">7.0 ms</text>

    <!-- measured floor note -->
    <line x1="46" y1="160" x2="352" y2="160" stroke="var(--fig-mark, #b4571f)" stroke-width="1" stroke-dasharray="4 4" opacity="0.7"/>
    <text x="352" y="154" font-size="8.5" text-anchor="end" fill="var(--fig-mark, #b4571f)">measured NCCL floor ≈ 17 μs (model ≠ real stack)</text>

    <!-- footer -->
    <text x="20" y="272" font-size="10" fill="var(--fig-rule, #6e6a5b)">Doubling β halves the slope, never the floor: HDR→NDR buys</text>
    <text x="20" y="286" font-size="10" fill="var(--fig-rule, #6e6a5b)">under 25% end-to-end. Below 75 KB, latency is the purchase.</text>
  </g>
</svg>
