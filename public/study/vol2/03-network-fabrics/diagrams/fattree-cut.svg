<svg xmlns="http://www.w3.org/2000/svg" id="fattree-cut" class="study-fig-fit" viewBox="0 0 380 300" role="img" aria-labelledby="fc-title fc-desc">
  <title id="fc-title">Oversubscription prices the cut</title>
  <desc id="fc-desc">A leaf-spine fat-tree sketch with the bisection cut marked across the spine. At one-to-one the cut carries 25.6 terabytes per second and a worst-case ring AllReduce takes 0.20 seconds; at four-to-one the cut carries 6.4 terabytes per second and the same collective takes 0.80 seconds. A 142.1 million dollar waste figure is attached to the four-to-one side.</desc>
  <style>
    .dark #fattree-cut { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094 }
    @media (prefers-color-scheme: dark) { svg:root#fattree-cut { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094 } }
  </style>
  <rect width="380" height="300" rx="8" fill="var(--fig-paper, #f7f3e9)"/>
  <g font-family="system-ui, sans-serif" fill="var(--fig-ink, #252923)">
    <text x="20" y="30" font-size="19" font-weight="650">What the spine ratio buys</text>
    <text x="20" y="48" font-size="11.5" fill="var(--fig-rule, #6e6a5b)">Fat-tree, radix 64 · worst-case crossing traffic</text>

    <!-- spine row -->
    <g stroke="var(--fig-outline, #364c50)" stroke-width="1.3" fill="var(--fig-paper, #f7f3e9)">
      <rect x="88" y="70" width="60" height="20" rx="4"/><rect x="160" y="70" width="60" height="20" rx="4"/><rect x="232" y="70" width="60" height="20" rx="4"/>
    </g>
    <text x="60" y="84" font-size="9" fill="var(--fig-rule, #6e6a5b)" text-anchor="end">spine</text>
    <!-- leaf row -->
    <g stroke="var(--fig-outline, #364c50)" stroke-width="1.3" fill="var(--fig-paper, #f7f3e9)">
      <rect x="40" y="150" width="60" height="20" rx="4"/><rect x="112" y="150" width="60" height="20" rx="4"/>
      <rect x="184" y="150" width="60" height="20" rx="4"/><rect x="256" y="150" width="60" height="20" rx="4"/>
    </g>
    <text x="30" y="164" font-size="9" fill="var(--fig-rule, #6e6a5b)" text-anchor="end">leaf</text>
    <!-- edges -->
    <g stroke="var(--fig-outline, #364c50)" stroke-width="0.8" opacity="0.65">
      <line x1="118" y1="90" x2="70" y2="150"/><line x1="118" y1="90" x2="142" y2="150"/><line x1="118" y1="90" x2="214" y2="150"/><line x1="118" y1="90" x2="286" y2="150"/>
      <line x1="190" y1="90" x2="70" y2="150"/><line x1="190" y1="90" x2="142" y2="150"/><line x1="190" y1="90" x2="214" y2="150"/><line x1="190" y1="90" x2="286" y2="150"/>
      <line x1="262" y1="90" x2="70" y2="150"/><line x1="262" y1="90" x2="142" y2="150"/><line x1="262" y1="90" x2="214" y2="150"/><line x1="262" y1="90" x2="286" y2="150"/>
    </g>
    <!-- hosts -->
    <g stroke="var(--fig-rule, #6e6a5b)" stroke-width="0.8" opacity="0.8">
      <line x1="55" y1="170" x2="55" y2="186"/><line x1="70" y1="170" x2="70" y2="186"/><line x1="85" y1="170" x2="85" y2="186"/>
      <line x1="127" y1="170" x2="127" y2="186"/><line x1="142" y1="170" x2="142" y2="186"/><line x1="157" y1="170" x2="157" y2="186"/>
      <line x1="199" y1="170" x2="199" y2="186"/><line x1="214" y1="170" x2="214" y2="186"/><line x1="229" y1="170" x2="229" y2="186"/>
      <line x1="271" y1="170" x2="271" y2="186"/><line x1="286" y1="170" x2="286" y2="186"/><line x1="301" y1="170" x2="301" y2="186"/>
    </g>

    <!-- bisection cut -->
    <line x1="178" y1="60" x2="178" y2="190" stroke="var(--fig-mark, #b4571f)" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="186" y="64" font-size="9.5" font-weight="650" fill="var(--fig-mark, #b4571f)">the bisection cut</text>
    <text x="186" y="76" font-size="8.5" fill="var(--fig-rule, #6e6a5b)">every crossing packet pays here</text>

    <!-- comparison bars -->
    <text x="60" y="212" font-size="10" font-weight="650">ring AllReduce, worst placement</text>
    <g font-size="9">
      <text x="60" y="234" fill="var(--fig-rule, #6e6a5b)">1:1 non-blocking</text>
      <rect x="158" y="226" width="46" height="11" rx="2" fill="var(--fig-outline, #364c50)"/>
      <text x="210" y="235" font-size="9">0.20 s · 25.6 TB/s cut</text>
      <text x="60" y="252" fill="var(--fig-rule, #6e6a5b)">2:1</text>
      <rect x="158" y="244" width="92" height="11" rx="2" fill="var(--fig-outline, #364c50)" opacity="0.75"/>
      <text x="256" y="253" font-size="9">−23.1%</text>
      <text x="60" y="270" fill="var(--fig-rule, #6e6a5b)">4:1</text>
      <rect x="158" y="262" width="184" height="11" rx="2" fill="var(--fig-mark, #b4571f)"/>
      <text x="60" y="288" font-size="9" fill="var(--fig-rule, #6e6a5b)">0.80 s · 6.4 TB/s · ≈$142.1M waste on a $300M cluster</text>
    </g>
  </g>
</svg>
