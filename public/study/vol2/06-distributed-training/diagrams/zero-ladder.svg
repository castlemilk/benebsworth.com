<svg xmlns="http://www.w3.org/2000/svg" id="zero-ladder" class="study-fig-fit" viewBox="0 0 380 300" role="img" aria-labelledby="zl-title zl-desc">
  <title id="zl-title">What each stage shards</title>
  <desc id="zl-desc">Per-GPU static state for a 7B model under DDP and the three ZeRO stages as stacked columns of weights, gradients, and optimizer state. DDP replicates all 112 GB; ZeRO-1 shards the optimizer to ~29.3 GB; ZeRO-2 adds gradient sharding to ~15.5 GB; ZeRO-3 shards parameters to ~1.75 GB. The 80 GB HBM line is crossed after the first stage.</desc>
  <style>
    .dark #zero-ladder { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094 }
    @media (prefers-color-scheme: dark) { svg:root#zero-ladder { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094 } }
  </style>
  <rect width="380" height="300" rx="8" fill="var(--fig-paper, #f7f3e9)"/>
  <g font-family="system-ui, sans-serif" fill="var(--fig-ink, #252923)">
    <text x="20" y="28" font-size="19" font-weight="650">What each stage shards</text>
    <text x="20" y="45" font-size="11" fill="var(--fig-rule, #6e6a5b)">7B model · 64-GPU group · per-GPU static state</text>

    <!-- 80 GB HBM line: scale 112 GB -> 168px from y=60; gb -> y = 60 + 168 - gb*1.5 -->
    <line x1="40" x2="360" y1="108" y2="108" stroke="var(--fig-mark, #b4571f)" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="356" y="102" font-size="9" text-anchor="end" fill="var(--fig-mark, #b4571f)" font-weight="650">80 GB HBM</text>

    <!-- DDP: weights 14 + grads 14 + optim 84 = 112; y base 228, 1.5 px/GB -->
    <g>
      <rect x="56" y="60" width="56" height="126" rx="3" fill="var(--fig-outline, #364c50)" opacity="0.30"/>
      <rect x="56" y="186" width="56" height="21" fill="var(--fig-outline, #364c50)" opacity="0.55"/>
      <rect x="56" y="207" width="56" height="21" fill="var(--fig-outline, #364c50)" opacity="0.75"/>
      <text x="84" y="120" font-size="9" text-anchor="middle" font-weight="650">optim 84</text>
      <text x="84" y="199" font-size="8" text-anchor="middle">gr 14</text>
      <text x="84" y="220" font-size="8" text-anchor="middle">wt 14</text>
      <text x="84" y="56" font-size="10" text-anchor="middle" font-weight="650">112 GB</text>
      <text x="84" y="243" font-size="9" text-anchor="middle" font-weight="650">DDP</text>
      <text x="84" y="255" font-size="7.5" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">AllReduce 1x</text>
    </g>

    <!-- ZeRO-1: 29.3 -> 44px; optim 1.31 ~2px -->
    <g>
      <rect x="148" y="184" width="56" height="44" rx="3" fill="var(--fig-outline, #364c50)" opacity="0.30"/>
      <rect x="148" y="205" width="56" height="21" fill="var(--fig-outline, #364c50)" opacity="0.55"/>
      <rect x="148" y="226" width="56" height="2" fill="var(--fig-outline, #364c50)" opacity="0.75"/>
      <text x="176" y="198" font-size="9" text-anchor="middle" font-weight="650">29.3 GB</text>
      <text x="176" y="243" font-size="9" text-anchor="middle" font-weight="650">ZeRO-1</text>
      <text x="176" y="255" font-size="7.5" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">shard optim · 1x</text>
    </g>

    <!-- ZeRO-2: 15.5 -> 23px -->
    <g>
      <rect x="240" y="205" width="56" height="23" rx="3" fill="var(--fig-outline, #364c50)" opacity="0.30"/>
      <rect x="240" y="205" width="56" height="21" fill="var(--fig-outline, #364c50)" opacity="0.55"/>
      <text x="268" y="218" font-size="9" text-anchor="middle" font-weight="650">15.5</text>
      <text x="268" y="243" font-size="9" text-anchor="middle" font-weight="650">ZeRO-2</text>
      <text x="268" y="255" font-size="7.5" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">+ grads · 1x</text>
    </g>

    <!-- ZeRO-3: 1.75 -> ~3px -->
    <g>
      <rect x="332" y="225" width="28" height="3" rx="1.5" fill="var(--fig-outline, #364c50)" opacity="0.60"/>
      <text x="346" y="218" font-size="9" text-anchor="middle" font-weight="650">1.75 GB</text>
      <text x="346" y="243" font-size="9" text-anchor="middle" font-weight="650">ZeRO-3</text>
      <text x="346" y="255" font-size="7.5" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">+ params · 1.5x</text>
    </g>

    <line x1="40" x2="360" y1="228" y2="228" stroke="var(--fig-ink, #252923)" stroke-width="0.8" opacity="0.4"/>
    <text x="190" y="280" font-size="8.5" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">the optimizer is the fat target: 12 of 16 bytes per parameter</text>
    <text x="190" y="292" font-size="8.5" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">ZeRO-3 pays 1.5x volume for a collective before every layer</text>
  </g>
</svg>
