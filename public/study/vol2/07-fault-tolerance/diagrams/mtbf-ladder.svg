<svg xmlns="http://www.w3.org/2000/svg" id="mtbf-ladder" class="study-fig-fit" viewBox="0 0 380 300" role="img" aria-labelledby="ml-title ml-desc">
  <title id="ml-title">The MTBF ladder</title>
  <desc id="ml-desc">Expected hours between GPU failures on a log scale as the fleet grows: one device at 50,000 hours, 1,000 GPUs at 50 hours, 10,000 at 5 hours. The full-system cascade (~3.9 h) and the Llama 3 measurement (~3.1 h at 16,384 GPUs) sit below the GPU-only line.</desc>
  <style>
    .dark #mtbf-ladder { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094 }
    @media (prefers-color-scheme: dark) { svg:root#mtbf-ladder { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094 } }
  </style>
  <rect width="380" height="300" rx="8" fill="var(--fig-paper, #f7f3e9)"/>
  <g font-family="system-ui, sans-serif" fill="var(--fig-ink, #252923)">
    <text x="20" y="28" font-size="19" font-weight="650">The MTBF ladder</text>
    <text x="20" y="45" font-size="11" fill="var(--fig-rule, #6e6a5b)">hours between GPU failures · log scale · 50,000 h per-GPU MTTF</text>

    <!-- log10 scale: y = 260 - (log10(h)-0.5)*52 ; 50000->4.7 -> y=42 ; 50->1.7 -> y=198 ; 5->0.7 -> y=250 -->
    <!-- grid lines at 1, 10, 100, 1000, 10000 h : y=234,182,130,78,26 -->
    <line x1="56" x2="352" y1="234" y2="234" stroke="var(--fig-rule, #6e6a5b)" stroke-width="0.6" opacity="0.35"/>
    <line x1="56" x2="352" y1="182" y2="182" stroke="var(--fig-rule, #6e6a5b)" stroke-width="0.6" opacity="0.35"/>
    <line x1="56" x2="352" y1="130" y2="130" stroke="var(--fig-rule, #6e6a5b)" stroke-width="0.6" opacity="0.35"/>
    <line x1="56" x2="352" y1="78" y2="78" stroke="var(--fig-rule, #6e6a5b)" stroke-width="0.6" opacity="0.35"/>
    <text x="52" y="237" font-size="8" text-anchor="end" fill="var(--fig-rule, #6e6a5b)">1 h</text>
    <text x="52" y="185" font-size="8" text-anchor="end" fill="var(--fig-rule, #6e6a5b)">10 h</text>
    <text x="52" y="133" font-size="8" text-anchor="end" fill="var(--fig-rule, #6e6a5b)">100 h</text>
    <text x="52" y="81" font-size="8" text-anchor="end" fill="var(--fig-rule, #6e6a5b)">1 kh</text>
    <text x="52" y="60" font-size="8" text-anchor="end" fill="var(--fig-rule, #6e6a5b)">10 kh</text>
    <line x1="56" x2="352" y1="56" y2="56" stroke="var(--fig-rule, #6e6a5b)" stroke-width="0.6" opacity="0.35"/>

    <!-- bars: x centers 96, 180, 264 -->
    <!-- 1 GPU: 50,000 h -> top y=42 -->
    <rect x="78" y="42" width="36" height="218" rx="3" fill="var(--fig-outline, #364c50)" opacity="0.55"/>
    <text x="96" y="56" font-size="9" text-anchor="middle" font-weight="650">50,000 h</text>
    <text x="96" y="276" font-size="9" text-anchor="middle">1 GPU</text>

    <!-- 1,000: 50 h -> y=198 -->
    <rect x="162" y="198" width="36" height="62" rx="3" fill="var(--fig-outline, #364c50)" opacity="0.55"/>
    <text x="180" y="192" font-size="9" text-anchor="middle" font-weight="650">50 h</text>
    <text x="180" y="276" font-size="9" text-anchor="middle">1,000 GPUs</text>

    <!-- 10,000: 5 h -> y=250 -->
    <rect x="246" y="250" width="36" height="10" rx="3" fill="var(--fig-mark, #b4571f)" opacity="0.8"/>
    <text x="264" y="244" font-size="9" text-anchor="middle" font-weight="650">5 h</text>
    <text x="264" y="276" font-size="9" text-anchor="middle">10,000 GPUs</text>

    <!-- full-system ~3.9 h and llama ~3.1 h marks below the 10k bar -->
    <line x1="316" x2="316" y1="258" y2="260" stroke="var(--fig-mark, #b4571f)" stroke-width="1.6"/>
    <line x1="344" x2="344" y1="258" y2="260" stroke="var(--fig-mark, #b4571f)" stroke-width="1.6"/>
    <text x="316" y="272" font-size="7.5" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">3.9 h</text>
    <text x="316" y="282" font-size="7" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">full sys</text>
    <text x="344" y="272" font-size="7.5" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">3.1 h</text>
    <text x="344" y="282" font-size="7" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">Llama 3</text>

    <text x="190" y="294" font-size="8.5" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">halve the fleet, double the wait · ~6 failures/day at 10K</text>
  </g>
</svg>
