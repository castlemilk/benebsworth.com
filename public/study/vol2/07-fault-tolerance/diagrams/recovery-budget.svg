<svg xmlns="http://www.w3.org/2000/svg" id="recovery-budget" class="study-fig-fit" viewBox="0 0 380 300" role="img" aria-labelledby="rb-title rb-desc">
  <title id="rb-title">The 6.6-minute recovery budget</title>
  <desc id="rb-desc">A cold-restart timeline decomposed into detect about 30 seconds, restart about 4 minutes, checkpoint load about 24.5 seconds, and warmup about 2 minutes, totaling about 6.6 minutes. Restart and warmup dominate; the checkpoint read is the small term.</desc>
  <style>
    .dark #recovery-budget { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094 }
    @media (prefers-color-scheme: dark) { svg:root#recovery-budget { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094 } }
  </style>
  <rect width="380" height="300" rx="8" fill="var(--fig-paper, #f7f3e9)"/>
  <g font-family="system-ui, sans-serif" fill="var(--fig-ink, #252923)">
    <text x="20" y="28" font-size="19" font-weight="650">The recovery budget</text>
    <text x="20" y="45" font-size="11" fill="var(--fig-rule, #6e6a5b)">one cold restart · 175B job · ~6.6 min to useful work</text>

    <!-- timeline: x 30..350 maps 0..6.6 min (48.5 px/min) : 30s=24px, 4min=194px, 24.5s=20px, 2min=97px -->
    <line x1="30" y1="150" x2="352" y2="150" stroke="var(--fig-rule, #6e6a5b)" stroke-width="1"/>

    <!-- detect: 30s -> x 30..54 -->
    <rect x="30" y="100" width="24" height="46" fill="var(--fig-outline, #364c50)" opacity="0.5" rx="2"/>
    <text x="42" y="92" font-size="8.5" text-anchor="middle" font-weight="650">detect</text>
    <text x="42" y="160" font-size="7.5" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">~30 s</text>
    <text x="42" y="170" font-size="6.5" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">heartbeat miss</text>

    <!-- restart: ~4 min -> x 54..248 -->
    <rect x="54" y="100" width="194" height="46" fill="var(--fig-mark, #b4571f)" opacity="0.55" rx="2"/>
    <text x="151" y="92" font-size="8.5" text-anchor="middle" font-weight="650">restart + rendezvous</text>
    <text x="151" y="127" font-size="8.5" text-anchor="middle">~4 min</text>
    <text x="151" y="160" font-size="7.5" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">spare alloc · containers</text>
    <text x="151" y="170" font-size="7.5" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">ncclCommInitRank · epoch fence</text>

    <!-- load: 24.5 s -> x 248..268 -->
    <rect x="248" y="100" width="20" height="46" fill="var(--fig-outline, #364c50)" opacity="0.5" rx="2"/>
    <text x="258" y="92" font-size="8.5" text-anchor="middle" font-weight="650">load</text>
    <text x="258" y="160" font-size="7.5" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">~24.5 s</text>
    <text x="258" y="170" font-size="6.5" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">2.45 TB @100 GB/s</text>

    <!-- warmup: ~2 min -> x 268..352 -->
    <rect x="268" y="100" width="84" height="46" fill="var(--fig-mark, #b4571f)" opacity="0.35" rx="2"/>
    <text x="310" y="92" font-size="8.5" text-anchor="middle" font-weight="650">warmup</text>
    <text x="310" y="127" font-size="8.5" text-anchor="middle">~2 min</text>
    <text x="310" y="160" font-size="7.5" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">pipeline refill · JIT</text>

    <!-- annotation -->
    <text x="30" y="205" font-size="9" font-weight="650">restart + warmup ≈ 91% of the budget</text>
    <text x="30" y="220" font-size="8.5" fill="var(--fig-rule, #6e6a5b)">the I/O that checkpoints optimize is already the small term;</text>
    <text x="30" y="232" font-size="8.5" fill="var(--fig-rule, #6e6a5b)">membership and stabilization are what a failure actually costs.</text>

    <!-- daily loss -->
    <text x="30" y="262" font-size="8.5" fill="var(--fig-rule, #6e6a5b)">averaged over cadence: ~3 min of fleet time/day at 1K GPUs,</text>
    <text x="30" y="274" font-size="8.5" fill="var(--fig-rule, #6e6a5b)">~31 min/day at 10K — recovery is a standing tax, not an incident.</text>
    <text x="190" y="291" font-size="8.5" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">idle burn while waiting: ~$340/min at 10,000 GPUs</text>
  </g>
</svg>
