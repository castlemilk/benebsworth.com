<svg xmlns="http://www.w3.org/2000/svg" id="backfill-window" class="study-fig-fit" viewBox="0 0 380 300" role="img" aria-labelledby="bw-title bw-desc">
  <title id="bw-title">The backfill window</title>
  <desc id="bw-desc">A timeline: a 512-GPU gang reservation drains capacity toward its start five hours from now. A 128-GPU job with a two-hour enforced runtime fits the idle hole because its release completes well before the reservation needs the GPUs; a six-hour job does not fit and must wait.</desc>
  <style>
    .dark #backfill-window { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094 }
    @media (prefers-color-scheme: dark) { svg:root#backfill-window { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094 } }
  </style>
  <rect width="380" height="300" rx="8" fill="var(--fig-paper, #f7f3e9)"/>
  <g font-family="system-ui, sans-serif" fill="var(--fig-ink, #252923)">
    <text x="20" y="28" font-size="19" font-weight="650">The backfill window</text>
    <text x="20" y="45" font-size="11" fill="var(--fig-rule, #6e6a5b)">512-GPU gang reserved · starts in 5 h · 384 GPUs free meanwhile</text>

    <!-- time axis: x=48 now, x=300 reservation start (5h), x=344 after -->
    <line x1="40" x2="352" y1="240" y2="240" stroke="var(--fig-rule, #6e6a5b)" stroke-width="0.9"/>
    <text x="48" y="255" font-size="8.5" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">now</text>
    <text x="300" y="255" font-size="8.5" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">+5 h: gang starts</text>
    <!-- scale ticks each hour: 50px/h -->
    <line x1="98" x2="98" y1="237" y2="243" stroke="var(--fig-rule, #6e6a5b)" stroke-width="0.7"/>
    <line x1="148" x2="148" y1="237" y2="243" stroke="var(--fig-rule, #6e6a5b)" stroke-width="0.7"/>
    <line x1="198" x2="198" y1="237" y2="243" stroke="var(--fig-rule, #6e6a5b)" stroke-width="0.7"/>
    <line x1="248" x2="248" y1="237" y2="243" stroke="var(--fig-rule, #6e6a5b)" stroke-width="0.7"/>
    <text x="98" y="267" font-size="7" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">+1</text>
    <text x="148" y="267" font-size="7" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">+2</text>
    <text x="198" y="267" font-size="7" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">+3</text>
    <text x="248" y="267" font-size="7" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">+4</text>

    <!-- reservation zone shading from x=300 rightward -->
    <rect x="300" y="66" width="52" height="168" fill="var(--fig-outline, #364c50)" opacity="0.14"/>
    <text x="326" y="78" font-size="8" text-anchor="middle" fill="var(--fig-outline, #364c50)" font-weight="650">gang runs</text>

    <!-- reservation marker line -->
    <line x1="300" x2="300" y1="66" y2="240" stroke="var(--fig-mark, #b4571f)" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="300" y="64" font-size="8.5" text-anchor="middle" font-weight="650" fill="var(--fig-mark, #b4571f)">reservation deadline</text>

    <!-- running jobs row (the 640 GPUs busy) -->
    <rect x="48" y="88" width="252" height="26" rx="4" fill="var(--fig-outline, #364c50)" opacity="0.5"/>
    <text x="52" y="105" font-size="8.5" font-weight="650" fill="var(--fig-paper, #f7f3e9)">640 GPUs committed to running jobs, draining as they finish</text>

    <!-- the idle hole -->
    <rect x="48" y="122" width="252" height="30" rx="4" fill="none" stroke="var(--fig-rule, #6e6a5b)" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="52" y="135" font-size="8" fill="var(--fig-rule, #6e6a5b)">idle hole: 384 free GPUs the reservation is holding for the gang</text>
    <text x="52" y="147" font-size="8" fill="var(--fig-rule, #6e6a5b)">naive atomicity wastes them for 5 h — 1,920 GPU-hours</text>

    <!-- backfill job that fits: 2h x 128 GPUs, runs now to +2 (x48..x148), release done by +2.5 -->
    <rect x="48" y="162" width="100" height="26" rx="4" fill="var(--fig-mark, #b4571f)" opacity="0.75"/>
    <text x="52" y="179" font-size="8.5" font-weight="650" fill="var(--fig-paper, #f7f3e9)">backfill: 128 GPUs × 2 h</text>
    <!-- release tail -->
    <rect x="148" y="162" width="18" height="26" rx="3" fill="var(--fig-mark, #b4571f)" opacity="0.35"/>
    <text x="157" y="197" font-size="7" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">exit</text>
    <!-- fit annotation -->
    <text x="176" y="172" font-size="8" fill="var(--fig-rule, #6e6a5b)">fits: compute + enforced release</text>
    <text x="176" y="183" font-size="8" fill="var(--fig-rule, #6e6a5b)">complete 2.5 h before the deadline</text>

    <!-- job that doesn't fit -->
    <rect x="48" y="200" width="252" height="22" rx="4" fill="none" stroke="var(--fig-rule, #6e6a5b)" stroke-width="0.9" opacity="0.7"/>
    <text x="52" y="215" font-size="8" fill="var(--fig-rule, #6e6a5b)">6-hour job: release would land past the deadline — must wait outside the window</text>

    <text x="190" y="290" font-size="8.5" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">the estimate finds the window; the release contract makes it safe</text>
  </g>
</svg>
