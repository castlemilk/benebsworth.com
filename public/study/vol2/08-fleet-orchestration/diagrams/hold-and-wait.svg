<svg xmlns="http://www.w3.org/2000/svg" id="hold-and-wait" class="study-fig-fit" viewBox="0 0 380 300" role="img" aria-labelledby="hw-title hw-desc">
  <title id="hw-title">Hold-and-wait and the atomic repair</title>
  <desc id="hw-desc">Left panel: two rigid jobs each hold four of the eight GPUs they need; wait arrows close a cycle and every held GPU idles. Right panel: atomic gang allocation grants one job all eight and the other waits holding nothing, so no cycle can form.</desc>
  <style>
    .dark #hold-and-wait { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094 }
    @media (prefers-color-scheme: dark) { svg:root#hold-and-wait { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094 } }
  </style>
  <rect width="380" height="300" rx="8" fill="var(--fig-paper, #f7f3e9)"/>
  <g font-family="system-ui, sans-serif" fill="var(--fig-ink, #252923)">
    <text x="20" y="28" font-size="19" font-weight="650">Hold-and-wait</text>
    <text x="20" y="45" font-size="11" fill="var(--fig-rule, #6e6a5b)">two rigid jobs, each needing 8 GPUs from a pool of 8 + 8</text>

    <!-- LEFT panel: deadlock -->
    <text x="96" y="76" font-size="10.5" text-anchor="middle" font-weight="650" fill="var(--fig-mark, #b4571f)">partial allocation</text>
    <!-- J1 box -->
    <rect x="24" y="88" width="64" height="56" rx="5" fill="none" stroke="var(--fig-outline, #364c50)" stroke-width="1.4"/>
    <text x="56" y="102" font-size="9" text-anchor="middle" font-weight="650">job J1</text>
    <!-- J1 held GPUs 4 filled of 8 slots -->
    <g>
      <rect x="32" y="110" width="11" height="11" rx="2" fill="var(--fig-mark, #b4571f)" opacity="0.85"/>
      <rect x="46" y="110" width="11" height="11" rx="2" fill="var(--fig-mark, #b4571f)" opacity="0.85"/>
      <rect x="60" y="110" width="11" height="11" rx="2" fill="var(--fig-mark, #b4571f)" opacity="0.85"/>
      <rect x="74" y="110" width="11" height="11" rx="2" fill="var(--fig-mark, #b4571f)" opacity="0.85"/>
      <rect x="32" y="126" width="11" height="11" rx="2" fill="none" stroke="var(--fig-rule, #6e6a5b)" stroke-width="0.8" stroke-dasharray="2 2"/>
      <rect x="46" y="126" width="11" height="11" rx="2" fill="none" stroke="var(--fig-rule, #6e6a5b)" stroke-width="0.8" stroke-dasharray="2 2"/>
      <rect x="60" y="126" width="11" height="11" rx="2" fill="none" stroke="var(--fig-rule, #6e6a5b)" stroke-width="0.8" stroke-dasharray="2 2"/>
      <rect x="74" y="126" width="11" height="11" rx="2" fill="none" stroke="var(--fig-rule, #6e6a5b)" stroke-width="0.8" stroke-dasharray="2 2"/>
    </g>
    <text x="56" y="152" font-size="7.5" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">holds 4, needs 8</text>
    <!-- J2 box -->
    <rect x="104" y="88" width="64" height="56" rx="5" fill="none" stroke="var(--fig-outline, #364c50)" stroke-width="1.4"/>
    <text x="136" y="102" font-size="9" text-anchor="middle" font-weight="650">job J2</text>
    <g>
      <rect x="112" y="110" width="11" height="11" rx="2" fill="var(--fig-mark, #b4571f)" opacity="0.85"/>
      <rect x="126" y="110" width="11" height="11" rx="2" fill="var(--fig-mark, #b4571f)" opacity="0.85"/>
      <rect x="140" y="110" width="11" height="11" rx="2" fill="var(--fig-mark, #b4571f)" opacity="0.85"/>
      <rect x="154" y="110" width="11" height="11" rx="2" fill="var(--fig-mark, #b4571f)" opacity="0.85"/>
      <rect x="112" y="126" width="11" height="11" rx="2" fill="none" stroke="var(--fig-rule, #6e6a5b)" stroke-width="0.8" stroke-dasharray="2 2"/>
      <rect x="126" y="126" width="11" height="11" rx="2" fill="none" stroke="var(--fig-rule, #6e6a5b)" stroke-width="0.8" stroke-dasharray="2 2"/>
      <rect x="140" y="126" width="11" height="11" rx="2" fill="none" stroke="var(--fig-rule, #6e6a5b)" stroke-width="0.8" stroke-dasharray="2 2"/>
      <rect x="154" y="126" width="11" height="11" rx="2" fill="none" stroke="var(--fig-rule, #6e6a5b)" stroke-width="0.8" stroke-dasharray="2 2"/>
    </g>
    <text x="136" y="152" font-size="7.5" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">holds 4, needs 8</text>
    <!-- wait cycle arrows -->
    <path d="M 88 92 C 96 84, 100 84, 104 90" fill="none" stroke="var(--fig-mark, #b4571f)" stroke-width="1.5" marker-end="url(#hw-arr)"/>
    <path d="M 104 152 C 100 160, 94 160, 88 154" fill="none" stroke="var(--fig-mark, #b4571f)" stroke-width="1.5" marker-end="url(#hw-arr)"/>
    <defs>
      <marker id="hw-arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,0 L8,4 L0,8 z" fill="var(--fig-mark, #b4571f)"/>
      </marker>
    </defs>
    <text x="96" y="176" font-size="8.5" text-anchor="middle" fill="var(--fig-mark, #b4571f)" font-weight="650">cycle: each waits on the other's 4</text>
    <text x="96" y="189" font-size="8.5" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">8 GPUs held · 0 steps · full price</text>

    <!-- RIGHT panel: atomic -->
    <text x="284" y="76" font-size="10.5" text-anchor="middle" font-weight="650" fill="var(--fig-outline, #364c50)">atomic gang</text>
    <rect x="212" y="88" width="64" height="56" rx="5" fill="none" stroke="var(--fig-outline, #364c50)" stroke-width="1.4"/>
    <text x="244" y="102" font-size="9" text-anchor="middle" font-weight="650">job J1</text>
    <g>
      <rect x="220" y="110" width="11" height="11" rx="2" fill="var(--fig-outline, #364c50)" opacity="0.8"/>
      <rect x="234" y="110" width="11" height="11" rx="2" fill="var(--fig-outline, #364c50)" opacity="0.8"/>
      <rect x="248" y="110" width="11" height="11" rx="2" fill="var(--fig-outline, #364c50)" opacity="0.8"/>
      <rect x="262" y="110" width="11" height="11" rx="2" fill="var(--fig-outline, #364c50)" opacity="0.8"/>
      <rect x="220" y="126" width="11" height="11" rx="2" fill="var(--fig-outline, #364c50)" opacity="0.8"/>
      <rect x="234" y="126" width="11" height="11" rx="2" fill="var(--fig-outline, #364c50)" opacity="0.8"/>
      <rect x="248" y="126" width="11" height="11" rx="2" fill="var(--fig-outline, #364c50)" opacity="0.8"/>
      <rect x="262" y="126" width="11" height="11" rx="2" fill="var(--fig-outline, #364c50)" opacity="0.8"/>
    </g>
    <text x="244" y="152" font-size="7.5" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">holds all 8, runs</text>
    <!-- J2 queued, holds nothing -->
    <rect x="292" y="88" width="64" height="56" rx="5" fill="none" stroke="var(--fig-rule, #6e6a5b)" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="324" y="102" font-size="9" text-anchor="middle" font-weight="650" fill="var(--fig-rule, #6e6a5b)">job J2</text>
    <text x="324" y="122" font-size="8" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">queued</text>
    <text x="324" y="134" font-size="8" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">holds nothing</text>
    <text x="324" y="152" font-size="7.5" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">cannot block J1</text>
    <text x="284" y="176" font-size="8.5" text-anchor="middle" fill="var(--fig-outline, #364c50)" font-weight="650">no holder, no cycle</text>
    <text x="284" y="189" font-size="8.5" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">all-or-nothing per job</text>

    <!-- bottom: the stake -->
    <line x1="24" x2="356" y1="208" y2="208" stroke="var(--fig-rule, #6e6a5b)" stroke-width="0.6" opacity="0.4"/>
    <text x="24" y="228" font-size="10" font-weight="650">the price of the cycle</text>
    <text x="24" y="246" font-size="9" fill="var(--fig-rule, #6e6a5b)">every held GPU burns power and capital at zero output —</text>
    <text x="24" y="261" font-size="9" fill="var(--fig-rule, #6e6a5b)">rigid training is the full gang or nothing, never half the steps.</text>
    <text x="24" y="281" font-size="9.5" font-weight="650" fill="var(--fig-mark, #b4571f)">~7 h of whole-fleet deadlock erases a day of usage gain</text>
  </g>
</svg>
