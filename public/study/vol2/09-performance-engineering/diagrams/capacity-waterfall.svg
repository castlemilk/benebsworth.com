<svg xmlns="http://www.w3.org/2000/svg" id="capacity-waterfall" class="study-fig-fit" viewBox="0 0 380 300" role="img" aria-labelledby="cw-title cw-desc">
  <title id="cw-title">Where held capacity goes</title>
  <desc id="cw-desc">Waterfall for Llama 3 405B on 16,384 dedicated GPUs over 54 days: scheduling loss vanishes, about a tenth drains at the runtime boundary, more than half at the program boundary, and roughly 37 percent of held capacity becomes training progress.</desc>
  <style>
    .dark #capacity-waterfall { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094 }
    @media (prefers-color-scheme: dark) { svg:root#capacity-waterfall { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094 } }
  </style>
  <rect width="380" height="300" rx="8" fill="var(--fig-paper, #f7f3e9)"/>
  <g font-family="system-ui, sans-serif" fill="var(--fig-ink, #252923)">
    <text x="20" y="28" font-size="19" font-weight="650">Where held capacity goes</text>
    <text x="20" y="45" font-size="11" fill="var(--fig-rule, #6e6a5b)">Llama 3 405B · 16,384 dedicated H100s · 54 days</text>

    <!-- full capacity bar -->
    <rect x="24" y="66" width="332" height="26" rx="4" fill="var(--fig-outline, #364c50)" opacity="0.9"/>
    <text x="32" y="83" font-size="10" font-weight="650" fill="var(--fig-paper, #f7f3e9)">held capacity: 100%</text>
    <text x="356" y="60" font-size="8.5" text-anchor="end" fill="var(--fig-rule, #6e6a5b)">scheduling loss: 0 (dedicated cluster)</text>

    <!-- drain 1: runtime boundary ~10% -->
    <rect x="24" y="108" width="332" height="22" rx="4" fill="none" stroke="var(--fig-rule, #6e6a5b)" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6"/>
    <rect x="290" y="108" width="66" height="22" rx="4" fill="var(--fig-rule, #6e6a5b)" opacity="0.45"/>
    <text x="323" y="123" font-size="8.5" text-anchor="middle" fill="var(--fig-paper, #f7f3e9)">runtime</text>
    <text x="24" y="103" font-size="9" fill="var(--fig-rule, #6e6a5b)">runtime boundary: failures, checkpoints, stalls drain ~10%</text>

    <!-- drain 2: program boundary ~53% -->
    <rect x="24" y="146" width="299" height="22" rx="4" fill="none" stroke="var(--fig-rule, #6e6a5b)" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6"/>
    <rect x="148" y="146" width="175" height="22" rx="4" fill="var(--fig-rule, #6e6a5b)" opacity="0.45"/>
    <text x="235" y="161" font-size="8.5" text-anchor="middle" fill="var(--fig-paper, #f7f3e9)">program loss: steps below peak rate</text>
    <text x="24" y="141" font-size="9" fill="var(--fig-rule, #6e6a5b)">program boundary: retained steps at 41% MFU drain over half</text>

    <!-- progress bar ~37% -->
    <rect x="24" y="184" width="123" height="30" rx="4" fill="var(--fig-mark, #b4571f)"/>
    <text x="85" y="203" font-size="11" text-anchor="middle" font-weight="650" fill="var(--fig-paper, #f7f3e9)">progress ~37%</text>

    <!-- boundary ticks -->
    <line x1="290" y1="92" x2="290" y2="108" stroke="var(--fig-rule, #6e6a5b)" stroke-width="1"/>
    <line x1="148" y1="130" x2="148" y2="146" stroke="var(--fig-rule, #6e6a5b)" stroke-width="1"/>

    <text x="24" y="248" font-size="9" fill="var(--fig-rule, #6e6a5b)">the best-published run of its generation still lost</text>
    <text x="24" y="261" font-size="9" fill="var(--fig-rule, #6e6a5b)">almost two thirds of its fleet, and most of that loss</text>
    <text x="24" y="274" font-size="9" fill="var(--fig-rule, #6e6a5b)">is not failures: it is steps running below peak rate.</text>
    <text x="24" y="292" font-size="9.5" font-weight="650" fill="var(--fig-mark, #b4571f)">program loss is several times the runtime loss</text>
  </g>
</svg>
