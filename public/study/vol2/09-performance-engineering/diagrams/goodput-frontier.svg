<svg xmlns="http://www.w3.org/2000/svg" id="goodput-frontier" class="study-fig-fit" viewBox="0 0 380 300" role="img" aria-labelledby="gf-title gf-desc">
  <title id="gf-title">Trading between factors</title>
  <desc id="gf-desc">Schematic factor-trade diagram: levers move one goodput factor up and another down; the product decides. For the running example a point of P is worth most, then S, then R.</desc>
  <style>
    .dark #goodput-frontier { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094 }
    @media (prefers-color-scheme: dark) { svg:root#goodput-frontier { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094 } }
  </style>
  <rect width="380" height="300" rx="8" fill="var(--fig-paper, #f7f3e9)"/>
  <g font-family="system-ui, sans-serif" fill="var(--fig-ink, #252923)">
    <text x="20" y="28" font-size="19" font-weight="650">The product decides</text>
    <text x="20" y="45" font-size="11" fill="var(--fig-rule, #6e6a5b)">levers move factors against each other · schematic</text>

    <!-- three factor cards with lever arrows -->
    <rect x="24" y="64" width="100" height="52" rx="5" fill="none" stroke="var(--fig-outline, #364c50)" stroke-width="1.4"/>
    <text x="74" y="84" font-size="10" text-anchor="middle" font-weight="650">S scheduling</text>
    <text x="74" y="99" font-size="8.5" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">worth: 2nd</text>

    <rect x="140" y="64" width="100" height="52" rx="5" fill="none" stroke="var(--fig-outline, #364c50)" stroke-width="1.4"/>
    <text x="190" y="84" font-size="10" text-anchor="middle" font-weight="650">R runtime</text>
    <text x="190" y="99" font-size="8.5" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">worth: 3rd</text>

    <rect x="256" y="64" width="100" height="52" rx="5" fill="none" stroke="var(--fig-mark, #b4571f)" stroke-width="1.8"/>
    <text x="306" y="84" font-size="10" text-anchor="middle" font-weight="650" fill="var(--fig-mark, #b4571f)">P program</text>
    <text x="306" y="99" font-size="8.5" text-anchor="middle" fill="var(--fig-mark, #b4571f)">worth: 1st</text>

    <!-- multiplication signs -->
    <text x="132" y="94" font-size="12" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">x</text>
    <text x="248" y="94" font-size="12" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">x</text>

    <!-- trade arrow example: give up R to buy P -->
    <path d="M 200 130 Q 240 155 290 128" fill="none" stroke="var(--fig-mark, #b4571f)" stroke-width="1.6" marker-end="url(#gf-arrow)"/>
    <defs><marker id="gf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--fig-mark, #b4571f)"/></marker></defs>
    <text x="244" y="152" font-size="8.5" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">a P lever can afford to give up</text>
    <text x="244" y="163" font-size="8.5" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">about a quarter of runtime goodput</text>

    <!-- elastic strategies note -->
    <rect x="24" y="182" width="332" height="56" rx="5" fill="none" stroke="var(--fig-rule, #6e6a5b)" stroke-width="0.9" stroke-dasharray="4 3"/>
    <text x="36" y="202" font-size="9" font-weight="650">elastic strategies are goodput trades</text>
    <text x="36" y="216" font-size="8.5" fill="var(--fig-rule, #6e6a5b)">the smaller allocation runs at higher scaling efficiency;</text>
    <text x="36" y="229" font-size="8.5" fill="var(--fig-rule, #6e6a5b)">no strategy dominates another at one interruption cost.</text>

    <text x="24" y="264" font-size="9" fill="var(--fig-rule, #6e6a5b)">maximize the product at the operating point, never the</text>
    <text x="24" y="277" font-size="9" fill="var(--fig-rule, #6e6a5b)">single factor a dashboard happens to display.</text>
    <text x="24" y="294" font-size="9.5" font-weight="650" fill="var(--fig-mark, #b4571f)">the example pays 3-4x the capacity price for useful work</text>
  </g>
</svg>
