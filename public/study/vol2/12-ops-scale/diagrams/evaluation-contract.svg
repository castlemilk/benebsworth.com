<svg xmlns="http://www.w3.org/2000/svg" id="evaluation-contract" class="study-fig-fit" viewBox="0 0 380 330" role="img" aria-labelledby="evaluation-contract-title evaluation-contract-desc">
  <title id="evaluation-contract-title">One evaluation contract, five evidence planes</title>
  <desc id="evaluation-contract-desc">Five evidence planes, offline behavior, system performance, responsibility and safety, online experiment and recovery and audit, all bind to one versioned evaluation contract. Promotion requires every required sign-off on the same artifact; an invalidated plane returns the candidate to its owning gate.</desc>
  <style>
    .dark #evaluation-contract { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094; --fig-danger:#e88f8f }
    @media (prefers-color-scheme: dark) { svg:root#evaluation-contract { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094; --fig-danger:#e88f8f } }
  </style>
  <rect width="380" height="330" rx="8" fill="var(--fig-paper, #f7f3e9)"/>
  <g font-family="system-ui, sans-serif" fill="var(--fig-ink, #252923)">
    <text x="20" y="28" font-size="19" font-weight="650">A release is one contract</text>
    <text x="20" y="45" font-size="11" fill="var(--fig-rule, #6e6a5b)">offline · system · responsibility · online · recovery</text>

    <g font-size="10">
      <rect x="20" y="62" width="160" height="34" rx="5" fill="none" stroke="var(--fig-outline, #364c50)"/>
      <text x="100" y="83" text-anchor="middle">offline behavior</text>
      <rect x="20" y="104" width="160" height="34" rx="5" fill="none" stroke="var(--fig-outline, #364c50)"/>
      <text x="100" y="125" text-anchor="middle">system performance</text>
      <rect x="20" y="146" width="160" height="34" rx="5" fill="none" stroke="var(--fig-outline, #364c50)"/>
      <text x="100" y="167" text-anchor="middle">responsibility / safety</text>
      <rect x="20" y="188" width="160" height="34" rx="5" fill="none" stroke="var(--fig-outline, #364c50)"/>
      <text x="100" y="209" text-anchor="middle">online experiment</text>
      <rect x="20" y="230" width="160" height="34" rx="5" fill="none" stroke="var(--fig-outline, #364c50)"/>
      <text x="100" y="251" text-anchor="middle">recovery / audit</text>
    </g>
    <g stroke="var(--fig-outline, #364c50)" stroke-width="1.2">
      <line x1="180" y1="79" x2="212" y2="150"/>
      <line x1="180" y1="121" x2="212" y2="160"/>
      <line x1="180" y1="163" x2="212" y2="172"/>
      <line x1="180" y1="205" x2="212" y2="186"/>
      <line x1="180" y1="247" x2="212" y2="198"/>
    </g>

    <rect x="216" y="120" width="150" height="90" rx="8" fill="none" stroke="var(--fig-mark, #b4571f)" stroke-width="1.8"/>
    <text x="291" y="145" font-size="12" font-weight="650" text-anchor="middle">evaluation</text>
    <text x="291" y="160" font-size="12" font-weight="650" text-anchor="middle">contract</text>
    <text x="291" y="178" font-size="9" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">one artifact · pinned fields</text>
    <text x="291" y="191" font-size="9" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">per-plane owner · sign-off</text>

    <rect x="216" y="228" width="150" height="30" rx="5" fill="none" stroke="var(--fig-outline, #364c50)"/>
    <text x="291" y="247" font-size="10" text-anchor="middle">promotion gate</text>
    <line x1="291" y1="210" x2="291" y2="228" stroke="var(--fig-mark, #b4571f)" stroke-width="1.6"/>
    <path d="M291 228 l-4 -7 h8 z" fill="var(--fig-mark, #b4571f)"/>

    <path d="M366 165 l12 0" stroke="var(--fig-danger, #b4571f)" stroke-width="1.6"/>
    <path d="M378 165 l-7 -4 v8 z" fill="var(--fig-danger, #b4571f)"/>
    <text x="374" y="158" font-size="9" text-anchor="end" fill="var(--fig-danger, #b4571f)">invalidate</text>
    <text x="210" y="300" font-size="10" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">returns to the owning gate, not to a retry loop</text>
    <line x1="378" y1="165" x2="378" y2="300" stroke="var(--fig-danger, #b4571f)" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
    <line x1="378" y1="300" x2="100" y2="300" stroke="var(--fig-danger, #b4571f)" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
    <line x1="100" y1="300" x2="100" y2="264" stroke="var(--fig-danger, #b4571f)" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
    <path d="M100 264 l-4 7 h8 z" fill="var(--fig-danger, #b4571f)"/>
  </g>
</svg>
