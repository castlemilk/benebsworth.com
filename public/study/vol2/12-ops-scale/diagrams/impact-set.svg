<svg xmlns="http://www.w3.org/2000/svg" id="impact-set" class="study-fig-fit" viewBox="0 0 380 340" role="img" aria-labelledby="impact-set-title impact-set-desc">
  <title id="impact-set-title">Registry impact-set traversal</title>
  <desc id="impact-set-desc">An upstream model update traverses recorded dependency edges to an impact set, triggers re-evaluation of every consumer, blocks promotion until all pass, and rolls out in compatible stages. An unrecorded consumer is silently unflagged.</desc>
  <style>
    .dark #impact-set { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094; --fig-danger:#e88f8f }
    @media (prefers-color-scheme: dark) { svg:root#impact-set { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094; --fig-danger:#e88f8f } }
  </style>
  <rect width="380" height="340" rx="8" fill="var(--fig-paper, #f7f3e9)"/>
  <g font-family="system-ui, sans-serif" fill="var(--fig-ink, #252923)">
    <text x="20" y="28" font-size="19" font-weight="650">What does one version bump break?</text>
    <text x="20" y="45" font-size="11" fill="var(--fig-rule, #6e6a5b)">dependency graph traversal, not a per-model checklist</text>

    <rect x="20" y="62" width="120" height="44" rx="6" fill="none" stroke="var(--fig-mark, #b4571f)" stroke-width="1.6"/>
    <text x="80" y="80" font-size="11" font-weight="650" text-anchor="middle">user_embedding</text>
    <text x="80" y="95" font-size="10" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">v3.2.1 → v3.2.2</text>

    <line x1="140" y1="84" x2="168" y2="84" stroke="var(--fig-ink, #252923)" stroke-width="1.6"/>
    <path d="M168 84 l-7 -4 v8 z" fill="var(--fig-ink, #252923)"/>
    <text x="154" y="76" font-size="9" text-anchor="middle">traverse</text>

    <g font-size="10">
      <rect x="172" y="56" width="96" height="24" rx="5" fill="none" stroke="var(--fig-outline, #364c50)"/>
      <text x="220" y="72" text-anchor="middle">retrieval R</text>
      <rect x="172" y="88" width="96" height="24" rx="5" fill="none" stroke="var(--fig-outline, #364c50)"/>
      <text x="220" y="104" text-anchor="middle">rankers K1–K3</text>
      <rect x="172" y="120" width="96" height="24" rx="5" fill="none" stroke="var(--fig-outline, #364c50)"/>
      <text x="220" y="136" text-anchor="middle">ensemble M</text>
    </g>
    <g stroke="var(--fig-outline, #364c50)" stroke-width="1.3">
      <line x1="140" y1="74" x2="172" y2="68"/>
      <line x1="140" y1="84" x2="172" y2="100"/>
      <line x1="140" y1="94" x2="172" y2="132"/>
    </g>

    <rect x="276" y="76" width="88" height="56" rx="6" fill="none" stroke="var(--fig-mark, #b4571f)" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="320" y="98" font-size="10" font-weight="650" text-anchor="middle">re-evaluate</text>
    <text x="320" y="112" font-size="10" text-anchor="middle">all consumers</text>
    <g stroke="var(--fig-mark, #b4571f)" stroke-width="1.3">
      <line x1="268" y1="68" x2="276" y2="92"/>
      <line x1="268" y1="100" x2="276" y2="100"/>
      <line x1="268" y1="132" x2="276" y2="110"/>
    </g>
    <text x="320" y="152" font-size="9" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">block until all pass</text>

    <rect x="172" y="176" width="192" height="30" rx="5" fill="none" stroke="var(--fig-outline, #364c50)"/>
    <text x="268" y="195" font-size="10" text-anchor="middle">compatible intermediate states</text>
    <text x="268" y="164" font-size="9" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">staged rollout + validated rollback</text>

    <rect x="20" y="232" width="150" height="44" rx="6" fill="none" stroke="var(--fig-danger, #b4571f)" stroke-dasharray="4 3"/>
    <text x="95" y="250" font-size="10" font-weight="650" text-anchor="middle">fraud model F</text>
    <text x="95" y="265" font-size="9" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">unrecorded edge: silently</text>
    <text x="95" y="277" font-size="9" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">unflagged by the traversal</text>
    <line x1="95" y1="232" x2="200" y2="176" stroke="var(--fig-danger, #b4571f)" stroke-width="1" stroke-dasharray="3 3"/>

    <text x="20" y="312" font-size="10" fill="var(--fig-rule, #6e6a5b)">A version bump is safe only if the recorded graph matches reality.</text>
  </g>
</svg>
