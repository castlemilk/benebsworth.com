<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-label="Nested accounting boundaries from bare arithmetic to full lifecycle">
  <style>
    .bg{fill:var(--diagram-bg,#fff)}
    .title{font:600 15px var(--font-sans,sans-serif);fill:var(--diagram-ink,#1c1c1e)}
    .sub{font:11px var(--font-sans,sans-serif);fill:var(--diagram-ink-soft,#5a5a60)}
    .lbl{font:12px var(--font-sans,sans-serif);fill:var(--diagram-ink,#1c1c1e)}
    .sm{font:10.5px var(--font-sans,sans-serif);fill:var(--diagram-ink-soft,#5a5a60)}
    .b1{fill:var(--diagram-accent-soft,#e8eefb);stroke:var(--diagram-accent,#3c64c8);stroke-width:1.4}
    .b2{fill:none;stroke:var(--diagram-accent,#3c64c8);stroke-width:1.2}
    .b3{fill:none;stroke:var(--diagram-accent,#3c64c8);stroke-width:1.2;stroke-dasharray:6 3}
    .b4{fill:none;stroke:var(--diagram-warn,#c85a3c);stroke-width:1.2;stroke-dasharray:6 3}
    .b5{fill:none;stroke:var(--diagram-warn,#c85a3c);stroke-width:1.5}
    .hd{font:600 11.5px var(--font-sans,sans-serif);fill:var(--diagram-ink,#1c1c1e)}
  </style>
  <rect class="bg" width="760" height="420"/>
  <text class="title" x="30" y="32">A footprint is only as good as its boundary</text>
  <text class="sub" x="30" y="51">Each wider ring adds energy terms the narrower one excludes. The Gemini prompt measurement prices the gap.</text>
  <!-- nested boundaries -->
  <rect class="b5" x="40" y="80" width="500" height="300" rx="14"/>
  <text class="hd" x="56" y="102">lifecycle: + embodied manufacturing, transport, disposal</text>
  <rect class="b4" x="58" y="112" width="464" height="252" rx="12"/>
  <text class="hd" x="74" y="134">facility: x PUE for cooling and facility-side losses</text>
  <rect class="b3" x="76" y="144" width="428" height="204" rx="10"/>
  <text class="hd" x="92" y="166">IT equipment: + host CPUs, memory, networking, idle machines</text>
  <rect class="b2" x="94" y="176" width="392" height="156" rx="9"/>
  <text class="hd" x="110" y="198">accelerator: + support silicon, conversion loss on the board</text>
  <rect class="b1" x="112" y="208" width="356" height="108" rx="8"/>
  <text class="hd" x="128" y="232">bare arithmetic</text>
  <text class="sm" x="128" y="254">the FLOPs themselves, the narrowest</text>
  <text class="sm" x="128" y="270">boundary a published estimate can use</text>
  <!-- Gemini annotation -->
  <rect x="556" y="120" width="174" height="204" rx="8" fill="var(--diagram-panel,#f6f6f4)" stroke="var(--diagram-edge,#999)"/>
  <text class="hd" x="570" y="146">median Gemini prompt</text>
  <text class="sm" x="570" y="168">full-stack measured:</text>
  <text class="lbl" x="570" y="190">~0.24 Wh</text>
  <text class="sm" x="570" y="216">accelerator-only on</text>
  <text class="sm" x="570" y="230">best-utilized machines:</text>
  <text class="sm" x="570" y="252">understates ~10x</text>
  <text class="sm" x="570" y="278">hosts, idle capacity and</text>
  <text class="sm" x="570" y="292">facility overhead carry the rest</text>
  <line x1="540" y1="225" x2="556" y2="225" stroke="var(--diagram-ink-soft,#5a5a60)" stroke-width="1.2"/>
  <text class="sm" x="40" y="404">A figure missing its boundary can diagnose one component but cannot support an end-to-end comparison.</text>
</svg>
