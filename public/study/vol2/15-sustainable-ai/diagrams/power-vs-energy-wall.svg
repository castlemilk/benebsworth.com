<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="Instantaneous power ceiling versus cumulative energy account">
  <style>
    .bg{fill:var(--diagram-bg,#fff)}
    .title{font:600 15px var(--font-sans,sans-serif);fill:var(--diagram-ink,#1c1c1e)}
    .sub{font:11px var(--font-sans,sans-serif);fill:var(--diagram-ink-soft,#5a5a60)}
    .lbl{font:12px var(--font-sans,sans-serif);fill:var(--diagram-ink,#1c1c1e)}
    .sm{font:10.5px var(--font-sans,sans-serif);fill:var(--diagram-ink-soft,#5a5a60)}
    .hd{font:600 12.5px var(--font-sans,sans-serif);fill:var(--diagram-accent,#3c64c8)}
    .ax{stroke:var(--diagram-ink-soft,#5a5a60);stroke-width:1.2;fill:none}
    .feed{stroke:var(--diagram-warn,#c85a3c);stroke-width:1.6;stroke-dasharray:6 4}
    .burst{fill:var(--diagram-warn,#c85a3c);opacity:.75}
    .slow{fill:var(--diagram-accent,#3c64c8);opacity:.55}
    .panel{fill:var(--diagram-panel,#f6f6f4);stroke:var(--diagram-edge,#999);stroke-width:1}
  </style>
  <rect class="bg" width="760" height="400"/>
  <text class="title" x="30" y="32">Two limits, two arithmetics</text>
  <text class="sub" x="30" y="51">The power ceiling binds at every instant; the energy account only accumulates.</text>
  <!-- left: power ceiling -->
  <rect class="panel" x="30" y="70" width="340" height="250" rx="8"/>
  <text class="hd" x="50" y="96">instantaneous: power ceiling</text>
  <line class="ax" x1="70" y1="280" x2="350" y2="280"/>
  <line class="ax" x1="70" y1="280" x2="70" y2="120"/>
  <text class="sm" x="210" y="298" text-anchor="middle">time</text>
  <text class="sm" x="52" y="200" transform="rotate(-90 52 200)" text-anchor="middle">MW</text>
  <line class="feed" x1="70" y1="180" x2="350" y2="180"/>
  <text class="sm" x="346" y="172" text-anchor="end">grid feed 80 MW</text>
  <!-- burst violating -->
  <rect class="burst" x="120" y="140" width="40" height="140"/>
  <text class="sm" x="140" y="132" text-anchor="middle">3-day burst</text>
  <text class="sm" x="140" y="255" text-anchor="middle" fill="#fff">120</text>
  <text class="sm" x="186" y="152">infeasible: feed caps</text>
  <text class="sm" x="186" y="166">active servers now,</text>
  <text class="sm" x="186" y="180">whatever the run length</text>
  <!-- slow feasible -->
  <rect class="slow" x="240" y="230" width="100" height="50"/>
  <text class="sm" x="290" y="222" text-anchor="middle">month-long 40 MW</text>
  <text class="sm" x="290" y="258" text-anchor="middle">feasible, more total energy</text>
  <!-- right: energy integral -->
  <rect class="panel" x="400" y="70" width="330" height="250" rx="8"/>
  <text class="hd" x="420" y="96">cumulative: energy integral</text>
  <line class="ax" x1="440" y1="280" x2="710" y2="280"/>
  <line class="ax" x1="440" y1="280" x2="440" y2="120"/>
  <text class="sm" x="575" y="298" text-anchor="middle">wall-clock time</text>
  <text class="sm" x="422" y="200" transform="rotate(-90 422 200)" text-anchor="middle">avg power</text>
  <rect class="slow" x="470" y="190" width="180" height="90"/>
  <text class="sm" x="560" y="182" text-anchor="middle">E = average power x duration</text>
  <text class="sm" x="560" y="240" text-anchor="middle">area = joules</text>
  <text class="sm" x="470" y="130">tariffs and emissions attach</text>
  <text class="sm" x="470" y="144">to this area, not to the peak</text>
  <!-- bottom contrast -->
  <text class="lbl" x="30" y="352">A modest-energy burst can trip breakers; a large-energy slow job can be safe.</text>
  <text class="sm" x="30" y="372">Feasibility is instantaneous. Cost and carbon are integrals. Neither arithmetic substitutes for the other.</text>
</svg>
