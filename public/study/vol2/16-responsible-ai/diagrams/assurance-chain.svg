<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="The assurance chain from claim to action, with evidence feeding one link">
  <style>
    .bg{fill:var(--diagram-bg,#fff)}
    .title{font:600 15px var(--font-sans,sans-serif);fill:var(--diagram-ink,#1c1c1e)}
    .sub{font:11px var(--font-sans,sans-serif);fill:var(--diagram-ink-soft,#5a5a60)}
    .sm{font:10.5px var(--font-sans,sans-serif);fill:var(--diagram-ink-soft,#5a5a60)}
    .link{fill:var(--diagram-accent-soft,#e8eefb);stroke:var(--diagram-accent,#3c64c8);stroke-width:1.3}
    .lt{font:600 12px var(--font-sans,sans-serif);fill:var(--diagram-accent,#3c64c8)}
    .arr{stroke:var(--diagram-ink-soft,#5a5a60);stroke-width:1.6;fill:none;marker-end:url(#ah5)}
    .ev{fill:var(--diagram-panel,#f6f6f4);stroke:var(--diagram-edge,#999);stroke-width:1.1;stroke-dasharray:5 3}
    .et{font:10.5px var(--font-sans,sans-serif);fill:var(--diagram-ink-soft,#5a5a60)}
    .brk{stroke:var(--diagram-warn,#c85a3c);stroke-width:2;fill:none}
    .wt{font:600 11px var(--font-sans,sans-serif);fill:var(--diagram-warn,#c85a3c)}
  </style>
  <defs><marker id="ah5" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="var(--diagram-ink-soft,#5a5a60)"/></marker></defs>
  <rect class="bg" width="760" height="400"/>
  <text class="title" x="30" y="32">The assurance chain</text>
  <text class="sub" x="30" y="51">Every artifact is evidence for one link. A chain missing its owner or its action is a log, not a control.</text>
  <!-- chain of 5 links -->
  <rect class="link" x="30" y="130" width="120" height="62" rx="8"/>
  <text class="lt" x="90" y="155" text-anchor="middle">claim</text>
  <text class="sm" x="90" y="172" text-anchor="middle">explicit, bounded</text>
  <line class="arr" x1="150" y1="161" x2="178" y2="161"/>
  <rect class="link" x="182" y="130" width="120" height="62" rx="8"/>
  <text class="lt" x="242" y="155" text-anchor="middle">argument</text>
  <text class="sm" x="242" y="172" text-anchor="middle">controls connect</text>
  <line class="arr" x1="302" y1="161" x2="330" y2="161"/>
  <rect class="link" x="334" y="130" width="120" height="62" rx="8"/>
  <text class="lt" x="394" y="155" text-anchor="middle">evidence</text>
  <text class="sm" x="394" y="172" text-anchor="middle">stated assumptions</text>
  <line class="arr" x1="454" y1="161" x2="482" y2="161"/>
  <rect class="link" x="486" y="130" width="120" height="62" rx="8"/>
  <text class="lt" x="546" y="155" text-anchor="middle">owner</text>
  <text class="sm" x="546" y="172" text-anchor="middle">can act, is named</text>
  <line class="arr" x1="606" y1="161" x2="634" y2="161"/>
  <rect class="link" x="638" y="130" width="100" height="62" rx="8"/>
  <text class="lt" x="688" y="155" text-anchor="middle">action</text>
  <text class="sm" x="688" y="172" text-anchor="middle">remedy path</text>
  <!-- evidence artifacts feeding the evidence link -->
  <rect class="ev" x="270" y="230" width="130" height="44" rx="6"/>
  <text class="et" x="335" y="248" text-anchor="middle">fairness dashboard</text>
  <text class="et" x="335" y="263" text-anchor="middle">subgroup gap metrics</text>
  <rect class="ev" x="420" y="230" width="130" height="44" rx="6"/>
  <text class="et" x="485" y="248" text-anchor="middle">certificate</text>
  <text class="et" x="485" y="263" text-anchor="middle">norm, radius, confidence</text>
  <rect class="ev" x="345" y="292" width="130" height="44" rx="6"/>
  <text class="et" x="410" y="310" text-anchor="middle">red-team report</text>
  <text class="et" x="410" y="325" text-anchor="middle">tested attack protocol</text>
  <line class="arr" x1="370" y1="230" x2="385" y2="196"/>
  <line class="arr" x1="450" y1="230" x2="420" y2="196"/>
  <line class="arr" x1="410" y1="292" x2="404" y2="196"/>
  <!-- break warning -->
  <line class="brk" x1="120" y1="230" x2="212" y2="230"/>
  <text class="wt" x="40" y="226">break anywhere:</text>
  <text class="sm" x="40" y="246">evidence without an owner</text>
  <text class="sm" x="40" y="262">never becomes action;</text>
  <text class="sm" x="40" y="278">alerts age out and regressions</text>
  <text class="sm" x="40" y="294">become accepted baselines</text>
  <text class="sm" x="30" y="378">The certificate proves its stated norm, radius, and configuration; the report covers its tested protocol. Neither covers the workflow.</text>
</svg>
