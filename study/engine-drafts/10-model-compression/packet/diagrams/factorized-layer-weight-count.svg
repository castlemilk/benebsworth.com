<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 167" role="img" aria-labelledby="study-svg-factorized-layer-weight-count-title" aria-describedby="study-svg-factorized-layer-weight-count-desc" class="study-fig-fit" font-family="system-ui, sans-serif">
  <title id="study-svg-factorized-layer-weight-count-title">Weight count for one linear layer</title>
  <desc id="study-svg-factorized-layer-weight-count-desc">At the assumed rank, the two factors contain one quarter as many weights. The bars quantify the change in parameters for this layer, while runtime depends on how the two operations execute. Full matrix: 1048576 weights. Rank-128 factors: 262144 weights.</desc>
  <rect x="0" y="0" width="344" height="167" rx="8" fill="var(--surface, #fbf7f0)"/>
  <g fill="var(--fg, #31251d)" font-family="ui-monospace, monospace">
  <text x="328" y="22" font-size="13.5" text-anchor="end">weights</text>
  <text x="16" y="43" font-size="15">Full matrix</text>
  <text x="328" y="81" font-size="14" text-anchor="end">1048576</text>
  <rect x="16" y="51" width="312" height="12" rx="3" fill="var(--surface-2, #e7dbcb)"/>
  <rect x="16" y="51" width="312" height="12" rx="3" fill="var(--blog, #984720)"/>
  <line x1="16" x2="16" y1="50" y2="64" stroke="var(--fg, #4b3a2d)"/>
  <text x="16" y="109" font-size="15">Rank-128 factors</text>
  <text x="328" y="147" font-size="14" text-anchor="end">262144</text>
  <rect x="16" y="117" width="312" height="12" rx="3" fill="var(--surface-2, #e7dbcb)"/>
  <rect x="16" y="117" width="78" height="12" rx="3" fill="var(--blog, #984720)"/>
  <line x1="16" x2="16" y1="116" y2="130" stroke="var(--fg, #4b3a2d)"/>
  </g>
</svg>
