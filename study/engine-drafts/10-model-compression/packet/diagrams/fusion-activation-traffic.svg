<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 167" role="img" aria-labelledby="study-svg-fusion-activation-traffic-title" aria-describedby="study-svg-fusion-activation-traffic-desc" class="study-fig-fit" font-family="system-ui, sans-serif">
  <title id="study-svg-fusion-activation-traffic-title">Idealized global-memory traffic for a chain</title>
  <desc id="study-svg-fusion-activation-traffic-desc">Under the stated buffer assumptions, fusion eliminates 16 MiB of intermediate reads and writes. Tiling and spills affect how much of that saving appears on the device. Three separate kernels: 24 MiB. One fused kernel: 8 MiB.</desc>
  <rect x="0" y="0" width="344" height="167" rx="8" fill="var(--surface, #fbf7f0)"/>
  <g fill="var(--fg, #31251d)" font-family="ui-monospace, monospace">
  <text x="328" y="22" font-size="13.5" text-anchor="end">MiB</text>
  <text x="16" y="43" font-size="15">Three separate kernels</text>
  <text x="328" y="81" font-size="14" text-anchor="end">24</text>
  <rect x="16" y="51" width="312" height="12" rx="3" fill="var(--surface-2, #e7dbcb)"/>
  <rect x="16" y="51" width="312" height="12" rx="3" fill="var(--blog, #984720)"/>
  <line x1="16" x2="16" y1="50" y2="64" stroke="var(--fg, #4b3a2d)"/>
  <text x="16" y="109" font-size="15">One fused kernel</text>
  <text x="328" y="147" font-size="14" text-anchor="end">8</text>
  <rect x="16" y="117" width="312" height="12" rx="3" fill="var(--surface-2, #e7dbcb)"/>
  <rect x="16" y="117" width="104" height="12" rx="3" fill="var(--blog, #984720)"/>
  <line x1="16" x2="16" y1="116" y2="130" stroke="var(--fg, #4b3a2d)"/>
  </g>
</svg>
