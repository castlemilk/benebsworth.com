<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 233" role="img" aria-labelledby="study-svg-roofline-upgrade-comparison-title" aria-describedby="study-svg-roofline-upgrade-comparison-desc" class="study-fig-fit" font-family="system-ui, sans-serif">
  <title id="study-svg-roofline-upgrade-comparison-title">Modeled ceilings for the same kernel</title>
  <desc id="study-svg-roofline-upgrade-comparison-desc">At the assumed intensity of 4 FLOP/byte, doubling bandwidth raises the roofline ceiling while doubling only the arithmetic peak leaves it unchanged. Baseline: 4 TFLOP/s. Double compute peak: 4 TFLOP/s. Double bandwidth: 8 TFLOP/s.</desc>
  <rect x="0" y="0" width="344" height="233" rx="8" fill="var(--surface, #fbf7f0)"/>
  <g fill="var(--fg, #31251d)" font-family="ui-monospace, monospace">
  <text x="328" y="22" font-size="13.5" text-anchor="end">TFLOP/s</text>
  <text x="16" y="43" font-size="15">Baseline</text>
  <text x="328" y="81" font-size="14" text-anchor="end">4</text>
  <rect x="16" y="51" width="312" height="12" rx="3" fill="var(--surface-2, #e7dbcb)"/>
  <rect x="16" y="51" width="156" height="12" rx="3" fill="var(--blog, #984720)"/>
  <line x1="16" x2="16" y1="50" y2="64" stroke="var(--fg, #4b3a2d)"/>
  <text x="16" y="109" font-size="15">Double compute peak</text>
  <text x="328" y="147" font-size="14" text-anchor="end">4</text>
  <rect x="16" y="117" width="312" height="12" rx="3" fill="var(--surface-2, #e7dbcb)"/>
  <rect x="16" y="117" width="156" height="12" rx="3" fill="var(--blog, #984720)"/>
  <line x1="16" x2="16" y1="116" y2="130" stroke="var(--fg, #4b3a2d)"/>
  <text x="16" y="175" font-size="15">Double bandwidth</text>
  <text x="328" y="213" font-size="14" text-anchor="end">8</text>
  <rect x="16" y="183" width="312" height="12" rx="3" fill="var(--surface-2, #e7dbcb)"/>
  <rect x="16" y="183" width="312" height="12" rx="3" fill="var(--blog, #984720)"/>
  <line x1="16" x2="16" y1="182" y2="196" stroke="var(--fg, #4b3a2d)"/>
  </g>
</svg>
