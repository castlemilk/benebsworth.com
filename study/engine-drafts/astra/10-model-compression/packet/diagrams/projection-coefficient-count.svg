<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 167" role="img" aria-labelledby="study-svg-projection-coefficient-count-title" aria-describedby="study-svg-projection-coefficient-count-desc" class="study-fig-fit" font-family="system-ui, sans-serif">
  <title id="study-svg-projection-coefficient-count-title">Coefficients in two candidate projections</title>
  <desc id="study-svg-projection-coefficient-count-desc">Under the assumed dimensions, rank 32 removes 20,480 coefficients. The count establishes a storage opportunity at equal precision and leaves execution time and task quality to measurement. Dense projection: 32768 coefficients. Rank-32 factors: 12288 coefficients.</desc>
  <rect x="0" y="0" width="344" height="167" rx="8" fill="var(--surface, #fbf7f0)"/>
  <g fill="var(--fg, #31251d)" font-family="ui-monospace, monospace">
  <text x="328" y="22" font-size="13.5" text-anchor="end">coefficients</text>
  <text x="16" y="43" font-size="15">Dense projection</text>
  <text x="328" y="81" font-size="14" text-anchor="end">32768</text>
  <rect x="16" y="51" width="312" height="12" rx="3" fill="var(--surface-2, #e7dbcb)"/>
  <rect x="16" y="51" width="312" height="12" rx="3" fill="var(--blog, #984720)"/>
  <line x1="16" x2="16" y1="50" y2="64" stroke="var(--fg, #4b3a2d)"/>
  <text x="16" y="109" font-size="15">Rank-32 factors</text>
  <text x="328" y="147" font-size="14" text-anchor="end">12288</text>
  <rect x="16" y="117" width="312" height="12" rx="3" fill="var(--surface-2, #e7dbcb)"/>
  <rect x="16" y="117" width="117" height="12" rx="3" fill="var(--blog, #984720)"/>
  <line x1="16" x2="16" y1="116" y2="130" stroke="var(--fg, #4b3a2d)"/>
  </g>
</svg>
