<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 431" role="img" aria-labelledby="study-svg-baseline-tile-storage-title" aria-describedby="study-svg-baseline-tile-storage-desc" class="study-fig-fit" font-family="system-ui, sans-serif">
  <title id="study-svg-baseline-tile-storage-title">Baseline tile storage</title>
  <desc id="study-svg-baseline-tile-storage-desc">The first four bars sum to 116 KiB. Comparing that total with the 96 KiB SRAM limit exposes a 20 KiB shortfall during the planned overlap. Input buffers: 48 KiB. Weight buffers: 32 KiB. Accumulator: 24 KiB. Workspace: 12 KiB. Baseline total: 116 KiB. SRAM limit: 96 KiB.</desc>
  <rect x="0" y="0" width="344" height="431" rx="8" fill="var(--surface, #fbf7f0)"/>
  <g fill="var(--fg, #31251d)" font-family="ui-monospace, monospace">
  <text x="328" y="22" font-size="13.5" text-anchor="end">KiB</text>
  <text x="16" y="43" font-size="15">Input buffers</text>
  <text x="328" y="81" font-size="14" text-anchor="end">48</text>
  <rect x="16" y="51" width="312" height="12" rx="3" fill="var(--surface-2, #e7dbcb)"/>
  <rect x="16" y="51" width="129" height="12" rx="3" fill="var(--blog, #984720)"/>
  <line x1="16" x2="16" y1="50" y2="64" stroke="var(--fg, #4b3a2d)"/>
  <text x="16" y="109" font-size="15">Weight buffers</text>
  <text x="328" y="147" font-size="14" text-anchor="end">32</text>
  <rect x="16" y="117" width="312" height="12" rx="3" fill="var(--surface-2, #e7dbcb)"/>
  <rect x="16" y="117" width="86" height="12" rx="3" fill="var(--blog, #984720)"/>
  <line x1="16" x2="16" y1="116" y2="130" stroke="var(--fg, #4b3a2d)"/>
  <text x="16" y="175" font-size="15">Accumulator</text>
  <text x="328" y="213" font-size="14" text-anchor="end">24</text>
  <rect x="16" y="183" width="312" height="12" rx="3" fill="var(--surface-2, #e7dbcb)"/>
  <rect x="16" y="183" width="65" height="12" rx="3" fill="var(--blog, #984720)"/>
  <line x1="16" x2="16" y1="182" y2="196" stroke="var(--fg, #4b3a2d)"/>
  <text x="16" y="241" font-size="15">Workspace</text>
  <text x="328" y="279" font-size="14" text-anchor="end">12</text>
  <rect x="16" y="249" width="312" height="12" rx="3" fill="var(--surface-2, #e7dbcb)"/>
  <rect x="16" y="249" width="32" height="12" rx="3" fill="var(--blog, #984720)"/>
  <line x1="16" x2="16" y1="248" y2="262" stroke="var(--fg, #4b3a2d)"/>
  <text x="16" y="307" font-size="15">Baseline total</text>
  <text x="328" y="345" font-size="14" text-anchor="end">116</text>
  <rect x="16" y="315" width="312" height="12" rx="3" fill="var(--surface-2, #e7dbcb)"/>
  <rect x="16" y="315" width="312" height="12" rx="3" fill="var(--blog, #984720)"/>
  <line x1="16" x2="16" y1="314" y2="328" stroke="var(--fg, #4b3a2d)"/>
  <text x="16" y="373" font-size="15">SRAM limit</text>
  <text x="328" y="411" font-size="14" text-anchor="end">96</text>
  <rect x="16" y="381" width="312" height="12" rx="3" fill="var(--surface-2, #e7dbcb)"/>
  <rect x="16" y="381" width="258" height="12" rx="3" fill="var(--blog, #984720)"/>
  <line x1="16" x2="16" y1="380" y2="394" stroke="var(--fg, #4b3a2d)"/>
  </g>
</svg>
