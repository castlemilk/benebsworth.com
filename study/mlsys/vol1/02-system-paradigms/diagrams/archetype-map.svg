<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <!-- Archetype map: two time terms vs two feasibility preconditions -->
  <defs>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- column headers -->
  <text x="200" y="52" text-anchor="middle" font-size="12" fill="#6b7280">enters the TIME equation</text>
  <text x="500" y="52" text-anchor="middle" font-size="12" fill="#6b7280">checked BEFORE time matters</text>
  <line x1="350" y1="62" x2="350" y2="300" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- left: iron-law terms -->
  <g>
    <rect x="90" y="70" width="220" height="100" rx="6" fill="#3b82f6" fill-opacity="0.14" stroke="#2563eb" stroke-width="1.4"/>
    <text x="200" y="92" text-anchor="middle" font-size="13" font-weight="600" fill="#2563eb">COMPUTE-BOUND</text>
    <text x="200" y="112" text-anchor="middle" font-size="11" fill="#374151">O / (R_peak · eta) dominates</text>
    <text x="200" y="130" text-anchor="middle" font-size="11" fill="#6b7280">high arithmetic intensity</text>
    <text x="200" y="152" text-anchor="middle" font-size="11" fill="#6b7280">lighthouse: ResNet-50 training</text>
  </g>
  <g>
    <rect x="90" y="190" width="220" height="100" rx="6" fill="#3b82f6" fill-opacity="0.14" stroke="#2563eb" stroke-width="1.4"/>
    <text x="200" y="212" text-anchor="middle" font-size="13" font-weight="600" fill="#2563eb">BANDWIDTH-BOUND</text>
    <text x="200" y="232" text-anchor="middle" font-size="11" fill="#374151">D_vol / BW dominates</text>
    <text x="200" y="250" text-anchor="middle" font-size="11" fill="#6b7280">weights streamed, little reuse</text>
    <text x="200" y="272" text-anchor="middle" font-size="11" fill="#6b7280">lighthouse: batch-1 LLM decode</text>
  </g>

  <!-- right: preconditions -->
  <g>
    <rect x="390" y="70" width="220" height="100" rx="6" fill="#f59e0b" fill-opacity="0.16" stroke="#b45309" stroke-width="1.4"/>
    <text x="500" y="92" text-anchor="middle" font-size="13" font-weight="600" fill="#b45309">CAPACITY-BOUND</text>
    <text x="500" y="112" text-anchor="middle" font-size="11" fill="#374151">doesn't fit memory</text>
    <text x="500" y="130" text-anchor="middle" font-size="11" fill="#6b7280">fails the screen, not the benchmark</text>
    <text x="500" y="152" text-anchor="middle" font-size="11" fill="#6b7280">lighthouse: DLRM embeddings</text>
  </g>
  <g>
    <rect x="390" y="190" width="220" height="100" rx="6" fill="#f59e0b" fill-opacity="0.16" stroke="#b45309" stroke-width="1.4"/>
    <text x="500" y="212" text-anchor="middle" font-size="13" font-weight="600" fill="#b45309">POWER-BOUND</text>
    <text x="500" y="232" text-anchor="middle" font-size="11" fill="#374151">can't afford to run it</text>
    <text x="500" y="250" text-anchor="middle" font-size="11" fill="#6b7280">energy budget closes first</text>
    <text x="500" y="272" text-anchor="middle" font-size="11" fill="#6b7280">lighthouse: keyword spotting</text>
  </g>

  <!-- regime arrow -->
  <path d="M90,320 C220,336 480,336 610,320" fill="none" stroke="#9ca3af" stroke-width="1" marker-end="url(#arrA)"/>
  <text x="350" y="312" text-anchor="middle" font-size="11" fill="#6b7280">archetype = workload x batch x precision x hardware: change any one, move the dot</text>
</svg>
