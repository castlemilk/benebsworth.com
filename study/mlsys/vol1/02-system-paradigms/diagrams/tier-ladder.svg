<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <style>
    .dark [fill="#1d4ed8"]{fill:#93c5fd}
    .dark [stroke="#1d4ed8"]{stroke:#93c5fd}
    .dark [fill="#2563eb"]{fill:#6aa8f8}
    .dark [stroke="#2563eb"]{stroke:#6aa8f8}
    .dark [fill="#3b82f6"]{fill:#7cb3f8}
    .dark [stroke="#3b82f6"]{stroke:#7cb3f8}
    .dark [fill="#6b7280"]{fill:#a4adba}
    .dark [stroke="#6b7280"]{stroke:#a4adba}
    .dark [fill="#92400e"]{fill:#fbbf24}
    .dark [stroke="#92400e"]{stroke:#fbbf24}
    .dark [fill="#9ca3af"]{fill:#c3cad4}
    .dark [stroke="#9ca3af"]{stroke:#c3cad4}
    .dark [fill="#b45309"]{fill:#fbbf24}
    .dark [stroke="#b45309"]{stroke:#fbbf24}
    .dark [fill="#f59e0b"]{fill:#fbbf24}
    .dark [stroke="#f59e0b"]{stroke:#fbbf24}
  </style>

  <!-- Tier ladder: four constraint regimes spanning ~9 orders of magnitude -->
  <line x1="90" y1="40" x2="90" y2="290" stroke="#9ca3af" stroke-width="1.2"/>
  <line x1="90" y1="290" x2="660" y2="290" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="370" y="318" text-anchor="middle" font-size="12" fill="#6b7280">power envelope (log scale) →</text>
  <text x="34" y="165" font-size="12" fill="#6b7280" transform="rotate(-90 34 165)" text-anchor="middle">on-site memory</text>

  <!-- grid labels on power axis -->
  <text x="120" y="306" text-anchor="middle" font-size="10.5" fill="#9ca3af">~1 mW</text>
  <text x="300" y="306" text-anchor="middle" font-size="10.5" fill="#9ca3af">~5 W</text>
  <text x="440" y="306" text-anchor="middle" font-size="10.5" fill="#9ca3af">~200 W</text>
  <text x="610" y="306" text-anchor="middle" font-size="10.5" fill="#9ca3af">~3 MW</text>

  <!-- tiers, left to right = rising power, higher = more memory -->
  <g>
    <!-- TinyML -->
    <rect x="110" y="240" width="105" height="30" rx="4" fill="#f59e0b" fill-opacity="0.18" stroke="#b45309" stroke-width="1.4"/>
    <text x="162" y="252" text-anchor="middle" font-size="12" font-weight="600" fill="#b45309">TinyML</text>
    <text x="162" y="265" text-anchor="middle" font-size="10" fill="#92400e">KB SRAM · duty cycled</text>
    <!-- Mobile -->
    <rect x="275" y="195" width="105" height="30" rx="4" fill="#f59e0b" fill-opacity="0.24" stroke="#b45309" stroke-width="1.4"/>
    <text x="327" y="207" text-anchor="middle" font-size="12" font-weight="600" fill="#b45309">Mobile</text>
    <text x="327" y="220" text-anchor="middle" font-size="10" fill="#92400e">GB · 2-5 W TDP</text>
    <!-- Edge -->
    <rect x="415" y="140" width="105" height="30" rx="4" fill="#3b82f6" fill-opacity="0.2" stroke="#2563eb" stroke-width="1.4"/>
    <text x="467" y="152" text-anchor="middle" font-size="12" font-weight="600" fill="#2563eb">Edge</text>
    <text x="467" y="165" text-anchor="middle" font-size="10" fill="#1d4ed8">1-8 GB · fixed site</text>
    <!-- Cloud -->
    <rect x="560" y="75" width="100" height="30" rx="4" fill="#3b82f6" fill-opacity="0.3" stroke="#2563eb" stroke-width="1.4"/>
    <text x="610" y="87" text-anchor="middle" font-size="12" font-weight="600" fill="#2563eb">Cloud</text>
    <text x="610" y="100" text-anchor="middle" font-size="10" fill="#1d4ed8">TB · elastic</text>
  </g>

  <!-- the wall that names each regime -->
  <g font-size="11" fill="#6b7280">
    <text x="162" y="228" text-anchor="middle">wall: capacity + energy</text>
    <text x="327" y="183" text-anchor="middle">wall: power (thermal)</text>
    <text x="467" y="128" text-anchor="middle">wall: light (remote is far)</text>
    <text x="610" y="62" text-anchor="middle">wall: memory (feeding it)</text>
  </g>

  <!-- spanning brace -->
  <path d="M120,272 L120,282 L655,282 L655,272" fill="none" stroke="#9ca3af" stroke-width="1"/>
  <text x="387" y="278" text-anchor="middle" font-size="10.5" fill="#6b7280">≈ 9 orders of magnitude: same iron law, different first wall</text>
</svg>
