<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <!-- Contract audit: defect at stage N walks back to the earliest boundary that never stated the condition -->
  <defs>
    <marker id="arrC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- stage chain -->
  <g font-size="10">
    <rect x="30" y="120" width="100" height="44" rx="5" fill="#dc2626" fill-opacity="0.12" stroke="#dc2626" stroke-width="1.6"/>
    <text x="80" y="138" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">1 · PROB DEF</text>
    <text x="80" y="152" text-anchor="middle" font-size="8" fill="#dc2626">500 MB never written</text>

    <rect x="150" y="120" width="100" height="44" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="200" y="138" text-anchor="middle" font-size="10" fill="#334155">2 · DATA</text>
    <text x="200" y="152" text-anchor="middle" font-size="8" fill="#6b7280">no mem req received</text>

    <rect x="270" y="120" width="100" height="44" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="320" y="138" text-anchor="middle" font-size="10" fill="#334155">3 · MODEL</text>
    <text x="320" y="152" text-anchor="middle" font-size="8" fill="#6b7280">no budget given</text>

    <rect x="390" y="120" width="100" height="44" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="440" y="138" text-anchor="middle" font-size="10" fill="#334155">4 · EVAL</text>
    <text x="440" y="152" text-anchor="middle" font-size="8" fill="#6b7280">checked sens only</text>

    <rect x="510" y="120" width="100" height="44" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="560" y="138" text-anchor="middle" font-size="10" fill="#334155">5 · DEPLOY</text>
    <text x="560" y="152" text-anchor="middle" font-size="8" fill="#6b7280">4 GB ≠ 500 MB</text>
  </g>

  <!-- forward contract checks -->
  <g>
    <line x1="130" y1="142" x2="146" y2="142" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrC)"/>
    <line x1="250" y1="142" x2="266" y2="142" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrC)"/>
    <line x1="370" y1="142" x2="386" y2="142" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrC)"/>
    <line x1="490" y1="142" x2="506" y2="142" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrC)"/>
    <text x="320" y="104" text-anchor="middle" font-size="10" fill="#2563eb">each arrow = contract check: input · output · quality invariant</text>
  </g>

  <!-- defect found at deploy -->
  <circle cx="560" cy="92" r="9" fill="#dc2626"/>
  <text x="560" y="96" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">!</text>
  <line x1="560" y1="101" x2="560" y2="116" stroke="#dc2626" stroke-width="1.4"/>

  <!-- audit walk-back: deploy → eval → model → data → prob-def -->
  <path d="M 540 190 C 460 232, 380 236, 340 200" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrW)"/>
  <path d="M 460 200 C 380 246, 260 252, 220 208" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrW)"/>
  <path d="M 280 208 C 220 258, 130 258, 92 210" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrW)"/>
  <text x="330" y="252" text-anchor="middle" font-size="10" fill="#dc2626">audit walks back: who should have stated it? — eval's contract met (sens measured), model got no budget, problem def never wrote it</text>
  <text x="330" y="268" text-anchor="middle" font-size="10" fill="#dc2626">→ fix starts at boundary 1, not where the defect surfaced</text>

  <!-- contract anatomy callout -->
  <g>
    <rect x="30" y="290" width="640" height="36" rx="6" fill="#3b82f6" fill-opacity="0.08" stroke="#2563eb" stroke-width="1"/>
    <text x="350" y="312" text-anchor="middle" font-size="10" fill="#1d4ed8">a contract = required inputs + output deliverables + quality invariant · the defect's owner = earliest boundary whose contract never stated the condition</text>
  </g>
</svg>
