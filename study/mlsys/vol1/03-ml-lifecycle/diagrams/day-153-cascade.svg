<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <!-- Day-153 cascade: 5 months of work, constraint arrives at deployment, rework propagates back -->
  <defs>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- timeline -->
  <line x1="60" y1="120" x2="660" y2="120" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrT)"/>
  <text x="60" y="104" font-size="11" fill="#6b7280">day 0</text>
  <text x="560" y="104" font-size="11" fill="#dc2626" font-weight="600">day 153 — DEPLOYMENT</text>
  <line x1="585" y1="112" x2="585" y2="128" stroke="#dc2626" stroke-width="2"/>

  <!-- accrued work bar -->
  <rect x="60" y="136" width="525" height="34" rx="4" fill="#3b82f6" fill-opacity="0.14" stroke="#2563eb" stroke-width="1.2"/>
  <text x="322" y="157" text-anchor="middle" font-size="11" fill="#1d4ed8">5 months of dependent decisions hardening: data curated · weights trained · sensitivity validated 92→94%</text>

  <!-- the constraint lands -->
  <g>
    <rect x="455" y="44" width="224" height="44" rx="6" fill="#dc2626" fill-opacity="0.12" stroke="#dc2626" stroke-width="1.4"/>
    <text x="567" y="62" text-anchor="middle" font-size="11" font-weight="600" fill="#dc2626">CONSTRAINT ARRIVES LATE</text>
    <text x="567" y="78" text-anchor="middle" font-size="10" fill="#991b1b">model needs 4 GB · device reserves ~500 MB</text>
  </g>
  <line x1="585" y1="88" x2="585" y2="112" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="4 3"/>

  <!-- rework arrows propagating back to each stage -->
  <path d="M 585 200 C 500 232, 380 236, 322 222" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrD)"/>
  <path d="M 585 214 C 460 258, 250 262, 172 246" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrD)"/>
  <path d="M 585 228 C 420 282, 180 288, 100 268" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrD)"/>
  <path d="M 585 240 C 560 276, 540 292, 502 284" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrD)"/>

  <!-- stage targets of rework -->
  <g>
    <rect x="40" y="238" width="122" height="40" rx="5" fill="#fff" stroke="#dc2626" stroke-width="1.2"/>
    <text x="101" y="255" text-anchor="middle" font-size="10" fill="#991b1b">1 · problem def</text>
    <text x="101" y="269" text-anchor="middle" font-size="9" fill="#6b7280">record the 500 MB</text>
  </g>
  <g>
    <rect x="172" y="216" width="122" height="40" rx="5" fill="#fff" stroke="#dc2626" stroke-width="1.2"/>
    <text x="233" y="233" text-anchor="middle" font-size="10" fill="#991b1b">2 · data</text>
    <text x="233" y="247" text-anchor="middle" font-size="9" fill="#6b7280">revise prep pipeline</text>
  </g>
  <g>
    <rect x="304" y="196" width="122" height="40" rx="5" fill="#fff" stroke="#dc2626" stroke-width="1.2"/>
    <text x="365" y="213" text-anchor="middle" font-size="10" fill="#991b1b">3 · model dev</text>
    <text x="365" y="227" text-anchor="middle" font-size="9" fill="#6b7280">retrain new weights</text>
  </g>
  <g>
    <rect x="436" y="256" width="122" height="40" rx="5" fill="#fff" stroke="#dc2626" stroke-width="1.2"/>
    <text x="497" y="273" text-anchor="middle" font-size="10" fill="#991b1b">4 · validation</text>
    <text x="497" y="287" text-anchor="middle" font-size="9" fill="#6b7280">repeat evidence run</text>
  </g>

  <text x="350" y="322" text-anchor="middle" font-size="10" fill="#9ca3af">rework = revise + repeat + re-validate every dependent artifact · the bill grows with distance travelled upstream</text>
</svg>
