<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <style>
    .dark [fill="#047857"]{fill:#34d399}
    .dark [stroke="#047857"]{stroke:#34d399}
    .dark [fill="#059669"]{fill:#34d399}
    .dark [stroke="#059669"]{stroke:#34d399}
    .dark [fill="#10b981"]{fill:#4ade80}
    .dark [stroke="#10b981"]{stroke:#4ade80}
    .dark [fill="#1d4ed8"]{fill:#93c5fd}
    .dark [stroke="#1d4ed8"]{stroke:#93c5fd}
    .dark [fill="#2563eb"]{fill:#6aa8f8}
    .dark [stroke="#2563eb"]{stroke:#6aa8f8}
    .dark [fill="#374151"]{fill:#e5e7eb}
    .dark [stroke="#374151"]{stroke:#e5e7eb}
    .dark [fill="#3b82f6"]{fill:#7cb3f8}
    .dark [stroke="#3b82f6"]{stroke:#7cb3f8}
    .dark [fill="#4b5563"]{fill:#d1d5db}
    .dark [stroke="#4b5563"]{stroke:#d1d5db}
    .dark [fill="#5b21b6"]{fill:#c4b5fd}
    .dark [stroke="#5b21b6"]{stroke:#c4b5fd}
    .dark [fill="#6b7280"]{fill:#a4adba}
    .dark [stroke="#6b7280"]{stroke:#a4adba}
    .dark [fill="#7c3aed"]{fill:#a78bfa}
    .dark [stroke="#7c3aed"]{stroke:#a78bfa}
    .dark [fill="#8b5cf6"]{fill:#a78bfa}
    .dark [stroke="#8b5cf6"]{stroke:#a78bfa}
    .dark [fill="#92400e"]{fill:#fbbf24}
    .dark [stroke="#92400e"]{stroke:#fbbf24}
    .dark [fill="#991b1b"]{fill:#f87171}
    .dark [stroke="#991b1b"]{stroke:#f87171}
    .dark [fill="#9ca3af"]{fill:#c3cad4}
    .dark [stroke="#9ca3af"]{stroke:#c3cad4}
    .dark [fill="#b91c1c"]{fill:#f87171}
    .dark [stroke="#b91c1c"]{stroke:#f87171}
    .dark [fill="#d97706"]{fill:#f59e0b}
    .dark [stroke="#d97706"]{stroke:#f59e0b}
    .dark [fill="#dc2626"]{fill:#f87171}
    .dark [stroke="#dc2626"]{stroke:#f87171}
    .dark [fill="#f59e0b"]{fill:#fbbf24}
    .dark [stroke="#f59e0b"]{stroke:#fbbf24}
  </style>

  <!-- Ingestion boundary: sync gate, DLQ, async statistical loop -->
  <defs>
    <marker id="arrI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="350" y="26" text-anchor="middle" font-size="13" font-weight="600" fill="#374151">Two clocks at the ingestion boundary</text>

  <!-- raw records -->
  <g>
    <rect x="30" y="70" width="110" height="52" rx="6" fill="#6b7280" fill-opacity="0.12" stroke="#4b5563" stroke-width="1.2"/>
    <text x="85" y="91" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">RAW RECORDS</text>
    <text x="85" y="106" text-anchor="middle" font-size="9" fill="#6b7280">batch + streaming</text>
  </g>
  <line x1="140" y1="96" x2="178" y2="96" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrI)"/>

  <!-- sync schema gate -->
  <g>
    <path d="M184,58 L250,96 L184,134 Z" fill="#f59e0b" fill-opacity="0.16" stroke="#d97706" stroke-width="1.4"/>
    <text x="208" y="92" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">SYNC</text>
    <text x="208" y="105" text-anchor="middle" font-size="9" fill="#92400e">schema gate</text>
  </g>
  <text x="206" y="150" text-anchor="middle" font-size="9" fill="#6b7280">type · range · presence</text>
  <text x="206" y="162" text-anchor="middle" font-size="9" fill="#6b7280">(runs on every record)</text>

  <!-- DLQ path (reject) -->
  <path d="M208,134 C208,190 170,210 150,214" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrD)"/>
  <g>
    <rect x="30" y="214" width="130" height="52" rx="6" fill="#dc2626" fill-opacity="0.12" stroke="#dc2626" stroke-width="1.2"/>
    <text x="95" y="234" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">DEAD-LETTER Q</text>
    <text x="95" y="250" text-anchor="middle" font-size="9" fill="#6b7280">fail after retries+backoff</text>
  </g>
  <text x="95" y="284" text-anchor="middle" font-size="9" fill="#b91c1c">review → diagnoses upstream</text>
  <text x="95" y="296" text-anchor="middle" font-size="9" fill="#b91c1c">changes + coverage gaps</text>

  <!-- accepted store -->
  <line x1="250" y1="96" x2="296" y2="96" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrI)"/>
  <g>
    <rect x="300" y="70" width="130" height="52" rx="6" fill="#3b82f6" fill-opacity="0.12" stroke="#2563eb" stroke-width="1.2"/>
    <text x="365" y="91" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">ACCEPTED DATA</text>
    <text x="365" y="106" text-anchor="middle" font-size="9" fill="#6b7280">immutable raw + versions</text>
  </g>
  <line x1="430" y1="96" x2="476" y2="96" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrI)"/>
  <g>
    <rect x="480" y="70" width="120" height="52" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#059669" stroke-width="1.2"/>
    <text x="540" y="91" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">DOWNSTREAM</text>
    <text x="540" y="106" text-anchor="middle" font-size="9" fill="#6b7280">features · training</text>
  </g>

  <!-- async statistical loop -->
  <rect x="300" y="200" width="370" height="96" rx="8" fill="#8b5cf6" fill-opacity="0.07" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="485" y="222" text-anchor="middle" font-size="11" font-weight="600" fill="#5b21b6">ASYNC STATISTICAL CHECKS — off the hot path, over windows</text>
  <g font-size="10.5" fill="#374151">
    <text x="322" y="248">· PSI / KL on binned features vs baseline</text>
    <text x="322" y="268">· K-S test on continuous univariates</text>
    <text x="322" y="288">· parity replay: serving inputs through both pipelines</text>
  </g>
  <path d="M365,122 C365,160 365,170 365,196" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrI)"/>
  <path d="M600,248 C650,248 660,200 640,150 C628,120 610,108 602,104" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrI)"/>
  <text x="648" y="200" text-anchor="middle" font-size="9" fill="#5b21b6">alerts = prompts</text>
  <text x="648" y="212" text-anchor="middle" font-size="9" fill="#5b21b6">to investigate,</text>
  <text x="648" y="224" text-anchor="middle" font-size="9" fill="#5b21b6">not proof</text>

  <!-- failure machinery footer -->
  <rect x="30" y="316" width="640" height="30" rx="6" fill="#6b7280" fill-opacity="0.08" stroke="#9ca3af" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="350" y="327" text-anchor="middle" font-size="10" fill="#4b5563">degrade gracefully: retries+backoff · DLQ · circuit breaker</text>
  <text x="350" y="339" text-anchor="middle" font-size="10" fill="#4b5563">+ validated fallback · the checks themselves are versioned code</text>
</svg>
