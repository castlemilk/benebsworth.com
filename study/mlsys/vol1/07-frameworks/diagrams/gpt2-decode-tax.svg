<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <style>
    .dark [fill="#047857"]{fill:#34d399}
    .dark [stroke="#047857"]{stroke:#34d399}
    .dark [fill="#1d4ed8"]{fill:#93c5fd}
    .dark [stroke="#1d4ed8"]{stroke:#93c5fd}
    .dark [fill="#2563eb"]{fill:#6aa8f8}
    .dark [stroke="#2563eb"]{stroke:#6aa8f8}
    .dark [fill="#374151"]{fill:#e5e7eb}
    .dark [stroke="#374151"]{stroke:#e5e7eb}
    .dark [fill="#4b5563"]{fill:#d1d5db}
    .dark [stroke="#4b5563"]{stroke:#d1d5db}
    .dark [fill="#6b7280"]{fill:#a4adba}
    .dark [stroke="#6b7280"]{stroke:#a4adba}
    .dark [fill="#92400e"]{fill:#fbbf24}
    .dark [stroke="#92400e"]{stroke:#fbbf24}
    .dark [fill="#9ca3af"]{fill:#c3cad4}
    .dark [stroke="#9ca3af"]{stroke:#c3cad4}
    .dark [fill="#b91c1c"]{fill:#f87171}
    .dark [stroke="#b91c1c"]{stroke:#f87171}
    .dark [fill="#d97706"]{fill:#f59e0b}
    .dark [stroke="#d97706"]{stroke:#f59e0b}
    .dark [fill="#dbeafe"]{fill:#1e3a5f}
    .dark [fill="#e5e7eb"]{fill:#374151}
    .dark [fill="#fef3c7"]{fill:#453007}
    .dark [fill="#fee2e2"]{fill:#4c1d1d}
    .dark [fill="#f3f4f6"]{fill:#1f2937}
    .dark [fill="#ffffff"]{fill:#161a22}
    .dark rect.bg{fill:#0f1115}
    .dark [fill="none"]{fill:none}
  </style>
  <rect x="0" y="0" width="700" height="400" fill="#ffffff" class="bg"/>
  <text x="350" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#374151">One GPT-2 XL decode step, three clockings</text>
  <text x="350" y="44" text-anchor="middle" font-size="10" fill="#6b7280">batch one, FP16, H100 -- the model owes 0.9 ms; the host owes 8.6 ms</text>

  <!-- scale: 1 ms = 55 px, origin x=210 -->
  <g font-size="9" fill="#9ca3af">
    <line x1="210" y1="300" x2="210" y2="306" stroke="#9ca3af"/><text x="210" y="318" text-anchor="middle">0 ms</text>
    <line x1="265" y1="300" x2="265" y2="306" stroke="#9ca3af"/><text x="265" y="318" text-anchor="middle">1</text>
    <line x1="320" y1="300" x2="320" y2="306" stroke="#9ca3af"/><text x="320" y="318" text-anchor="middle">2</text>
    <line x1="375" y1="300" x2="375" y2="306" stroke="#9ca3af"/><text x="375" y="318" text-anchor="middle">3</text>
    <line x1="430" y1="300" x2="430" y2="306" stroke="#9ca3af"/><text x="430" y="318" text-anchor="middle">4</text>
    <line x1="485" y1="300" x2="485" y2="306" stroke="#9ca3af"/><text x="485" y="318" text-anchor="middle">5</text>
    <line x1="540" y1="300" x2="540" y2="306" stroke="#9ca3af"/><text x="540" y="318" text-anchor="middle">6</text>
    <line x1="595" y1="300" x2="595" y2="306" stroke="#9ca3af"/><text x="595" y="318" text-anchor="middle">7</text>
    <line x1="650" y1="300" x2="650" y2="306" stroke="#9ca3af"/><text x="650" y="318" text-anchor="middle">8</text>
  </g>

  <!-- BAR 1: device weight read 0.9 ms -->
  <text x="200" y="106" text-anchor="end" font-size="11" font-weight="bold" fill="#374151">device: weight read</text>
  <text x="200" y="120" text-anchor="end" font-size="8" fill="#6b7280">3 GB FP16 at 3.35 TB/s</text>
  <rect x="210" y="96" width="49.5" height="34" rx="4" fill="#047857"/>
  <text x="270" y="117" font-size="10" font-weight="bold" fill="#047857">~0.9 ms -- the floor</text>

  <!-- BAR 2: launches only 2.9 ms -->
  <text x="200" y="166" text-anchor="end" font-size="11" font-weight="bold" fill="#374151">host: launches only</text>
  <text x="200" y="180" text-anchor="end" font-size="8" fill="#6b7280">576 kernels x ~5 us driver</text>
  <rect x="210" y="156" width="159.5" height="34" rx="4" fill="#d97706"/>
  <text x="380" y="177" font-size="10" font-weight="bold" fill="#92400e">~2.9 ms = 3.2x the read</text>

  <!-- BAR 3: eager host issue 8.6 ms -->
  <text x="200" y="226" text-anchor="end" font-size="11" font-weight="bold" fill="#374151">host: full eager issue</text>
  <text x="200" y="240" text-anchor="end" font-size="8" fill="#6b7280">+ ~10 us python dispatch/op</text>
  <rect x="210" y="216" width="473" height="34" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <rect x="210" y="216" width="49.5" height="34" rx="4" fill="#047857" opacity="0.85"/>
  <text x="270" y="237" font-size="10" font-weight="bold" fill="#b91c1c">~8.6 ms = ~10x the device work -- the accelerator waits on Python</text>

  <!-- annotation -->
  <line x1="259.5" y1="250" x2="259.5" y2="282" stroke="#047857" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="265" y="290" font-size="9" fill="#047857">device portion of the same step</text>

  <text x="350" y="344" text-anchor="middle" font-size="9" fill="#6b7280">12 kernels/block x 48 blocks = 576 launches per token -- each ~15 us of combined host cost</text>
  <text x="350" y="372" text-anchor="middle" font-size="10" font-weight="bold" fill="#374151">the gap between bar 1 and bar 3 is the framework's latency contribution, not the model's</text>
</svg>
