<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <style>
    .dark [fill="#047857"]{fill:#34d399}
    .dark [stroke="#047857"]{stroke:#34d399}
    .dark [fill="#1d4ed8"]{fill:#93c5fd}
    .dark [stroke="#1d4ed8"]{stroke:#93c5fd}
    .dark [fill="#2563eb"]{fill:#6aa8f8}
    .dark [stroke="#2563eb"]{stroke:#6aa8f8}
    .dark [fill="#374151"]{fill:#e5e7eb}
    .dark [stroke="#374151"]{stroke:#e5e7eb}
    .dark [fill="#4b5563"]{fill:#d1d5db}
    .dark [stroke="#4b5563"]{stroke:#d1d5db}
    .dark [fill="#6b7280"]{fill:#a4adba}
    .dark [stroke="#6b7280"]{stroke:#a4adba}
    .dark [fill="#92400e"]{fill:#fbbf24}
    .dark [stroke="#92400e"]{stroke:#fbbf24}
    .dark [fill="#9ca3af"]{fill:#c3cad4}
    .dark [stroke="#9ca3af"]{stroke:#c3cad4}
    .dark [fill="#b91c1c"]{fill:#f87171}
    .dark [stroke="#b91c1c"]{stroke:#f87171}
    .dark [fill="#d97706"]{fill:#f59e0b}
    .dark [stroke="#d97706"]{stroke:#f59e0b}
    .dark [fill="#dbeafe"]{fill:#1e3a5f}
    .dark [fill="#e5e7eb"]{fill:#374151}
    .dark [fill="#fef3c7"]{fill:#453007}
    .dark [fill="#fee2e2"]{fill:#4c1d1d}
    .dark [fill="#f3f4f6"]{fill:#1f2937}
    .dark [fill="#ffffff"]{fill:#161a22}
    .dark rect.bg{fill:#0f1115}
    .dark [fill="none"]{fill:none}
  </style>
  <rect x="0" y="0" width="700" height="430" fill="#ffffff" class="bg"/>
  <text x="350" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#374151">The tape: saved state piles up forward, unwinds backward</text>
  <text x="350" y="44" text-anchor="middle" font-size="10" fill="#6b7280">every backward rule reads the forward values it recorded -- the peak sits exactly at the boundary</text>

  <!-- phase bands -->
  <rect x="40" y="66" width="310" height="290" rx="8" fill="#dbeafe" opacity="0.45"/>
  <rect x="350" y="66" width="310" height="290" rx="8" fill="#fef3c7" opacity="0.5"/>
  <text x="195" y="86" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">FORWARD -- record</text>
  <text x="505" y="86" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">BACKWARD -- replay + free</text>

  <!-- memory axis -->
  <line x1="60" y1="330" x2="60" y2="110" stroke="#9ca3af" stroke-width="1"/>
  <polygon points="60,106 56,114 64,114" fill="#9ca3af"/>
  <text x="52" y="220" font-size="9" fill="#6b7280" transform="rotate(-90 52 220)" text-anchor="middle">saved bytes</text>

  <!-- forward towers: growing stack -->
  <g>
    <rect x="90"  y="282" width="34" height="48" fill="#2563eb" opacity="0.9" rx="2"/>
    <rect x="136" y="258" width="34" height="72" fill="#2563eb" opacity="0.9" rx="2"/>
    <rect x="182" y="234" width="34" height="96" fill="#2563eb" opacity="0.9" rx="2"/>
    <rect x="228" y="198" width="34" height="132" fill="#2563eb" opacity="0.9" rx="2"/>
    <rect x="274" y="162" width="34" height="168" fill="#2563eb" opacity="0.9" rx="2"/>
    <rect x="320" y="126" width="34" height="204" fill="#2563eb" rx="2"/>
  </g>
  <g font-size="8" fill="#374151" text-anchor="middle">
    <text x="107" y="298">L1</text>
    <text x="153" y="274">L2</text>
    <text x="199" y="250">L3</text>
    <text x="245" y="214">L4</text>
    <text x="291" y="178">...</text>
    <text x="337" y="142">Ln</text>
  </g>
  <!-- cumulative outline: peak -->
  <polyline points="90,282 136,258 182,234 228,198 274,162 320,126" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="337" cy="126" r="4" fill="#b91c1c"/>
  <text x="337" y="112" text-anchor="middle" font-size="9" font-weight="bold" fill="#b91c1c">PEAK: start of backward</text>
  <text x="195" y="344" text-anchor="middle" font-size="8" fill="#6b7280">backward rules pin forward tensors until reached</text>

  <!-- backward towers: shrinking, with freed ghost outlines -->
  <g>
    <rect x="390" y="162" width="34" height="168" fill="#d97706" opacity="0.85" rx="2"/>
    <rect x="390" y="126" width="34" height="36" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="436" y="198" width="34" height="132" fill="#d97706" opacity="0.85" rx="2"/>
    <rect x="436" y="126" width="34" height="72" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="482" y="234" width="34" height="96" fill="#d97706" opacity="0.85" rx="2"/>
    <rect x="482" y="126" width="34" height="108" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="528" y="282" width="34" height="48" fill="#d97706" opacity="0.85" rx="2"/>
    <rect x="528" y="126" width="34" height="156" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="598" y="318" width="34" height="12" fill="#d97706" opacity="0.6" rx="2"/>
    <rect x="598" y="126" width="34" height="192" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 2"/>
  </g>
  <g font-size="8" fill="#92400e" text-anchor="middle">
    <text x="407" y="178">grad Ln</text>
    <text x="453" y="214">grad L4</text>
    <text x="499" y="250">grad L3</text>
    <text x="545" y="298">grad L2</text>
    <text x="615" y="312">grad L1</text>
  </g>
  <text x="505" y="344" text-anchor="middle" font-size="8" fill="#6b7280">dashed = freed as the sweep unwinds</text>

  <!-- divider at boundary -->
  <line x1="368" y1="100" x2="368" y2="332" stroke="#b91c1c" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="368" y="366" text-anchor="middle" font-size="8" fill="#b91c1c">backward() called</text>

  <!-- checkpointing note -->
  <rect x="120" y="380" width="460" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="350" y="394" text-anchor="middle" font-size="9" fill="#374151">checkpointing: record the segment boundary, not its tensors -- recompute the towers during backward</text>
  <text x="350" y="407" text-anchor="middle" font-size="8" fill="#6b7280">a second forward's compute in exchange for a live peak up to ~64x smaller</text>
</svg>
