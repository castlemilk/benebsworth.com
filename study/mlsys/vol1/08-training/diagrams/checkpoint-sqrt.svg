  <rect class="bg" x="0" y="0" width="700" height="400" fill="#ffffff"/>

  <text x="350" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#374151">sqrt(L) anchors, recompute the rest</text>
  <text x="350" y="44" text-anchor="middle" font-size="10" fill="#6b7280">48 layers, 7 segment boundaries retained -- interiors re-run during backward</text>

  <!-- forward pass: 48-layer strip, checkpoint cells filled -->
  <text x="60" y="86" font-size="10" font-weight="bold" fill="#374151">forward</text>
  <!-- 48 cells of 11px starting x=130 -->
  <g>
    <rect x="130" y="92" width="11" height="20" fill="#2563eb"/>
    <rect x="141" y="92" width="11" height="20" fill="#f3f4f6" stroke="#9ca3af"/>
    <rect x="152" y="92" width="11" height="20" fill="#f3f4f6" stroke="#9ca3af"/>
    <rect x="163" y="92" width="11" height="20" fill="#f3f4f6" stroke="#9ca3af"/>
    <rect x="174" y="92" width="11" height="20" fill="#f3f4f6" stroke="#9ca3af"/>
    <rect x="185" y="92" width="11" height="20" fill="#f3f4f6" stroke="#9ca3af"/>
    <rect x="196" y="92" width="11" height="20" fill="#f3f4f6" stroke="#9ca3af"/>
    <rect x="207" y="92" width="11" height="20" fill="#2563eb"/>
