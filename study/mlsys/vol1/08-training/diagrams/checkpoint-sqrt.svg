  <text x="130" y="80" font-size="9" fill="#1d4ed8">store</text>
  <text x="669" y="80" text-anchor="end" font-size="9" fill="#1d4ed8">7 anchors = sqrt(48)</text>

  <!-- backward: recompute brackets per segment -->
  <text x="60" y="160" font-size="10" font-weight="bold" fill="#374151">backward</text>
  <path d="M 652 130 L 147 130" stroke="#b91c1c" stroke-width="1.5" fill="none" marker-end="url(#arrL)"/>
  <defs><marker id="arrL" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#b91c1c"/></marker></defs>
  <!-- segment brackets -->
  <path d="M 592 146 L 592 152 L 658 152 L 658 146" stroke="#d97706" stroke-width="1" fill="none"/>
  <text x="625" y="166" text-anchor="middle" font-size="8" fill="#d97706">re-run 7 layers</text>
  <path d="M 438 146 L 438 152 L 581 152 L 581 146" stroke="#d97706" stroke-width="1" stroke-dasharray="3 3" fill="none"/>
  <text x="510" y="166" text-anchor="middle" font-size="8" fill="#d97706">one segment re-run per boundary</text>

  <!-- comparison columns -->
  <text x="170" y="216" text-anchor="middle" font-size="10" font-weight="bold" fill="#374151">no checkpointing</text>
  <rect x="120" y="228" width="100" height="110" fill="#bfdbfe" stroke="#2563eb"/>
  <text x="170" y="286" text-anchor="middle" font-size="10" fill="#1d4ed8">all 48 layers</text>
  <text x="170" y="300" text-anchor="middle" font-size="10" fill="#1d4ed8">stored</text>
  <text x="170" y="356" text-anchor="middle" font-size="9" fill="#6b7280">O(L) activations</text>

  <text x="340" y="216" text-anchor="middle" font-size="10" font-weight="bold" fill="#374151">k = sqrt(L) = 7</text>
  <rect x="300" y="305" width="80" height="33" fill="#d1fae5" stroke="#047857"/>
  <text x="340" y="325" text-anchor="middle" font-size="10" fill="#047857">~14 layers'</text>
  <text x="340" y="356" text-anchor="middle" font-size="9" fill="#6b7280">anchors + one live segment</text>

  <!-- arrow between -->
  <path d="M 235 283 L 285 283" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#arrR)"/>
  <defs><marker id="arrR" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#374151"/></marker></defs>
  <text x="260" y="274" text-anchor="middle" font-size="8" fill="#374151">~71% saved</text>

  <!-- cost note -->
  <text x="480" y="240" font-size="10" font-weight="bold" fill="#b91c1c">the price</text>
  <text x="480" y="258" font-size="9" fill="#4b5563">each re-run segment adds its</text>
  <text x="480" y="270" font-size="9" fill="#4b5563">forward work back: ~+33% step</text>
  <text x="480" y="282" font-size="9" fill="#4b5563">arithmetic for the 7-segment</text>
  <text x="480" y="294" font-size="9" fill="#4b5563">schedule. Compute for memory,</text>
  <text x="480" y="306" font-size="9" fill="#4b5563">priced openly.</text>

  <text x="350" y="390" text-anchor="middle" font-size="9" fill="#6b7280">M_act = kA + (L/k)A -- minimized when boundaries and segments balance at k = sqrt(L)</text>
</svg>
