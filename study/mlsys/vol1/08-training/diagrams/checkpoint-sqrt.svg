    <rect x="339" y="92" width="11" height="20" fill="#f3f4f6" stroke="#9ca3af"/>
    <rect x="350" y="92" width="11" height="20" fill="#f3f4f6" stroke="#9ca3af"/>
    <rect x="361" y="92" width="11" height="20" fill="#2563eb"/>
