<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <style>
    .dark [fill="#047857"]{fill:#34d399}
    .dark [stroke="#047857"]{stroke:#34d399}
    .dark [fill="#1d4ed8"]{fill:#93c5fd}
    .dark [stroke="#1d4ed8"]{stroke:#93c5fd}
    .dark [fill="#2563eb"]{fill:#6aa8f8}
    .dark [stroke="#2563eb"]{stroke:#6aa8f8}
    .dark [fill="#374151"]{fill:#e5e7eb}
    .dark [stroke="#374151"]{stroke:#e5e7eb}
    .dark [fill="#4b5563"]{fill:#d1d5db}
    .dark [stroke="#4b5563"]{stroke:#d1d5db}
    .dark [fill="#6b7280"]{fill:#a4adba}
    .dark [stroke="#6b7280"]{stroke:#a4adba}
    .dark [fill="#92400e"]{fill:#fbbf24}
    .dark [stroke="#92400e"]{stroke:#fbbf24}
    .dark [fill="#9ca3af"]{fill:#c3cad4}
    .dark [stroke="#9ca3af"]{stroke:#c3cad4}
    .dark [fill="#b91c1c"]{fill:#f87171}
    .dark [stroke="#b91c1c"]{stroke:#f87171}
    .dark [fill="#d97706"]{fill:#f59e0b}
    .dark [stroke="#d97706"]{stroke:#f59e0b}
    .dark [fill="#bfdbfe"]{fill:#1e3a5f}
    .dark [fill="#dbeafe"]{fill:#1e3a5f}
    .dark [fill="#e5e7eb"]{fill:#374151}
    .dark [fill="#fef3c7"]{fill:#453007}
    .dark [fill="#fee2e2"]{fill:#4c1d1d}
    .dark [fill="#f3f4f6"]{fill:#1f2937}
    .dark [fill="#ffffff"]{fill:#161a22}
    .dark rect.bg{fill:#0f1115}
    .dark [fill="none"]{fill:none}
  </style>
  <rect class="bg" x="0" y="0" width="700" height="430" fill="#ffffff"/>

  <text x="350" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#374151">The staircase into one H100 -- GPT-2 XL, batch 32</text>
  <text x="350" y="44" text-anchor="middle" font-size="10" fill="#6b7280">resident state per step: static floor never moves, activations carry the descent</text>

  <!-- GB axis -->
  <line x1="60" y1="380" x2="660" y2="380" stroke="#9ca3af" stroke-width="1"/>
  <text x="60" y="398" font-size="9" fill="#6b7280">0</text>
  <text x="60" y="52" font-size="9" fill="#6b7280">600 GB</text>
  <line x1="60" y1="56" x2="660" y2="56" stroke="#f3f4f6" stroke-width="1"/>
  <line x1="60" y1="218" x2="660" y2="218" stroke="#f3f4f6" stroke-width="1"/>
  <text x="60" y="214" font-size="9" fill="#6b7280">300</text>

  <!-- capacity line: 80 GB at y = 380 - 40 = 340 -->
  <line x1="60" y1="340" x2="660" y2="340" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="656" y="334" text-anchor="end" font-size="10" font-weight="bold" fill="#b91c1c">capacity 80 GB</text>

  <!-- static floor: 24 GB tall (12px) across all bars -->
  <!-- bar 1: FP32, total 598 = 299px, act 574 = 287px -->
  <rect x="90" y="81" width="110" height="287" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
  <rect x="90" y="368" width="110" height="12" fill="#2563eb"/>
  <text x="145" y="72" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">598 GB</text>
  <text x="145" y="412" text-anchor="middle" font-size="9" fill="#4b5563">FP32</text>
  <text x="145" y="422" text-anchor="middle" font-size="9" fill="#4b5563">baseline</text>

  <!-- bar 2: +mixed precision, 311 GB = 155.5px, act 287 = 143.5 -->
  <rect x="240" y="224.5" width="110" height="143.5" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
  <rect x="240" y="368" width="110" height="12" fill="#2563eb"/>
  <text x="295" y="216" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">311 GB</text>
  <text x="295" y="412" text-anchor="middle" font-size="9" fill="#4b5563">+ mixed</text>
  <text x="295" y="422" text-anchor="middle" font-size="9" fill="#4b5563">precision</text>

  <!-- bar 3: +FlashAttention, 109.6 GB = 54.8px, act 85.6 = 42.8 -->
  <rect x="390" y="325.2" width="110" height="42.8" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
  <rect x="390" y="368" width="110" height="12" fill="#2563eb"/>
  <text x="445" y="317" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">109.6 GB</text>
  <text x="445" y="412" text-anchor="middle" font-size="9" fill="#4b5563">+ Flash-</text>
  <text x="445" y="422" text-anchor="middle" font-size="9" fill="#4b5563">Attention</text>

  <!-- bar 4: +accumulate 2x16, 66.8 GB = 33.4px, act 42.8 = 21.4 -->
  <rect x="540" y="346.6" width="110" height="21.4" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <rect x="540" y="368" width="110" height="12" fill="#2563eb"/>
  <text x="595" y="338" text-anchor="middle" font-size="11" font-weight="bold" fill="#047857">66.8 GB</text>
  <text x="595" y="412" text-anchor="middle" font-size="9" fill="#047857">+ accumulate</text>
  <text x="595" y="422" text-anchor="middle" font-size="9" fill="#047857">2 x 16</text>

  <!-- removed-slice annotations in the inter-bar gaps -->
  <text x="206" y="180" text-anchor="middle" font-size="9" fill="#92400e" transform="rotate(-90 206 180)">x 1/2 activations</text>
  <text x="356" y="270" text-anchor="middle" font-size="9" fill="#92400e" transform="rotate(-90 356 270)">-201 GB scores</text>
  <text x="506" y="352" text-anchor="middle" font-size="9" fill="#92400e" transform="rotate(-90 506 352)">x 1/2 batch</text>

  <!-- legend -->
  <rect x="70" y="64" width="10" height="10" fill="#2563eb"/>
  <text x="84" y="72" font-size="9" fill="#4b5563">static state (24 GB, 16 B/param)</text>
  <rect x="70" y="80" width="10" height="10" fill="#bfdbfe" stroke="#2563eb"/>
  <text x="84" y="88" font-size="9" fill="#4b5563">saved activations</text>

  <!-- checkpoint alternative -->
  <path d="M 240 356 L 540 356" stroke="#d97706" stroke-width="1" stroke-dasharray="3 3" fill="none"/>
  <text x="390" y="60" text-anchor="middle" font-size="9" fill="#d97706">alternative: segment checkpointing fits all 32 in ~35.5 GB -- pays +33% arithmetic</text>
</svg>
