<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <style>
    .dark [fill="#047857"]{fill:#34d399}
    .dark [stroke="#047857"]{stroke:#34d399}
    .dark [fill="#1d4ed8"]{fill:#93c5fd}
    .dark [stroke="#1d4ed8"]{stroke:#93c5fd}
    .dark [fill="#2563eb"]{fill:#6aa8f8}
    .dark [stroke="#2563eb"]{stroke:#6aa8f8}
    .dark [fill="#374151"]{fill:#e5e7eb}
    .dark [stroke="#374151"]{stroke:#e5e7eb}
    .dark [fill="#4b5563"]{fill:#d1d5db}
    .dark [stroke="#4b5563"]{stroke:#d1d5db}
    .dark [fill="#6b7280"]{fill:#a4adba}
    .dark [stroke="#6b7280"]{stroke:#a4adba}
    .dark [fill="#92400e"]{fill:#fbbf24}
    .dark [stroke="#92400e"]{stroke:#fbbf24}
    .dark [fill="#9ca3af"]{fill:#c3cad4}
    .dark [stroke="#9ca3af"]{stroke:#c3cad4}
    .dark [fill="#b91c1c"]{fill:#f87171}
    .dark [stroke="#b91c1c"]{stroke:#f87171}
    .dark [fill="#d97706"]{fill:#f59e0b}
    .dark [stroke="#d97706"]{stroke:#f59e0b}
    .dark [fill="#bfdbfe"]{fill:#1e3a5f}
    .dark [fill="#dbeafe"]{fill:#1e3a5f}
    .dark [fill="#d1fae5"]{fill:#123a2b}
    .dark [fill="#fef3c7"]{fill:#453007}
    .dark [fill="#fee2e2"]{fill:#451a1a}
    .dark [fill="#f3f4f6"]{fill:#1f2937}
    .dark [fill="#ffffff"]{fill:#161a22}
    .dark rect.bg{fill:#0f1115}
    .dark [fill="none"]{fill:none}
  </style>
  <rect class="bg" x="0" y="0" width="700" height="380" fill="#ffffff"/>

  <text x="28" y="38" font-size="16" fill="#374151" font-weight="600">floors constrain the ranking — budget 3, floor 1 per class</text>
  <text x="28" y="60" font-size="11" fill="#6b7280">score alone takes the top three; floors force the rare class in</text>

  <!-- score-ranked pool -->
  <text x="60" y="100" font-size="11" fill="#4b5563" font-weight="600">score-ranked pool</text>
  <g font-size="10" fill="#374151" text-anchor="middle">
    <rect x="40" y="112" width="52" height="44" fill="#dbeafe" stroke="#2563eb"/><text x="66" y="132">A 0.97</text><text x="66" y="146" fill="#6b7280">class &#9632;</text>
    <rect x="100" y="112" width="52" height="44" fill="#dbeafe" stroke="#2563eb"/><text x="126" y="132">B 0.91</text><text x="126" y="146" fill="#6b7280">class &#9632;</text>
    <rect x="160" y="112" width="52" height="44" fill="#dbeafe" stroke="#2563eb"/><text x="186" y="132">C 0.88</text><text x="186" y="146" fill="#6b7280">class &#9632;</text>
    <rect x="220" y="112" width="52" height="44" fill="#f3f4f6" stroke="#9ca3af"/><text x="246" y="132">D 0.84</text><text x="246" y="146" fill="#6b7280">class &#9632;</text>
    <rect x="280" y="112" width="52" height="44" fill="#f3f4f6" stroke="#9ca3af"/><text x="306" y="132">E 0.80</text><text x="306" y="146" fill="#6b7280">class &#9632;</text>
    <rect x="340" y="112" width="52" height="44" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="366" y="132">F 0.41</text><text x="366" y="146" fill="#92400e">rare &#9679;</text>
  </g>
  <text x="366" y="176" font-size="9" fill="#92400e" text-anchor="middle">lowest score, only rare-class member</text>

  <!-- arrow -->
  <path d="M430 134 L470 134" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <defs><marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#4b5563"/></marker></defs>

  <!-- resulting subset -->
  <text x="486" y="100" font-size="11" fill="#4b5563" font-weight="600">kept subset — 3 slots</text>
  <g font-size="10" fill="#374151" text-anchor="middle">
    <rect x="486" y="112" width="52" height="44" fill="#dbeafe" stroke="#2563eb"/><text x="512" y="132">A 0.97</text><text x="512" y="146" fill="#6b7280">&#9632;</text>
    <rect x="546" y="112" width="52" height="44" fill="#dbeafe" stroke="#2563eb"/><text x="572" y="132">B 0.91</text><text x="572" y="146" fill="#6b7280">&#9632;</text>
    <rect x="606" y="112" width="52" height="44" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="632" y="132">F 0.41</text><text x="632" y="146" fill="#92400e">floor</text>
  </g>
  <text x="632" y="176" font-size="9" fill="#b91c1c" text-anchor="middle">C displaced</text>

  <!-- the accounting -->
  <rect x="40" y="212" width="620" height="118" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="60" y="240" font-size="12" fill="#374151" font-weight="600">the accounting</text>
  <text x="60" y="264" font-size="11" fill="#4b5563">&#8226; floor is spent FIRST — F lands before any score is spent</text>
  <text x="60" y="286" font-size="11" fill="#4b5563">&#8226; remaining budget 2 buys the top-ranked common slice (A, B)</text>
  <text x="60" y="308" font-size="11" fill="#4b5563">&#8226; cost: C (0.88) displaced — the opportunity price of representativeness</text>
  <text x="60" y="346" font-size="11" fill="#b91c1c">if floors sum &gt; budget &#8594; infeasible: change the plan, not the ranking</text>
</svg>
