<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <style>
    .dark [fill="#047857"]{fill:#34d399}
    .dark [stroke="#047857"]{stroke:#34d399}
    .dark [fill="#1d4ed8"]{fill:#93c5fd}
    .dark [stroke="#1d4ed8"]{stroke:#93c5fd}
    .dark [fill="#2563eb"]{fill:#6aa8f8}
    .dark [stroke="#2563eb"]{stroke:#6aa8f8}
    .dark [fill="#374151"]{fill:#e5e7eb}
    .dark [stroke="#374151"]{stroke:#e5e7eb}
    .dark [fill="#4b5563"]{fill:#d1d5db}
    .dark [stroke="#4b5563"]{stroke:#d1d5db}
    .dark [fill="#6b7280"]{fill:#a4adba}
    .dark [stroke="#6b7280"]{stroke:#a4adba}
    .dark [fill="#92400e"]{fill:#fbbf24}
    .dark [stroke="#92400e"]{stroke:#fbbf24}
    .dark [fill="#9ca3af"]{fill:#c3cad4}
    .dark [stroke="#9ca3af"]{stroke:#c3cad4}
    .dark [fill="#b91c1c"]{fill:#f87171}
    .dark [stroke="#b91c1c"]{stroke:#f87171}
    .dark [fill="#d97706"]{fill:#f59e0b}
    .dark [stroke="#d97706"]{stroke:#f59e0b}
    .dark [fill="#bfdbfe"]{fill:#1e3a5f}
    .dark [fill="#dbeafe"]{fill:#1e3a5f}
    .dark [fill="#d1fae5"]{fill:#123a2b}
    .dark [fill="#fef3c7"]{fill:#453007}
    .dark [fill="#fee2e2"]{fill:#451a1a}
    .dark [fill="#f3f4f6"]{fill:#1f2937}
    .dark [fill="#ffffff"]{fill:#161a22}
    .dark rect.bg{fill:#0f1115}
    .dark [fill="none"]{fill:none}
  </style>
  <rect class="bg" x="0" y="0" width="700" height="380" fill="#ffffff"/>

  <text x="28" y="38" font-size="16" fill="#374151" font-weight="600">the selection inequality, drawn</text>
  <text x="28" y="60" font-size="11" fill="#6b7280">win only while the bottom bar is shorter — at matched quality</text>

  <!-- time axis -->
  <line x1="60" y1="300" x2="660" y2="300" stroke="#9ca3af" stroke-width="1"/>
  <text x="360" y="322" font-size="10" fill="#6b7280" text-anchor="middle">wall-clock time &#8594;</text>

  <!-- full-train bar -->
  <rect x="60" y="96" width="540" height="34" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="72" y="117" font-size="11" fill="#1d4ed8" font-weight="600">T_train(full)&#160;&#160;100 epochs x 1.28M images</text>
  <text x="596" y="88" font-size="10" fill="#4b5563" text-anchor="end">reference</text>

  <!-- selection pipeline bar -->
  <rect x="60" y="170" width="54" height="34" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <rect x="114" y="170" width="276" height="34" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="87" y="190" font-size="10" fill="#92400e" text-anchor="middle" font-weight="600">score</text>
  <text x="252" y="190" font-size="11" fill="#047857" text-anchor="middle" font-weight="600">T_train(subset) — every epoch ~10x cheaper</text>

  <!-- saving bracket -->
  <line x1="390" y1="170" x2="390" y2="152" stroke="#047857" stroke-width="1.5"/>
  <line x1="600" y1="96" x2="600" y2="152" stroke="#047857" stroke-width="1.5"/>
  <line x1="390" y1="152" x2="600" y2="152" stroke="#047857" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="495" y="145" font-size="10" fill="#047857" text-anchor="middle" font-weight="600">the saving</text>

  <!-- failing variant -->
  <rect x="60" y="240" width="180" height="30" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <rect x="240" y="240" width="276" height="30" fill="#d1fae5" stroke="#047857" stroke-width="1.5" opacity="0.55"/>
  <text x="150" y="259" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="600">fat scorer eats the margin</text>
  <text x="378" y="259" font-size="10" fill="#4b5563" text-anchor="middle">same subset — total now &#8776; full</text>

  <text x="28" y="352" font-size="10" fill="#6b7280">worked case: 128k-image coreset on one H100 — scoring &lt; 1/3 of an epoch, subset shrinks all 100 epochs</text>
</svg>
