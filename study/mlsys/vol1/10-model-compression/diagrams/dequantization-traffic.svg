<svg xmlns="http://www.w3.org/2000/svg" id="mc-dequantization-traffic" class="study-fig-fit" viewBox="0 0 408 294" role="img" aria-labelledby="mc-dequantization-title mc-dequantization-desc">
  <title id="mc-dequantization-title">Off-chip bytes per token with separate versus fused unpacking</title>
  <desc id="mc-dequantization-desc">Separate kernels read 0.75 GB of packed weights, write and reread a 3 GB FP16 tensor, and read 0.30 GB of key and value cache, for 7.05 GB. A fused kernel uses the same packed weight and cache reads but unpacks tiles on-chip, for 1.05 GB.</desc>
  <style>
    #mc-dequantization-traffic { font-family: system-ui, sans-serif; }
    .dark #mc-dequantization-traffic [fill="#fbf7f0"] { fill: #201a17; }
    .dark #mc-dequantization-traffic [fill="#29231e"] { fill: #f7eee3; }
    .dark #mc-dequantization-traffic [fill="#6f6055"] { fill: #c8b8aa; }
    .dark #mc-dequantization-traffic [fill="#efd1be"] { fill: #583628; }
    .dark #mc-dequantization-traffic [stroke="#b8a89c"] { stroke: #72665c; }
  </style>
  <rect width="408" height="294" rx="12" fill="#fbf7f0"/>
  <g fill="#29231e" font-size="22" font-weight="650">
    <text x="24" y="39">Separate kernels</text>
    <text x="384" y="39" text-anchor="end">7.05 GB / token</text>
    <text x="24" y="182">Fused kernel</text>
    <text x="384" y="182" text-anchor="end">1.05 GB / token</text>
  </g>
  <rect x="16" y="81" width="376" height="58" rx="6" fill="#efd1be"/>
  <g fill="#29231e" font-size="19">
    <text x="24" y="72">Read packed weights</text>
    <text x="24" y="104">Write FP16 tensor</text>
    <text x="24" y="130">Read FP16 tensor</text>
    <text x="24" y="215">Read packed weights</text>
    <text x="24" y="241">Unpack FP16 tiles on-chip</text>
    <g font-weight="620" text-anchor="end">
      <text x="384" y="72">0.75 GB</text>
      <text x="384" y="104">3.00 GB</text>
      <text x="384" y="130">3.00 GB</text>
      <text x="384" y="215">0.75 GB</text>
      <text x="384" y="241">0 GB</text>
    </g>
  </g>
  <path d="M24 151H384M24 253H384" fill="none" stroke="#b8a89c"/>
  <text x="24" y="277" fill="#6f6055" font-size="18">Both totals include 0.30 GB of KV reads.</text>
</svg>
