<svg xmlns="http://www.w3.org/2000/svg" id="mc-distillation-probabilities" class="study-fig-fit" viewBox="0 0 408 301" role="img" aria-labelledby="mc-distillation-title mc-distillation-desc">
  <title id="mc-distillation-title">Hard label and teacher probabilities for the same bicycle frame</title>
  <desc id="mc-distillation-desc">The hard label assigns 100 percent to bicycle and zero to motorcycle and bus. The softened teacher assigns 85 percent to bicycle, 13 percent to motorcycle and 2 percent to bus.</desc>
  <style>
    #mc-distillation-probabilities { font-family: system-ui, sans-serif; }
    .dark #mc-distillation-probabilities [fill="#fbf7f0"] { fill: #201a17; }
    .dark #mc-distillation-probabilities [fill="#29231e"] { fill: #f7eee3; }
    .dark #mc-distillation-probabilities [fill="#6f6055"] { fill: #c8b8aa; }
    .dark #mc-distillation-probabilities [fill="#cfc1b2"] { fill: #8b7f73; }
    .dark #mc-distillation-probabilities [fill="#cf8359"] { fill: #d99066; }
    .dark #mc-distillation-probabilities [fill="#9a3d1d"] { fill: #f6c6a5; }
    .dark #mc-distillation-probabilities [stroke="#b8a89c"] { stroke: #72665c; }
  </style>
  <rect width="408" height="301" rx="12" fill="#fbf7f0"/>
  <g fill="#29231e" font-size="21" font-weight="650">
    <text x="24" y="39">Hard label</text>
    <text x="24" y="108">Softened teacher</text>
  </g>
  <rect x="24" y="49" width="360" height="22" fill="#cfc1b2"/>
  <rect x="24" y="118" width="306" height="22" fill="#cfc1b2"/>
  <rect x="330" y="118" width="46.8" height="22" fill="#cf8359"/>
  <rect x="376.8" y="118" width="7.2" height="22" fill="#9a3d1d"/>
  <g fill="#6f6055" font-size="17">
    <text x="24" y="165">0%</text>
    <text x="384" y="165" text-anchor="end">100%</text>
  </g>

  <g fill="#6f6055" font-size="18">
    <text x="24" y="197">Class</text>
    <text x="234" y="197" text-anchor="middle">Hard</text>
    <text x="342" y="197" text-anchor="middle">Teacher</text>
  </g>
  <path d="M24 208H384" stroke="#b8a89c" fill="none"/>
  <g fill="#29231e" font-size="20">
    <rect x="24" y="220" width="13" height="13" rx="2" fill="#cfc1b2"/>
    <rect x="24" y="248" width="13" height="13" rx="2" fill="#cf8359"/>
    <rect x="24" y="276" width="13" height="13" rx="2" fill="#9a3d1d"/>
    <text x="47" y="232">Bicycle</text>
    <text x="47" y="260">Motorcycle</text>
    <text x="47" y="288">Bus</text>
    <g text-anchor="middle" font-weight="620">
      <text x="234" y="232">100%</text>
      <text x="234" y="260">0%</text>
      <text x="234" y="288">0%</text>
      <text x="342" y="232">85%</text>
      <text x="342" y="260">13%</text>
      <text x="342" y="288">2%</text>
    </g>
  </g>
</svg>
