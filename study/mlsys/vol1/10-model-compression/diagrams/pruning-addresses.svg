<svg xmlns="http://www.w3.org/2000/svg" id="mc-pruning-addresses" class="study-fig-fit" viewBox="0 0 408 256" role="img" aria-labelledby="mc-pruning-title mc-pruning-desc">
  <title id="mc-pruning-title">Zeroing four slots and removing four channels</title>
  <desc id="mc-pruning-desc">A 32-input projection with four of its 16 outputs zeroed still writes 16 slots, including zeros. Removing four output channels reduces the weight matrix to 32 by 12 and the consumer reads 12 output slots.</desc>
  <style>
    #mc-pruning-addresses { font-family: system-ui, sans-serif; }
    .dark #mc-pruning-addresses [fill="#fbf7f0"] { fill: #201a17; }
    .dark #mc-pruning-addresses [fill="#29231e"] { fill: #f7eee3; }
    .dark #mc-pruning-addresses [fill="#6f6055"] { fill: #c8b8aa; }
    .dark #mc-pruning-addresses [stroke="#b8a89c"] { stroke: #72665c; }
    .dark #mc-pruning-addresses [fill="#cfc1b2"] { fill: #8b7f73; }
    .dark #mc-pruning-addresses [fill="#efd1be"] { fill: #583628; }
    .dark #mc-pruning-addresses [stroke="#9a3d1d"] { stroke: #f2a276; }
  </style>
  <rect width="408" height="256" rx="12" fill="#fbf7f0"/>

  <text x="24" y="39" fill="#29231e" font-size="23" font-weight="650">Zero four outputs</text>
  <text x="24" y="65" fill="#6f6055" font-size="18">32 × 16 weight slots</text>
  <g fill="#cfc1b2">
    <rect x="24" y="79" width="15" height="20" rx="2"/>
    <rect x="47" y="79" width="15" height="20" rx="2"/>
    <rect x="70" y="79" width="15" height="20" rx="2"/>
    <rect x="93" y="79" width="15" height="20" rx="2"/>
    <rect x="116" y="79" width="15" height="20" rx="2"/>
    <rect x="139" y="79" width="15" height="20" rx="2"/>
    <rect x="162" y="79" width="15" height="20" rx="2"/>
    <rect x="185" y="79" width="15" height="20" rx="2"/>
    <rect x="208" y="79" width="15" height="20" rx="2"/>
    <rect x="231" y="79" width="15" height="20" rx="2"/>
    <rect x="254" y="79" width="15" height="20" rx="2"/>
    <rect x="277" y="79" width="15" height="20" rx="2"/>
  </g>
  <g fill="#efd1be" stroke="#9a3d1d" stroke-width="1.5">
    <rect x="300" y="79" width="15" height="20" rx="2"/>
    <rect x="323" y="79" width="15" height="20" rx="2"/>
    <rect x="346" y="79" width="15" height="20" rx="2"/>
    <rect x="369" y="79" width="15" height="20" rx="2"/>
    <path d="M304 85l7 8m0-8l-7 8M327 85l7 8m0-8l-7 8M350 85l7 8m0-8l-7 8M373 85l7 8m0-8l-7 8" fill="none"/>
  </g>
  <text x="24" y="123" fill="#29231e" font-size="19">Consumer reads 16 channels</text>

  <path d="M24 139H384" fill="none" stroke="#b8a89c"/>
  <text x="24" y="174" fill="#29231e" font-size="23" font-weight="650">Remove four channels</text>
  <text x="24" y="199" fill="#6f6055" font-size="18">32 × 12 weight slots</text>
  <g fill="#cfc1b2">
    <rect x="24" y="211" width="15" height="20" rx="2"/>
    <rect x="47" y="211" width="15" height="20" rx="2"/>
    <rect x="70" y="211" width="15" height="20" rx="2"/>
    <rect x="93" y="211" width="15" height="20" rx="2"/>
    <rect x="116" y="211" width="15" height="20" rx="2"/>
    <rect x="139" y="211" width="15" height="20" rx="2"/>
    <rect x="162" y="211" width="15" height="20" rx="2"/>
    <rect x="185" y="211" width="15" height="20" rx="2"/>
    <rect x="208" y="211" width="15" height="20" rx="2"/>
    <rect x="231" y="211" width="15" height="20" rx="2"/>
    <rect x="254" y="211" width="15" height="20" rx="2"/>
    <rect x="277" y="211" width="15" height="20" rx="2"/>
  </g>
  <text x="24" y="249" fill="#29231e" font-size="19">Consumer reads 12 channels</text>
</svg>
