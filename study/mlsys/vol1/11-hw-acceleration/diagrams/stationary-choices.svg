<svg xmlns="http://www.w3.org/2000/svg" id="ha-stationary-choices" class="study-fig-fit" viewBox="0 0 420 260" role="img" aria-labelledby="ha-stationary-choices-title ha-stationary-choices-desc">
<title id="ha-stationary-choices-title">What each schedule holds</title>
<desc id="ha-stationary-choices-desc">For Y sub i j equals the sum over k of W sub i k times X sub k j, weight stationary holds W while varying j, input stationary holds X while varying i, and output stationary holds Y while varying k.</desc>
<style>
  #ha-stationary-choices { font-family: system-ui, sans-serif; }
  .dark #ha-stationary-choices [fill="#fbf7f0"] { fill: #201a17; }
  .dark #ha-stationary-choices [fill="#eee5da"] { fill: #332b26; }
  .dark #ha-stationary-choices [fill="#29231e"] { fill: #f7eee3; }
  .dark #ha-stationary-choices [fill="#6f6055"] { fill: #c8b8aa; }
  .dark #ha-stationary-choices [fill="#9a3d1d"] { fill: #f2a276; }
  .dark #ha-stationary-choices [stroke="#b8a89c"] { stroke: #72665c; }
  .dark #ha-stationary-choices [stroke="#6f6055"] { stroke: #ad9d8f; }
  .dark #ha-stationary-choices [stroke="#9a3d1d"] { stroke: #f2a276; }
</style>
<rect width="420" height="260" rx="12" fill="#fbf7f0"/>
<text x="22" y="36" fill="#29231e" font-size="22" font-weight="650">Same product, different reuse</text>
<text x="210" y="68" fill="#9a3d1d" font-size="20" font-weight="650" text-anchor="middle">Y[i,j] += W[i,k] × X[k,j]</text>
<rect x="22" y="90" width="376" height="40" rx="8" fill="#eee5da" stroke="#b8a89c"/>
<text x="34" y="116" fill="#6f6055" font-size="15" font-weight="650">WEIGHT stationary</text>
<text x="386" y="116" fill="#29231e" font-size="16" text-anchor="end">Hold W[i,k]  →  vary j</text>
<rect x="22" y="140" width="376" height="40" rx="8" fill="#eee5da" stroke="#b8a89c"/>
<text x="34" y="166" fill="#6f6055" font-size="15" font-weight="650">INPUT stationary</text>
<text x="386" y="166" fill="#29231e" font-size="16" text-anchor="end">Hold X[k,j]  →  vary i</text>
<rect x="22" y="190" width="376" height="40" rx="8" fill="#eee5da" stroke="#b8a89c"/>
<text x="34" y="216" fill="#6f6055" font-size="15" font-weight="650">OUTPUT stationary</text>
<text x="386" y="216" fill="#29231e" font-size="16" text-anchor="end">Hold Y[i,j]  →  vary k</text>
</svg>
