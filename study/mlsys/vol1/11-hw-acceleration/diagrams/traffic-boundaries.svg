<svg xmlns="http://www.w3.org/2000/svg" id="ha-traffic-boundaries" class="study-fig-fit" viewBox="0 0 420 368" role="img" aria-labelledby="ha-traffic-boundaries-title ha-traffic-boundaries-desc">
<title id="ha-traffic-boundaries-title">Count bytes at the boundary they cross</title>
<desc id="ha-traffic-boundaries-desc">Host memory connects through a host link to device memory. Device memory feeds local SRAM and registers. The projection calculation counts bytes crossing the device-memory boundary; a host transfer is a separate boundary, and reuse can prevent repeated device-memory reads.</desc>
<style>
  #ha-traffic-boundaries { font-family: system-ui, sans-serif; }
  .dark #ha-traffic-boundaries [fill="#fbf7f0"] { fill: #201a17; }
  .dark #ha-traffic-boundaries [fill="#eee5da"] { fill: #332b26; }
  .dark #ha-traffic-boundaries [fill="#29231e"] { fill: #f7eee3; }
  .dark #ha-traffic-boundaries [fill="#6f6055"] { fill: #c8b8aa; }
  .dark #ha-traffic-boundaries [fill="#9a3d1d"] { fill: #f2a276; }
  .dark #ha-traffic-boundaries [stroke="#b8a89c"] { stroke: #72665c; }
  .dark #ha-traffic-boundaries [stroke="#6f6055"] { stroke: #ad9d8f; }
  .dark #ha-traffic-boundaries [stroke="#9a3d1d"] { stroke: #f2a276; }
</style>
<rect width="420" height="368" rx="12" fill="#fbf7f0"/>
<text x="22" y="35" fill="#29231e" font-size="22" font-weight="650">Follow one operand</text>
<rect x="24" y="53" width="372" height="48" rx="8" fill="#eee5da" stroke="#b8a89c"/>
<text x="38" y="82" fill="#29231e" font-size="19" font-weight="650">Host memory</text>
<text x="382" y="82" fill="#6f6055" font-size="15" text-anchor="end">staging, if needed</text>
<rect x="24" y="120" width="372" height="48" rx="8" fill="#eee5da" stroke="#b8a89c"/>
<text x="38" y="149" fill="#29231e" font-size="19" font-weight="650">Device memory</text>
<text x="382" y="149" fill="#6f6055" font-size="15" text-anchor="end">weights and inputs</text>
<rect x="24" y="224" width="372" height="48" rx="8" fill="#eee5da" stroke="#b8a89c"/>
<text x="38" y="253" fill="#29231e" font-size="19" font-weight="650">Local SRAM</text>
<text x="382" y="253" fill="#6f6055" font-size="15" text-anchor="end">tiles held for reuse</text>
<rect x="24" y="291" width="372" height="48" rx="8" fill="#eee5da" stroke="#b8a89c"/>
<text x="38" y="320" fill="#29231e" font-size="19" font-weight="650">Registers</text>
<text x="382" y="320" fill="#6f6055" font-size="15" text-anchor="end">operands for arithmetic</text>
<path d="M210 101L210 120" fill="none" stroke="#6f6055" stroke-width="2"/>
<path d="M210 168L210 178 M210 220L210 224" fill="none" stroke="#9a3d1d" stroke-width="2"/>
<path d="M210 272L210 291" fill="none" stroke="#6f6055" stroke-width="2"/>
<text x="210" y="197" fill="#9a3d1d" font-size="15" font-weight="650" text-anchor="middle">DEVICE-MEMORY BOUNDARY</text>
<text x="210" y="216" fill="#6f6055" font-size="15" text-anchor="middle">count bytes here</text>
</svg>
