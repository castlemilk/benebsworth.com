<svg xmlns="http://www.w3.org/2000/svg" id="bm-duty-cycle" class="study-fig-fit" viewBox="0 0 408 300" role="img" aria-labelledby="bm-duty-title bm-duty-desc">
  <title id="bm-duty-title">One second of keyword spotting</title>
  <desc id="bm-duty-desc">Inside each one-second audio window the DS-CNN inference runs for 8.3 milliseconds — a 0.8 percent duty cycle. At that duty the standby floor, not the 3.3 millijoule inference, sets the battery drain.</desc>
  <style>
    #bm-duty-cycle { font-family: system-ui, sans-serif; }
    .dark #bm-duty-cycle [fill="#fbf7f0"] { fill: #201a17; }
    .dark #bm-duty-cycle [fill="#29231e"] { fill: #f7eee3; }
    .dark #bm-duty-cycle [fill="#6f6055"] { fill: #c8b8aa; }
    .dark #bm-duty-cycle [fill="#cfc1b2"] { fill: #8b7f73; }
    .dark #bm-duty-cycle [fill="#cf8359"] { fill: #d99066; }
    .dark #bm-duty-cycle [stroke="#b8a89c"] { stroke: #72665c; }
  </style>
  <rect width="408" height="300" rx="12" fill="#fbf7f0"/>
  <text x="24" y="38" fill="#29231e" font-size="21" font-weight="650">8.3 ms of work per 1,000 ms</text>
  <text x="24" y="60" fill="#6f6055" font-size="14">keyword spotting · one inference per one-second window</text>

  <rect x="24" y="84" width="360" height="34" rx="7" fill="#cfc1b2"/>
  <rect x="24" y="84" width="3.4" height="34" fill="#cf8359"/>
  <rect x="24" y="132" width="360" height="34" rx="7" fill="#cfc1b2"/>
  <rect x="24" y="132" width="3.4" height="34" fill="#cf8359"/>
  <text x="34" y="106" fill="#6f6055" font-size="12">idle</text>
  <text x="34" y="154" fill="#6f6055" font-size="12">idle</text>
  <g fill="#6f6055" font-size="12">
    <text x="24" y="186">0 ms</text><text x="370" y="186" text-anchor="end">1,000 ms</text>
  </g>
  <path d="M26 84V72M26 84V72" stroke="#b8a89c"/>
  <text x="44" y="78" fill="#cf8359" font-size="12" font-weight="600">inference: 8.3 ms · ~3.3 mJ</text>

  <rect x="24" y="204" width="360" height="52" rx="8" fill="#cfc1b2"/>
  <rect x="24" y="204" width="9" height="52" fill="#cf8359"/>
  <text x="48" y="226" fill="#29231e" font-size="14" font-weight="600">average power ≈ standby floor</text>
  <text x="48" y="246" fill="#6f6055" font-size="13">duty 0.8% → idle share of drain above 90%</text>
  <text x="24" y="284" fill="#6f6055" font-size="13">the efficiency that matters at this duty is the one that is off</text>
</svg>
