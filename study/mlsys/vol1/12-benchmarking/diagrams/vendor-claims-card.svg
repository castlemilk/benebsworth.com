<svg xmlns="http://www.w3.org/2000/svg" id="bm-vendor-claims" class="study-fig-fit" viewBox="0 0 408 320" role="img" aria-labelledby="bm-vendor-title bm-vendor-desc">
  <title id="bm-vendor-title">Five vendor claims that cannot be compared</title>
  <desc id="bm-vendor-desc">Five spec cards quote 8 TOPS INT8, 15 TOPS INT4, a proprietary latency, a two-generation-old MLPerf score and a peak at maximum batch. All five must be normalized onto the same task, model, state and boundary before the camera-trap gates decide.</desc>
  <style>
    #bm-vendor-claims { font-family: system-ui, sans-serif; }
    .dark #bm-vendor-claims [fill="#fbf7f0"] { fill: #201a17; }
    .dark #bm-vendor-claims [fill="#29231e"] { fill: #f7eee3; }
    .dark #bm-vendor-claims [fill="#6f6055"] { fill: #c8b8aa; }
    .dark #bm-vendor-claims [fill="#cfc1b2"] { fill: #8b7f73; }
    .dark #bm-vendor-claims [fill="#cf8359"] { fill: #d99066; }
    .dark #bm-vendor-claims [stroke="#b8a89c"] { stroke: #72665c; }
  </style>
  <rect width="408" height="320" rx="12" fill="#fbf7f0"/>
  <text x="24" y="36" fill="#29231e" font-size="21" font-weight="650">Which claim survives normalization?</text>
  <g font-size="14">
    <rect x="24" y="52" width="172" height="46" rx="7" fill="#cfc1b2"/><text x="36" y="72" fill="#29231e" font-weight="600">Vendor A</text><text x="36" y="88" fill="#6f6055" font-size="12">8 TOPS · INT8</text>
    <rect x="212" y="52" width="172" height="46" rx="7" fill="#cfc1b2"/><text x="224" y="72" fill="#29231e" font-weight="600">Vendor B</text><text x="224" y="88" fill="#6f6055" font-size="12">15 TOPS · INT4</text>
    <rect x="24" y="106" width="172" height="46" rx="7" fill="#cfc1b2"/><text x="36" y="126" fill="#29231e" font-weight="600">Vendor C</text><text x="36" y="142" fill="#6f6055" font-size="12">proprietary model latency</text>
    <rect x="212" y="106" width="172" height="46" rx="7" fill="#cfc1b2"/><text x="224" y="126" fill="#29231e" font-weight="600">Vendor D</text><text x="224" y="142" fill="#6f6055" font-size="12">MLPerf, two suites ago</text>
    <rect x="118" y="160" width="172" height="46" rx="7" fill="#cfc1b2"/><text x="130" y="180" fill="#29231e" font-weight="600">Vendor E</text><text x="130" y="196" fill="#6f6055" font-size="12">peak at max batch</text>
  </g>
  <path d="M110 206v18H204v14M298 206v18H204v14M204 206v32" stroke="#b8a89c" stroke-width="1.4" fill="none"/>
  <rect x="84" y="238" width="240" height="30" rx="7" fill="#cf8359"/>
  <text x="204" y="258" text-anchor="middle" fill="#29231e" font-size="14" font-weight="650">one task · one model · one state · one boundary</text>
  <text x="24" y="298" fill="#6f6055" font-size="13">then the gates decide: p99 ≤ 33 ms · battery life · slice recall</text>
</svg>
