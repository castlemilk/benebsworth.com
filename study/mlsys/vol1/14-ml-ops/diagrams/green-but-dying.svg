<svg xmlns="http://www.w3.org/2000/svg" id="mo-green" class="study-fig-fit" viewBox="0 0 408 300" role="img" aria-labelledby="mo-g-title mo-g-desc">
  <title id="mo-g-title">Green dashboards, red quality</title>
  <desc id="mo-g-desc">Every infrastructure check reads green — HTTP 200, p99 inside budget, 99.99% uptime — while click accuracy slides from 94 to 88 percent over four weeks.</desc>
  <style>
    #mo-green { font-family: system-ui, sans-serif; }
    .dark #mo-green [fill="#fbf7f0"] { fill: #201a17; }
    .dark #mo-green [fill="#29231e"] { fill: #f7eee3; }
    .dark #mo-green [fill="#6f6055"] { fill: #c8b8aa; }
    .dark #mo-green [fill="#cfc1b2"] { fill: #8b7f73; }
    .dark #mo-green [fill="#cf8359"] { fill: #d99066; }
    .dark #mo-green [fill="#7d9a6d"] { fill: #8fae7e; }
    .dark #mo-green [stroke="#b8a89c"] { stroke: #72665c; }
  </style>
  <rect width="408" height="300" rx="12" fill="#fbf7f0"/>
  <text x="24" y="38" fill="#29231e" font-size="20" font-weight="650">Every check green; the model is dying</text>
  <text x="24" y="59" fill="#6f6055" font-size="13">infrastructure health ≠ model health — four weeks</text>

  <g font-size="12" fill="#29231e">
    <rect x="24" y="80" width="112" height="44" rx="7" fill="#7d9a6d"/>
    <text x="80" y="99" text-anchor="middle">HTTP 200 ✓</text>
    <text x="80" y="115" text-anchor="middle" font-size="10.5">every request</text>
    <rect x="148" y="80" width="112" height="44" rx="7" fill="#7d9a6d"/>
    <text x="204" y="99" text-anchor="middle">p99 ≤ budget ✓</text>
    <text x="204" y="115" text-anchor="middle" font-size="10.5">latency fine</text>
    <rect x="272" y="80" width="112" height="44" rx="7" fill="#7d9a6d"/>
    <text x="328" y="99" text-anchor="middle">99.99% ✓</text>
    <text x="328" y="115" text-anchor="middle" font-size="10.5">uptime</text>
  </g>

  <text x="24" y="152" fill="#6f6055" font-size="12">meanwhile, the instrument nobody wired:</text>
  <path d="M40 190 L368 250" stroke="#cf8359" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M368 250 l-12 -6 m12 6 l-14 5" stroke="#cf8359" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="40" y="180" fill="#29231e" font-size="13" font-weight="600">94%</text>
  <text x="368" y="272" text-anchor="end" fill="#cf8359" font-size="13" font-weight="600">88%</text>
  <text x="204" y="272" text-anchor="middle" fill="#6f6055" font-size="11.5">click accuracy · week 0 → week 4 · zero alerts</text>

  <text x="210" y="293" text-anchor="middle" fill="#29231e" font-size="12.5" font-weight="600">the silent failure: available, fast, wrong</text>
</svg>
