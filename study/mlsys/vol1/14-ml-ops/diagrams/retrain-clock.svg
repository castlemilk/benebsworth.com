<svg xmlns="http://www.w3.org/2000/svg" id="mo-clock" class="study-fig-fit" viewBox="0 0 408 300" role="img" aria-labelledby="mo-r-title mo-r-desc">
  <title id="mo-r-title">Staleness accrues; runs reset it</title>
  <desc id="mo-r-desc">Accuracy decays between retraining runs, which restore it for a fixed cost. The optimal interval sits where amortized run cost meets accrued staleness — about three days for the ranking service.</desc>
  <style>
    #mo-clock { font-family: system-ui, sans-serif; }
    .dark #mo-clock [fill="#fbf7f0"] { fill: #201a17; }
    .dark #mo-clock [fill="#29231e"] { fill: #f7eee3; }
    .dark #mo-clock [fill="#6f6055"] { fill: #c8b8aa; }
    .dark #mo-clock [fill="#cfc1b2"] { fill: #8b7f73; }
    .dark #mo-clock [fill="#cf8359"] { fill: #d99066; }
    .dark #mo-clock [stroke="#b8a89c"] { stroke: #72665c; }
  </style>
  <rect width="408" height="300" rx="12" fill="#fbf7f0"/>
  <text x="24" y="38" fill="#29231e" font-size="20" font-weight="650">The retrain decision is a cost curve</text>
  <text x="24" y="59" fill="#6f6055" font-size="13">T* = √(2C_r / Q·v·A₀·δ) — run cost vs accrued staleness</text>

  <path d="M40 100 q90 26 130 60 l0 -60 q0 0 0 0 M170 100 q90 26 130 60 l0 -60 M300 100 q40 12 68 34" fill="none" stroke="#cf8359" stroke-width="2.5"/>
  <g stroke="#b8a89c" stroke-width="1.5" stroke-dasharray="4 4">
    <path d="M170 96v70M300 96v70"/>
  </g>
  <g font-size="11" fill="#6f6055">
    <text x="170" y="84" text-anchor="middle">run: $5,000</text>
    <text x="300" y="84" text-anchor="middle">run: $5,000</text>
    <text x="105" y="140" fill="#cf8359">staleness accrues</text>
  </g>
  <text x="40" y="92" fill="#29231e" font-size="12.5" font-weight="600">94%</text>
  <text x="40" y="180" fill="#6f6055" font-size="11">0.24%/day decay</text>

  <g font-size="12" fill="#29231e">
    <rect x="24" y="200" width="110" height="30" rx="6" fill="#cfc1b2"/>
    <text x="79" y="219" text-anchor="middle">T too short → run cost</text>
    <rect x="149" y="200" width="110" height="30" rx="6" fill="#cf8359"/>
    <text x="204" y="219" text-anchor="middle">T* ≈ 3 days</text>
    <rect x="274" y="200" width="110" height="30" rx="6" fill="#cfc1b2"/>
    <text x="329" y="219" text-anchor="middle">T too long → staleness</text>
  </g>

  <text x="204" y="256" text-anchor="middle" fill="#6f6055" font-size="12">Q=1M/day · v=$0.50 · A₀=0.94 · δ=0.24%/day</text>
  <text x="204" y="280" text-anchor="middle" fill="#29231e" font-size="12.5">if T* is faster than your release path, the path is the constraint</text>
</svg>
