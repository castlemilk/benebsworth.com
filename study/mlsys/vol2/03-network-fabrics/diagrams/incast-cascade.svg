<svg xmlns="http://www.w3.org/2000/svg" id="incast-cascade" class="study-fig-fit" viewBox="0 0 380 296" role="img" aria-labelledby="ic-title ic-desc">
  <title id="ic-title">256 senders, one port, five microseconds</title>
  <desc id="ic-desc">A fan-in diagram: 256 senders on the left converging through a switch onto one 50 gigabytes per second egress port on the right. A buffer bar shows 32 megabytes of capacity draining at the egress rate while offered load is 12.8 terabytes per second, a 256-to-1 oversubscription that overflows the buffer in under five microseconds.</desc>
  <style>
    .dark #incast-cascade { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094 }
    @media (prefers-color-scheme: dark) { svg:root#incast-cascade { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094 } }
  </style>
  <rect width="380" height="296" rx="8" fill="var(--fig-paper, #f7f3e9)"/>
  <g font-family="system-ui, sans-serif" fill="var(--fig-ink, #252923)">
    <text x="20" y="30" font-size="19" font-weight="650">The buffer dies before help arrives</text>
    <text x="20" y="48" font-size="11.5" fill="var(--fig-rule, #6e6a5b)">AllGather fan-in · one SuperPOD scalable unit</text>

    <!-- senders -->
    <g stroke="var(--fig-outline, #364c50)" stroke-width="1.1" fill="var(--fig-paper, #f7f3e9)">
      <rect x="24" y="70" width="34" height="13" rx="3"/><rect x="24" y="90" width="34" height="13" rx="3"/>
      <rect x="24" y="110" width="34" height="13" rx="3"/><rect x="24" y="130" width="34" height="13" rx="3"/>
      <rect x="24" y="150" width="34" height="13" rx="3"/><rect x="24" y="170" width="34" height="13" rx="3"/>
      <rect x="24" y="190" width="34" height="13" rx="3"/><rect x="24" y="210" width="34" height="13" rx="3"/>
    </g>
    <text x="41" y="79" font-size="7" text-anchor="middle">50G</text><text x="41" y="99" font-size="7" text-anchor="middle">50G</text>
    <text x="41" y="119" font-size="7" text-anchor="middle">50G</text><text x="41" y="139" font-size="7" text-anchor="middle">…</text>
    <text x="41" y="159" font-size="7" text-anchor="middle">…</text><text x="41" y="179" font-size="7" text-anchor="middle">…</text>
    <text x="41" y="199" font-size="7" text-anchor="middle">50G</text><text x="41" y="219" font-size="7" text-anchor="middle">50G</text>
    <text x="41" y="246" font-size="9.5" font-weight="650" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">×256 senders</text>

    <!-- fan lines -->
    <g stroke="var(--fig-outline, #364c50)" stroke-width="1" opacity="0.55">
      <line x1="58" y1="76" x2="160" y2="140"/><line x1="58" y1="96" x2="160" y2="142"/>
      <line x1="58" y1="116" x2="160" y2="144"/><line x1="58" y1="136" x2="160" y2="146"/>
      <line x1="58" y1="156" x2="160" y2="148"/><line x1="58" y1="176" x2="160" y2="150"/>
      <line x1="58" y1="196" x2="160" y2="152"/><line x1="58" y1="216" x2="160" y2="154"/>
    </g>
    <text x="110" y="130" font-size="9" font-weight="650" text-anchor="middle" fill="var(--fig-mark, #b4571f)">12.8 TB/s</text>
    <text x="110" y="142" font-size="8" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">offered</text>

    <!-- switch + buffer -->
    <rect x="160" y="128" width="96" height="40" rx="5" fill="none" stroke="var(--fig-outline, #364c50)" stroke-width="1.4"/>
    <text x="208" y="145" font-size="9.5" font-weight="650" text-anchor="middle">switch</text>
    <rect x="166" y="152" width="84" height="8" rx="2" fill="var(--fig-mark, #b4571f)" opacity="0.85"/>
    <text x="208" y="158.5" font-size="6.5" text-anchor="middle" fill="var(--fig-paper, #f7f3e9)">32 MB buffer</text>

    <!-- egress -->
    <line x1="256" y1="148" x2="300" y2="148" stroke="var(--fig-outline, #364c50)" stroke-width="2.4"/>
    <path d="M 300 142 L 310 148 L 300 154 Z" fill="var(--fig-outline, #364c50)"/>
    <rect x="312" y="132" width="48" height="32" rx="4" fill="none" stroke="var(--fig-outline, #364c50)" stroke-width="1.4"/>
    <text x="336" y="146" font-size="8" text-anchor="middle">egress</text>
    <text x="336" y="157" font-size="8" font-weight="650" text-anchor="middle">50 GB/s</text>
    <text x="336" y="180" font-size="8.5" text-anchor="middle" fill="var(--fig-mark, #b4571f)" font-weight="650">256× oversubscribed</text>

    <!-- survival timeline -->
    <text x="24" y="266" font-size="10" font-weight="650">buffer survival</text>
    <line x1="120" y1="262" x2="352" y2="262" stroke="var(--fig-rule, #6e6a5b)" stroke-width="1"/>
    <line x1="120" y1="258" x2="120" y2="266" stroke="var(--fig-rule, #6e6a5b)" stroke-width="1"/>
    <text x="120" y="276" font-size="8" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">0</text>
    <line x1="128" y1="258" x2="128" y2="266" stroke="var(--fig-mark, #b4571f)" stroke-width="2.4"/>
    <text x="136" y="255" font-size="8.5" fill="var(--fig-mark, #b4571f)" font-weight="650">overflow &lt; 5 μs</text>
    <text x="136" y="276" font-size="8" fill="var(--fig-rule, #6e6a5b)">5 μs feedback RTT returns</text>
    <text x="352" y="276" font-size="8" text-anchor="end" fill="var(--fig-rule, #6e6a5b)">640 μs = 32 MB ÷ 50 GB/s</text>
  </g>
</svg>
