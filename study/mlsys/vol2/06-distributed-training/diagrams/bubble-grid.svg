<svg xmlns="http://www.w3.org/2000/svg" id="bubble-grid" class="study-fig-fit" viewBox="0 0 380 300" role="img" aria-labelledby="bg-title bg-desc">
  <title id="bg-title">The slots the pipe cannot fill</title>
  <desc id="bg-desc">Pipeline schedules drawn as stage-by-slot bands. The busy work is a parallelogram leaning right as stages start later; the shaded triangles are the fill and drain idle wedges. PP-16 at 32 microbatches idles about 32 percent of slots; PP-4 at the same microbatch count wastes about 9 percent.</desc>
  <style>
    .dark #bubble-grid { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094 }
    @media (prefers-color-scheme: dark) { svg:root#bubble-grid { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094 } }
  </style>
  <rect width="380" height="300" rx="8" fill="var(--fig-paper, #f7f3e9)"/>
  <g font-family="system-ui, sans-serif" fill="var(--fig-ink, #252923)">
    <text x="20" y="28" font-size="19" font-weight="650">The slots the pipe cannot fill</text>
    <text x="20" y="45" font-size="11" fill="var(--fig-rule, #6e6a5b)">idle share = (p−1)/(m+p−1) · shaded slots wait on fill or drain</text>

    <!-- PP-16: p-1=15 idle of m+p-1=47 ~32%. Frame 44..344 (300px): wedge 96px -->
    <text x="44" y="76" font-size="10" font-weight="650">PP-16 · 32 microbatches</text>
    <text x="344" y="76" font-size="9" text-anchor="end" fill="var(--fig-mark, #b4571f)" font-weight="650">~32% idle</text>
    <g>
      <!-- idle triangles -->
      <path d="M 44 84 L 44 180 L 140 180 Z" fill="var(--fig-mark,#b4571f)" opacity="0.40"/>
      <path d="M 248 84 L 344 84 L 344 180 Z" fill="var(--fig-mark,#b4571f)" opacity="0.40"/>
      <!-- busy parallelogram -->
      <path d="M 44 84 L 248 84 L 344 180 L 140 180 Z" fill="var(--fig-outline,#364c50)" opacity="0.55"/>
      <!-- stage separators -->
      <line x1="44" x2="344" y1="103.2" y2="103.2" stroke="var(--fig-ink,#252923)" stroke-width="0.4" opacity="0.35"/>
      <line x1="44" x2="344" y1="122.4" y2="122.4" stroke="var(--fig-ink,#252923)" stroke-width="0.4" opacity="0.35"/>
      <line x1="44" x2="344" y1="141.6" y2="141.6" stroke="var(--fig-ink,#252923)" stroke-width="0.4" opacity="0.35"/>
      <line x1="44" x2="344" y1="160.8" y2="160.8" stroke="var(--fig-ink,#252923)" stroke-width="0.4" opacity="0.35"/>
      <rect x="44" y="84" width="300" height="96" fill="none" stroke="var(--fig-ink,#252923)" stroke-width="0.7" opacity="0.45"/>
      <text x="60" y="172" font-size="8" fill="var(--fig-ink,#252923)" opacity="0.8">fill: stages wait</text>
      <text x="330" y="96" font-size="8" text-anchor="end" fill="var(--fig-ink,#252923)" opacity="0.8">drain</text>
      <text x="14" y="138" font-size="8" fill="var(--fig-rule, #6e6a5b)">stages</text>
      <text x="194" y="192" font-size="8" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">slots = time</text>
    </g>

    <!-- PP-4: p-1=3 idle of 35 ~9%. wedge 26px -->
    <text x="44" y="214" font-size="10" font-weight="650">PP-4 · same 32 microbatches</text>
    <text x="344" y="214" font-size="9" text-anchor="end" fill="var(--fig-outline, #364c50)" font-weight="650">~9% idle</text>
    <g>
      <path d="M 44 222 L 44 266 L 70 266 Z" fill="var(--fig-mark,#b4571f)" opacity="0.40"/>
      <path d="M 318 222 L 344 222 L 344 266 Z" fill="var(--fig-mark,#b4571f)" opacity="0.40"/>
      <path d="M 44 222 L 318 222 L 344 266 L 70 266 Z" fill="var(--fig-outline,#364c50)" opacity="0.55"/>
      <line x1="44" x2="344" y1="233" y2="233" stroke="var(--fig-ink,#252923)" stroke-width="0.4" opacity="0.35"/>
      <line x1="44" x2="344" y1="244" y2="244" stroke="var(--fig-ink,#252923)" stroke-width="0.4" opacity="0.35"/>
      <line x1="44" x2="344" y1="255" y2="255" stroke="var(--fig-ink,#252923)" stroke-width="0.4" opacity="0.35"/>
      <rect x="44" y="222" width="300" height="44" fill="none" stroke="var(--fig-ink,#252923)" stroke-width="0.7" opacity="0.45"/>
      <text x="14" y="248" font-size="8" fill="var(--fig-rule, #6e6a5b)">stages</text>
    </g>

    <!-- legend + bottom line -->
    <rect x="20" y="282" width="10" height="8" fill="var(--fig-mark,#b4571f)" opacity="0.40"/><text x="34" y="290" font-size="8" fill="var(--fig-rule, #6e6a5b)">idle wedge</text>
    <rect x="100" y="282" width="10" height="8" fill="var(--fig-outline,#364c50)" opacity="0.55"/><text x="114" y="290" font-size="8" fill="var(--fig-rule, #6e6a5b)">busy</text>
    <text x="360" y="290" font-size="8.5" text-anchor="end" fill="var(--fig-rule, #6e6a5b)">more depth needs more microbatches</text>
  </g>
</svg>
