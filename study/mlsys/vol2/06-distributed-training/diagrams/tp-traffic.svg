<svg xmlns="http://www.w3.org/2000/svg" id="tp-traffic" class="study-fig-fit" viewBox="0 0 380 300" role="img" aria-labelledby="tp-title tp-desc">
  <title id="tp-title">What tensor splitting ships</title>
  <desc id="tp-desc">TP-8 traffic for one GPT-3 step: about 68 GB of forward collectives against about 4.2 GB of pipeline stage-boundary traffic, a 16-to-1 ratio. The ring factor 2(t-1)/t is 1.75 at t=8. Tensor parallelism fits under compute on NVLink and cannot on InfiniBand, which is why it lives inside the node.</desc>
  <style>
    .dark #tp-traffic { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094 }
    @media (prefers-color-scheme: dark) { svg:root#tp-traffic { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094 } }
  </style>
  <rect width="380" height="300" rx="8" fill="var(--fig-paper, #f7f3e9)"/>
  <g font-family="system-ui, sans-serif" fill="var(--fig-ink, #252923)">
    <text x="20" y="28" font-size="19" font-weight="650">What tensor splitting ships</text>
    <text x="20" y="45" font-size="11" fill="var(--fig-rule, #6e6a5b)">one GPT-3 step · TP-8 · forward traffic by path</text>

    <!-- two volume bars: 68 GB vs 4.2 GB, scale 68 -> 300px => 4.41px/GB -->
    <g>
      <rect x="20" y="64" width="300" height="34" rx="4" fill="var(--fig-mark, #b4571f)" opacity="0.30" stroke="var(--fig-mark, #b4571f)"/>
      <text x="30" y="85" font-size="11" font-weight="650">~68 GB · TP forward collectives</text>
      <text x="316" y="85" font-size="8.5" text-anchor="end" fill="var(--fig-rule, #6e6a5b)">intra-node</text>
      <rect x="20" y="106" width="19" height="34" rx="4" fill="var(--fig-outline, #364c50)" opacity="0.55"/>
      <text x="46" y="127" font-size="10">~4.2 GB · PP stage boundaries</text>
      <text x="46" y="116" font-size="8" fill="var(--fig-rule, #6e6a5b)">inter-node · 16x less</text>
    </g>

    <!-- ring factor: 2(t-1)/t = 1.75 at t=8 -->
    <g>
      <text x="20" y="166" font-size="10" font-weight="650">the ring factor</text>
      <text x="314" y="166" font-size="9" text-anchor="end" fill="var(--fig-rule, #6e6a5b)">bytes moved per byte reduced</text>
      <!-- t axis 1..8 -> x 36..340; factor -> (2-1.75)/(2-0)*... draw simple bar ramp -->
      <rect x="36" y="176" width="24" height="10" fill="var(--fig-outline,#364c50)" opacity="0.35"/>
      <rect x="78" y="176" width="24" height="20" fill="var(--fig-outline,#364c50)" opacity="0.42"/>
      <rect x="120" y="176" width="24" height="27" fill="var(--fig-outline,#364c50)" opacity="0.48"/>
      <rect x="162" y="176" width="24" height="32" fill="var(--fig-outline,#364c50)" opacity="0.54"/>
      <rect x="204" y="176" width="24" height="35" fill="var(--fig-outline,#364c50)" opacity="0.60"/>
      <rect x="246" y="176" width="24" height="37" fill="var(--fig-outline,#364c50)" opacity="0.66"/>
      <rect x="288" y="176" width="24" height="39" fill="var(--fig-outline,#364c50)" opacity="0.72"/>
      <rect x="330" y="176" width="24" height="41" fill="var(--fig-mark,#b4571f)" opacity="0.50" stroke="var(--fig-mark,#b4571f)"/>
      <text x="48" y="228" font-size="7.5" text-anchor="middle" fill="var(--fig-rule,#6e6a5b)">t=2</text>
      <text x="342" y="228" font-size="7.5" text-anchor="middle" fill="var(--fig-rule,#6e6a5b)">t=8</text>
      <text x="342" y="169" font-size="9" text-anchor="middle" font-weight="650" fill="var(--fig-mark,#b4571f)">1.75x</text>
      <text x="48" y="169" font-size="8" text-anchor="middle" fill="var(--fig-rule,#6e6a5b)">1.0x</text>
      <text x="190" y="244" font-size="8.5" text-anchor="middle" fill="var(--fig-rule,#6e6a5b)">each AllReduce pays 2(t−1)/t times the data — no free lunch wider</text>
    </g>

    <!-- why it stays in the node -->
    <g>
      <rect x="20" y="258" width="340" height="30" rx="4" fill="none" stroke="var(--fig-outline,#364c50)" stroke-width="0.8" opacity="0.5"/>
      <text x="30" y="271" font-size="8.5" fill="var(--fig-rule,#6e6a5b)">NVLink carries the 68 GB under compute; InfiniBand cannot</text>
      <text x="30" y="282" font-size="8.5" font-weight="600">— so TP stays inside the node, PP and DP cross the fabric</text>
    </g>
  </g>
</svg>
