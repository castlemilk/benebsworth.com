<svg xmlns="http://www.w3.org/2000/svg" id="phase-lanes" class="study-fig-fit" viewBox="0 0 380 300" role="img" aria-labelledby="phase-lanes-title phase-lanes-desc">
  <title id="phase-lanes-title">Prefill and decode lanes</title>
  <desc id="phase-lanes-desc">A two-lane timeline contrasting one wide compute-bound prefill pass with many narrow serial decode steps, and marking the KV-cache handoff cost between them.</desc>
  <style>
    .dark #phase-lanes { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094 }
    @media (prefers-color-scheme: dark) { svg:root#phase-lanes { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094 } }
  </style>
  <rect width="380" height="300" rx="8" fill="var(--fig-paper, #f7f3e9)"/>
  <g font-family="system-ui, sans-serif" fill="var(--fig-ink, #252923)">
    <text x="20" y="28" font-size="19" font-weight="650">Two phases, two resources</text>
    <text x="20" y="45" font-size="11" fill="var(--fig-rule, #6e6a5b)">prefill wide/compute-bound · decode serial/bandwidth-bound</text>

    <!-- timeline axis -->
    <line x1="48" y1="235" x2="358" y2="235" stroke="var(--fig-ink, #252923)" stroke-width="1"/>
    <text x="204" y="252" font-size="9" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">time</text>

    <!-- prefill worker -->
    <rect x="42" y="67" width="306" height="56" rx="5" fill="none" stroke="var(--fig-outline, #364c50)"/>
    <text x="54" y="84" font-size="9.5" font-weight="650" fill="var(--fig-outline, #364c50)">prefill lane</text>
    <rect x="124" y="75" width="178" height="34" rx="3" fill="var(--fig-outline, #364c50)"/>
    <text x="213" y="96" font-size="9.5" text-anchor="middle" fill="var(--fig-paper, #f7f3e9)">whole prompt in parallel · sets TTFT</text>
    <text x="302" y="90" font-size="8.5" fill="var(--fig-rule, #6e6a5b)">compute-bound</text>

    <!-- decode worker -->
    <rect x="42" y="143" width="306" height="66" rx="5" fill="none" stroke="var(--fig-outline, #364c50)"/>
    <text x="54" y="160" font-size="9.5" font-weight="650" fill="var(--fig-outline, #364c50)">decode lane</text>
    <g fill="var(--fig-mark, #b4571f)">
      <rect x="124" y="154" width="15" height="38"/><rect x="144" y="154" width="15" height="38" opacity=".88"/><rect x="164" y="154" width="15" height="38" opacity=".76"/><rect x="184" y="154" width="15" height="38" opacity=".64"/><rect x="204" y="154" width="15" height="38" opacity=".52"/><rect x="224" y="154" width="15" height="38" opacity=".42"/><rect x="244" y="154" width="15" height="38" opacity=".34"/><rect x="264" y="154" width="15" height="38" opacity=".26"/>
    </g>
    <text x="342" y="177" font-size="8.5" text-anchor="end" fill="var(--fig-rule, #6e6a5b)">decode steps · TPOT</text>

    <!-- KV transfer arrow -->
    <line x1="214" y1="109" x2="214" y2="149" stroke="var(--fig-mark, #b4571f)" stroke-width="1.6" marker-end="url(#phase-arrow)"/>
    <text x="223" y="132" font-size="8.5" fill="var(--fig-mark, #b4571f)">KV handoff: α + bytes/β</text>
    <defs><marker id="phase-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--fig-mark, #b4571f)"/></marker></defs>

    <text x="24" y="275" font-size="9" fill="var(--fig-rule, #6e6a5b)">Interleaving shares one worker; disaggregation buys independent scaling</text>
    <text x="24" y="289" font-size="9" fill="var(--fig-rule, #6e6a5b)">but pays queueing plus cache transfer at the boundary.</text>
  </g>
</svg>
