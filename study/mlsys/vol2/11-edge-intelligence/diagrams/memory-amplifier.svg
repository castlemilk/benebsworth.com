<svg xmlns="http://www.w3.org/2000/svg" id="memory-amplifier" class="study-fig-fit" viewBox="0 0 380 300" role="img" aria-labelledby="memory-amplifier-title memory-amplifier-desc">
  <title id="memory-amplifier-title">Training memory amplifier</title>
  <desc id="memory-amplifier-desc">A 40 MB inference weight footprint expands to a 360 MB training working set and is compared with a 200 to 300 MB background allowance.</desc>
  <style>
    .dark #memory-amplifier { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094 }
    @media (prefers-color-scheme: dark) { svg:root#memory-amplifier { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094 } }
  </style>
  <rect width="380" height="300" rx="8" fill="var(--fig-paper, #f7f3e9)"/>
  <g font-family="system-ui, sans-serif" fill="var(--fig-ink, #252923)">
    <text x="20" y="28" font-size="19" font-weight="650">Training memory amplifier</text>
    <text x="20" y="45" font-size="11" fill="var(--fig-rule, #6e6a5b)">40 MB weights become a 360 MB working set</text>
    <text x="24" y="79" font-size="10" font-weight="650">inference weights</text>
    <rect x="122" y="66" width="30" height="18" fill="var(--fig-outline, #364c50)"/>
    <text x="164" y="79" font-size="9">40 MB</text>
    <text x="24" y="117" font-size="10" font-weight="650">full update</text>
    <rect x="122" y="102" width="28" height="24" fill="var(--fig-outline, #364c50)"/>
    <rect x="150" y="102" width="28" height="24" fill="var(--fig-outline, #364c50)" opacity="0.75"/>
    <rect x="178" y="102" width="56" height="24" fill="var(--fig-outline, #364c50)" opacity="0.48"/>
    <rect x="234" y="102" width="140" height="24" fill="var(--fig-mark, #b4571f)" opacity="0.78"/>
    <text x="127" y="95" font-size="8">40</text><text x="155" y="95" font-size="8">40</text><text x="193" y="95" font-size="8">80 Adam</text><text x="285" y="95" font-size="8">200 activations</text>
    <text x="122" y="143" font-size="9" fill="var(--fig-rule, #6e6a5b)">weights + gradients + optimizer + activations = 360 MB</text>
    <line x1="262" y1="158" x2="262" y2="224" stroke="var(--fig-mark, #b4571f)" stroke-width="1.4" stroke-dasharray="4 3"/>
    <line x1="332" y1="158" x2="332" y2="224" stroke="var(--fig-mark, #b4571f)" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="262" y="172" font-size="8.5" text-anchor="end" fill="var(--fig-mark, #b4571f)">200 MB</text>
    <text x="331" y="172" font-size="8.5" fill="var(--fig-mark, #b4571f)">300 MB</text>
    <rect x="122" y="188" width="252" height="24" rx="4" fill="none" stroke="var(--fig-rule, #6e6a5b)"/>
    <text x="126" y="204" font-size="9" fill="var(--fig-rule, #6e6a5b)">background allowance range</text>
    <text x="122" y="238" font-size="9.2" fill="var(--fig-mark, #b4571f)">360 MB exceeds the whole 200-300 MB allowance</text>
    <text x="122" y="256" font-size="9" fill="var(--fig-rule, #6e6a5b)">Installed RAM is not the budget the update may use.</text>
  </g>
</svg>
