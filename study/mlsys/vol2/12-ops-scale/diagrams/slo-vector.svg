<svg xmlns="http://www.w3.org/2000/svg" id="slo-vector" class="study-fig-fit" viewBox="0 0 380 300" role="img" aria-labelledby="slo-vector-title slo-vector-desc">
  <title id="slo-vector-title">Fleet health is a vector, not an average</title>
  <desc id="slo-vector-desc">Four budget-consumption bars for availability, latency, freshness and quality against a limit of one. Freshness is at 1.30, over budget, while the mean of 0.70 looks healthy. Fleet health requires every dimension at or below one.</desc>
  <style>
    .dark #slo-vector { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094; --fig-danger:#e88f8f }
    @media (prefers-color-scheme: dark) { svg:root#slo-vector { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094; --fig-danger:#e88f8f } }
  </style>
  <rect width="380" height="300" rx="8" fill="var(--fig-paper, #f7f3e9)"/>
  <g font-family="system-ui, sans-serif" fill="var(--fig-ink, #252923)">
    <text x="20" y="28" font-size="19" font-weight="650">Budget consumed, per dimension</text>
    <text x="20" y="45" font-size="11" fill="var(--fig-rule, #6e6a5b)">limit = 1.0 · mean = 0.70 looks healthy</text>

    <g font-size="10">
      <text x="20" y="80" font-weight="650">availability</text>
      <rect x="120" y="66" width="180" height="18" rx="4" fill="none" stroke="var(--fig-outline, #364c50)"/>
      <rect x="120" y="66" width="72" height="18" rx="4" fill="var(--fig-outline, #364c50)" opacity="0.75"/>
      <text x="306" y="80" font-size="10">0.40</text>

      <text x="20" y="118" font-weight="650">latency</text>
      <rect x="120" y="104" width="180" height="18" rx="4" fill="none" stroke="var(--fig-outline, #364c50)"/>
      <rect x="120" y="104" width="108" height="18" rx="4" fill="var(--fig-outline, #364c50)" opacity="0.75"/>
      <text x="306" y="118" font-size="10">0.60</text>

      <text x="20" y="156" font-weight="650">freshness</text>
      <rect x="120" y="142" width="180" height="18" rx="4" fill="none" stroke="var(--fig-outline, #364c50)"/>
      <rect x="120" y="142" width="234" height="18" rx="4" fill="var(--fig-danger, #b4571f)" opacity="0.7"/>
      <text x="120" y="156" font-size="10" fill="var(--fig-danger, #b4571f)">1.30 over</text>
      <text x="372" y="156" font-size="10" text-anchor="end">1.30</text>

      <text x="20" y="194" font-weight="650">quality</text>
      <rect x="120" y="180" width="180" height="18" rx="4" fill="none" stroke="var(--fig-outline, #364c50)"/>
      <rect x="120" y="180" width="90" height="18" rx="4" fill="var(--fig-outline, #364c50)" opacity="0.75"/>
      <text x="306" y="194" font-size="10">0.50</text>
    </g>

    <line x1="120" y1="60" x2="120" y2="210" stroke="var(--fig-rule, #6e6a5b)" stroke-width="1"/>
    <line x1="300" y1="60" x2="300" y2="210" stroke="var(--fig-mark, #b4571f)" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="300" y="228" font-size="10" text-anchor="middle" fill="var(--fig-mark, #b4571f)">budget limit = 1.0</text>
    <line x1="120" y1="52" x2="300" y2="52" stroke="var(--fig-rule, #6e6a5b)" stroke-width="1" stroke-dasharray="2 3" opacity="0.7"/>
    <text x="114" y="64" font-size="9" text-anchor="end" fill="var(--fig-rule, #6e6a5b)">0</text>
    <text x="210" y="252" font-size="10" text-anchor="middle">fleet healthy iff max ≤ 1 · freshness stops promotion</text>
    <text x="210" y="272" font-size="9" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">burn rate = short-window violations vs allowed pace</text>
  </g>
</svg>
