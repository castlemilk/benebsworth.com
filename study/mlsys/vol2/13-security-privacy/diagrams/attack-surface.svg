<svg xmlns="http://www.w3.org/2000/svg" id="attack-surface" class="study-fig-fit" viewBox="0 0 380 300" role="img" aria-labelledby="attack-surface-title attack-surface-desc">
  <title id="attack-surface-title">The attack surface is the lifecycle</title>
  <desc id="attack-surface-desc">Five lifecycle stages each expose a different primary attack and first control: ingestion faces poisoning, training faces update attacks, the registry faces artifact theft, serving faces extraction and injection, and the edge faces compromised endpoints.</desc>
  <style>
    .dark #attack-surface { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094; --fig-danger:#e88f8f }
    @media (prefers-color-scheme: dark) { svg:root#attack-surface { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094; --fig-danger:#e88f8f } }
  </style>
  <rect width="380" height="300" rx="8" fill="var(--fig-paper, #f7f3e9)"/>
  <g font-family="system-ui, sans-serif" fill="var(--fig-ink, #252923)">
    <text x="20" y="26" font-size="19" font-weight="650">Five gates, five first controls</text>
    <text x="20" y="44" font-size="11" fill="var(--fig-rule, #6e6a5b)">each stage fails differently; name it first</text>

    <g font-size="10" fill="var(--fig-rule, #6e6a5b)">
      <text x="20" y="66" font-weight="650">stage</text>
      <text x="110" y="66" font-weight="650">primary attack</text>
      <text x="252" y="66" font-weight="650">first control</text>
    </g>
    <line x1="20" y1="72" x2="360" y2="72" stroke="var(--fig-rule, #6e6a5b)" stroke-width="1"/>

    <g font-size="10">
      <text x="20" y="96" font-weight="650">ingestion</text>
      <text x="110" y="96">poisoning</text>
      <text x="252" y="96">provenance checks</text>

      <text x="20" y="134" font-weight="650">training</text>
      <text x="110" y="134">update attacks</text>
      <text x="252" y="134">aggregation bounds</text>

      <text x="20" y="172" font-weight="650">registry</text>
      <text x="110" y="172" fill="var(--fig-danger, #b4571f)">artifact theft</text>
      <text x="252" y="172">signing + access ctl</text>

      <text x="20" y="210" font-weight="650">serving</text>
      <text x="110" y="210">extraction + injection</text>
      <text x="252" y="210">budgets + shaping</text>

      <text x="20" y="248" font-weight="650">edge</text>
      <text x="110" y="248">compromised endpoints</text>
      <text x="252" y="248">attestation</text>
    </g>

    <line x1="20" y1="258" x2="360" y2="258" stroke="var(--fig-rule, #6e6a5b)" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
    <text x="190" y="280" font-size="10" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">no availability or accuracy signal moves when one succeeds</text>
  </g>
</svg>
