<svg xmlns="http://www.w3.org/2000/svg" id="defense-stack" class="study-fig-fit" viewBox="0 0 380 300" role="img" aria-labelledby="defense-stack-title defense-stack-desc">
  <title id="defense-stack-title">Defenses are a stack, not a product</title>
  <desc id="defense-stack-desc">Four tiers own four boundaries: hardware roots prove what is genuine, platform controls bound what runs beside what, model-level shaping bounds what responses teach, and data-level privacy bounds what the release reveals.</desc>
  <style>
    .dark #defense-stack { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094; --fig-danger:#e88f8f }
    @media (prefers-color-scheme: dark) { svg:root#defense-stack { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094; --fig-danger:#e88f8f } }
  </style>
  <rect width="380" height="300" rx="8" fill="var(--fig-paper, #f7f3e9)"/>
  <g font-family="system-ui, sans-serif" fill="var(--fig-ink, #252923)">
    <text x="20" y="26" font-size="19" font-weight="650">Four tiers, four boundaries</text>
    <text x="20" y="44" font-size="11" fill="var(--fig-rule, #6e6a5b)">each layer spends a different axis of the fleet law</text>

    <g>
      <rect x="20" y="56" width="340" height="44" rx="6" fill="none" stroke="var(--fig-outline, #364c50)"/>
      <text x="32" y="76" font-size="11" font-weight="650">hardware root</text>
      <text x="140" y="76" font-size="10">measured boot · attestation</text>
      <text x="32" y="92" font-size="9" fill="var(--fig-rule, #6e6a5b)">owns: genuineness of silicon</text>

      <rect x="20" y="104" width="340" height="44" rx="6" fill="none" stroke="var(--fig-outline, #364c50)"/>
      <text x="32" y="124" font-size="11" font-weight="650">platform</text>
      <text x="140" y="124" font-size="10">isolation · confidential compute</text>
      <text x="32" y="140" font-size="9" fill="var(--fig-rule, #6e6a5b)">owns: what runs beside what</text>

      <rect x="20" y="152" width="340" height="44" rx="6" fill="none" stroke="var(--fig-outline, #364c50)"/>
      <text x="32" y="172" font-size="11" font-weight="650">model shaping</text>
      <text x="140" y="172" font-size="10">budgets · rounding · top-k</text>
      <text x="32" y="188" font-size="9" fill="var(--fig-rule, #6e6a5b)">owns: what responses teach</text>

      <rect x="20" y="200" width="340" height="44" rx="6" fill="none" stroke="var(--fig-outline, #364c50)"/>
      <text x="32" y="220" font-size="11" font-weight="650" fill="var(--fig-mark, #b4571f)">data privacy</text>
      <text x="140" y="220" font-size="10">DP-SGD · sanitization</text>
      <text x="32" y="236" font-size="9" fill="var(--fig-rule, #6e6a5b)">owns: what the release reveals</text>
    </g>

    <text x="190" y="266" font-size="10" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">a gap in any tier is a gap in the stack; no tier substitutes for another</text>
    <text x="190" y="284" font-size="9" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">cheaper tiers leak less; stronger tiers spend capacity</text>
  </g>
</svg>
