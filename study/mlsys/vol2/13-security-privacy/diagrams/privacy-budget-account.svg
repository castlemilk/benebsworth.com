<svg xmlns="http://www.w3.org/2000/svg" id="privacy-budget-account" class="study-fig-fit" viewBox="0 0 380 300" role="img" aria-labelledby="privacy-budget-account-title privacy-budget-account-desc">
  <title id="privacy-budget-account-title">The privacy budget is an account</title>
  <desc id="privacy-budget-account-desc">Ten releases at epsilon equals one each accumulate to a basic-composition bound of epsilon equals ten. A mechanism-specific accountant tightens the bound below the naive sum, and post-processing a fixed release adds nothing.</desc>
  <style>
    .dark #privacy-budget-account { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094; --fig-danger:#e88f8f }
    @media (prefers-color-scheme: dark) { svg:root#privacy-budget-account { --fig-paper:#252a27; --fig-ink:#efece1; --fig-mark:#ffab7c; --fig-outline:#acd4d6; --fig-rule:#93a094; --fig-danger:#e88f8f } }
  </style>
  <rect width="380" height="300" rx="8" fill="var(--fig-paper, #f7f3e9)"/>
  <g font-family="system-ui, sans-serif" fill="var(--fig-ink, #252923)">
    <text x="20" y="26" font-size="19" font-weight="650">Ten releases at ε = 1</text>
    <text x="20" y="44" font-size="11" fill="var(--fig-rule, #6e6a5b)">bars show cumulative ε spent after each release</text>

    <g font-size="9" fill="var(--fig-rule, #6e6a5b)">
      <text x="46" y="64" text-anchor="end">10</text>
      <text x="46" y="154" text-anchor="end">5</text>
      <text x="46" y="244" text-anchor="end">0</text>
    </g>
    <line x1="50" y1="60" x2="360" y2="60" stroke="var(--fig-rule, #6e6a5b)" stroke-width="1" opacity="0.5"/>
    <line x1="50" y1="150" x2="360" y2="150" stroke="var(--fig-rule, #6e6a5b)" stroke-width="1" opacity="0.35"/>
    <line x1="50" y1="240" x2="360" y2="240" stroke="var(--fig-rule, #6e6a5b)" stroke-width="1"/>
    <line x1="50" y1="60" x2="50" y2="240" stroke="var(--fig-rule, #6e6a5b)" stroke-width="1"/>

    <g>
      <rect x="56"  y="222" width="24" height="18"  rx="2" fill="var(--fig-outline, #364c50)" opacity="0.75"/>
      <rect x="87"  y="204" width="24" height="36"  rx="2" fill="var(--fig-outline, #364c50)" opacity="0.75"/>
      <rect x="118" y="186" width="24" height="54"  rx="2" fill="var(--fig-outline, #364c50)" opacity="0.75"/>
      <rect x="149" y="168" width="24" height="72"  rx="2" fill="var(--fig-outline, #364c50)" opacity="0.75"/>
      <rect x="180" y="150" width="24" height="90"  rx="2" fill="var(--fig-outline, #364c50)" opacity="0.75"/>
      <rect x="211" y="132" width="24" height="108" rx="2" fill="var(--fig-outline, #364c50)" opacity="0.75"/>
      <rect x="242" y="114" width="24" height="126" rx="2" fill="var(--fig-outline, #364c50)" opacity="0.75"/>
      <rect x="273" y="96"  width="24" height="144" rx="2" fill="var(--fig-outline, #364c50)" opacity="0.75"/>
      <rect x="304" y="78"  width="24" height="162" rx="2" fill="var(--fig-outline, #364c50)" opacity="0.75"/>
      <rect x="335" y="60"  width="24" height="180" rx="2" fill="var(--fig-outline, #364c50)" opacity="0.75"/>
    </g>

    <line x1="50" y1="159" x2="360" y2="159" stroke="var(--fig-mark, #b4571f)" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="54" y="152" font-size="9" fill="var(--fig-mark, #b4571f)">accountant ≈ 4.5</text>
    <text x="352" y="56" font-size="9" text-anchor="end" fill="var(--fig-rule, #6e6a5b)">basic bound ε = 10</text>

    <g font-size="9" fill="var(--fig-rule, #6e6a5b)" text-anchor="middle">
      <text x="68"  y="254">1</text>
      <text x="192" y="254">5</text>
      <text x="347" y="254">10</text>
    </g>
    <text x="190" y="276" font-size="10" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">basic composition sums the ε's; the accountant tracks the mechanism</text>
    <text x="190" y="294" font-size="10" text-anchor="middle" fill="var(--fig-rule, #6e6a5b)">post-processing a fixed release adds 0</text>
  </g>
</svg>
