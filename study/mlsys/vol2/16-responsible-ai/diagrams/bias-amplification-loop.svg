<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-label="Bias amplification feedback loop across retraining generations">
  <style>
    .bg{fill:var(--diagram-bg,#fff)}
    .title{font:600 15px var(--font-sans,sans-serif);fill:var(--diagram-ink,#1c1c1e)}
    .sub{font:11px var(--font-sans,sans-serif);fill:var(--diagram-ink-soft,#5a5a60)}
    .lbl{font:12px var(--font-sans,sans-serif);fill:var(--diagram-ink,#1c1c1e)}
    .sm{font:10.5px var(--font-sans,sans-serif);fill:var(--diagram-ink-soft,#5a5a60)}
    .node{fill:var(--diagram-accent-soft,#e8eefb);stroke:var(--diagram-accent,#3c64c8);stroke-width:1.3}
    .nt{font:600 11.5px var(--font-sans,sans-serif);fill:var(--diagram-ink,#1c1c1e)}
    .arr{stroke:var(--diagram-warn,#c85a3c);stroke-width:1.8;fill:none;marker-end:url(#ah3)}
    .gain{fill:var(--diagram-warn-fill,#f2ddd4);stroke:var(--diagram-warn,#c85a3c);stroke-width:1.3}
    .gt{font:600 11px var(--font-sans,sans-serif);fill:var(--diagram-warn,#c85a3c)}
    .brk{stroke:var(--diagram-ok,#3c8c4e);stroke-width:2.2;fill:none;stroke-dasharray:6 3;marker-end:url(#ah4)}
    .okt{font:600 11px var(--font-sans,sans-serif);fill:var(--diagram-ok,#3c8c4e)}
  </style>
  <defs>
    <marker id="ah3" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="var(--diagram-warn,#c85a3c)"/></marker>
    <marker id="ah4" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="var(--diagram-ok,#3c8c4e)"/></marker>
  </defs>
  <rect class="bg" width="760" height="420"/>
  <text class="title" x="30" y="32">The unconstrained retraining loop has positive gain</text>
  <text class="sub" x="30" y="51">Each generation inherits a reinforced version of the last generation's bias.</text>
  <!-- loop nodes: 4 stages in a circle -->
  <rect class="node" x="310" y="80" width="170" height="56" rx="8"/>
  <text class="nt" x="395" y="103" text-anchor="middle">historically biased</text>
  <text class="nt" x="395" y="120" text-anchor="middle">training data</text>
  <rect class="node" x="530" y="200" width="180" height="56" rx="8"/>
  <text class="nt" x="620" y="223" text-anchor="middle">model outputs shape</text>
  <text class="nt" x="620" y="240" text-anchor="middle">user behavior</text>
  <rect class="node" x="310" y="310" width="170" height="56" rx="8"/>
  <text class="nt" x="395" y="333" text-anchor="middle">operational data</text>
  <text class="nt" x="395" y="350" text-anchor="middle">captures reinforced bias</text>
  <rect class="node" x="60" y="200" width="180" height="56" rx="8"/>
  <text class="nt" x="150" y="223" text-anchor="middle">retraining deepens</text>
  <text class="nt" x="150" y="240" text-anchor="middle">the bias next generation</text>
  <!-- arrows clockwise -->
  <path class="arr" d="M 480 108 C 560 130, 610 155, 618 196"/>
  <path class="arr" d="M 620 256 C 615 290, 560 320, 484 332"/>
  <path class="arr" d="M 310 338 C 220 330, 152 300, 148 260"/>
  <path class="arr" d="M 150 200 C 155 160, 220 122, 306 110"/>
  <!-- loop gain badge -->
  <rect class="gain" x="330" y="192" width="130" height="46" rx="8"/>
  <text class="gt" x="395" y="212" text-anchor="middle">loop gain &gt; 0</text>
  <text class="gt" x="395" y="228" text-anchor="middle">divergent amplifier</text>
  <!-- break the loop -->
  <path class="brk" d="M 700 130 L 640 196"/>
  <text class="okt" x="600" y="105">break it at data collection:</text>
  <text class="sm" x="600" y="122">sampling policy, labeling audit,</text>
  <text class="sm" x="600" y="136">not just model-side mitigation</text>
  <text class="sm" x="30" y="400">Model-only debiasing treats one generation; the loop re-creates the problem in the next training corpus.</text>
</svg>
